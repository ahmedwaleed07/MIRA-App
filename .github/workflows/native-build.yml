name: MIRA Native Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web-parity:
    runs-on: ubuntu-latest
    outputs:
      web_sha256: ${{ steps.fingerprint.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare approved source
        run: npm run prepare:web
      - name: Verify all native web assets
        run: |
          node scripts/verify-mobile-parity.mjs
          node scripts/validate-mobile-parity-policy.mjs
      - name: Establish common iOS/Android source fingerprint
        id: fingerprint
        run: echo "sha=$(node scripts/verify-mobile-parity.mjs --digest-only)" >> "$GITHUB_OUTPUT"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Sync published web source into mobile bundle
        run: npm run prepare:web
      - name: Verify identical iOS/Android release payload
        run: node scripts/verify-mobile-parity.mjs --expected="${{ needs.web-parity.outputs.web_sha256 }}"
      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Build Android release bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: mira-android-release-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    needs: web-parity
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Sync published web source into mobile bundle
        run: npm run prepare:web
      - name: Verify identical iOS/Android release payload
        run: node scripts/verify-mobile-parity.mjs --expected="${{ needs.web-parity.outputs.web_sha256 }}"
      - name: Generate iOS project
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: Build iOS simulator target
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: mira-ios-project
          path: ios
          if-no-files-found: error
