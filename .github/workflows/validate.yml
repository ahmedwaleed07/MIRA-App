name: MIRA Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check docs/taxonomy.js
          node --check docs/mira-cloud.js
          node scripts/validate-docs.mjs
          node scripts/validate-dashboard.mjs
          node scripts/validate-merchant-session.mjs
          node scripts/validate-order-flow.mjs
          node scripts/validate-order-contract.mjs
          node --check docs/mira-notifications.js
          node --check docs/mira-admin-notifications.js
          node scripts/validate-notifications.mjs
          node scripts/validate-auth-ui.mjs
          node scripts/validate-auth-flow.mjs
          node scripts/validate-remember-me.mjs
          node scripts/validate-launch-integration.mjs
          node --check functions/_lib/mira-otp.js
          node --check functions/api/otp/request.js
          node --check functions/api/otp/verify.js
          node --check functions/api/otp/policy.js
          node scripts/validate-cloudflare-otp.mjs
          node scripts/validate-card-photos.mjs
          node scripts/validate-real-estate.mjs
      - name: Verify parity of browser and native assets
        run: npm run prepare:web
      - name: Byte-for-byte mobile parity and workflow policy
        run: |
          node scripts/verify-mobile-parity.mjs
          node scripts/validate-mobile-parity-policy.mjs
      - name: Validate required release files
        run: |
          test -f www/index.html
          test -f www/welcome.html
          test -f www/home.html
          test -f www/taxonomy.js
          test -f www/mira-cloud.js
          test -f www/business.html
          test -f www/admin.html
          test -f www/assets/categories/real-estate.webp
          test -f docs/privacy.html
          test -f docs/terms.html
          test -f docs/delete-account.html
          test -f docs/taxonomy.js
          test -f docs/mira-cloud.js
          test -f docs/cart.html
          test -f docs/checkout.html
          test -f docs/orders.html
          test -f docs/business.html
          test -f docs/admin.html
          test -f capacitor.config.ts
          test -f package.json
      - name: Install Capacitor dependencies
        run: npm install
      - name: Capacitor doctor
        run: npx cap doctor || true
