<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MIRA — Browse</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--pink:#FC618F;--pink2:#800020;--peach:#800020;--blue:#FFFFFF;--ink:#FFFFFF;--muted:#FC618F;--line:#800020;--bg:#800020;--mira:#FC618F}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100svh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));background:radial-gradient(circle at 0 0,#800020,transparent 26%),radial-gradient(circle at 100% 0,#800020,transparent 26%),#800020}.top{display:flex;align-items:center;justify-content:space-between}.back{border:0;background:#800020;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--pink);box-shadow:0 8px 22px #800020}.back svg{width:22px}.brandmark{width:108px;height:35px;background:var(--mira);-webkit-mask:url('assets/mira_wordmark.svg') center/contain no-repeat;mask:url('assets/mira_wordmark.svg') center/contain no-repeat}.spacer{width:42px}.title{font-size:25px;font-weight:800;margin-top:24px}.sub{font-size:11px;color:var(--muted);margin-top:5px}.search{margin-top:17px;background:#800020;border:1px solid var(--line);border-radius:16px;padding:11px 13px;display:flex;gap:9px;align-items:center}.search svg{width:20px;color:var(--pink)}.search input{border:0;outline:0;width:100%;font:500 12px Poppins;color:var(--ink)}.grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}.card{background:#800020;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 26px #800020;cursor:pointer}.visual{height:105px;background:linear-gradient(135deg,#800020,#800020 45%,#800020);position:relative}.badge{position:absolute;top:11px;left:11px;background:#800020;color:var(--pink);border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:8px;font-weight:800}.logo{position:absolute;right:13px;bottom:12px;width:48px;height:48px;border-radius:15px;background:#800020;display:grid;place-items:center;color:var(--pink);font-weight:800;font-size:17px}.body{padding:13px}.body h3{margin:0 0 4px;font-size:13px}.body p{margin:0;color:var(--muted);font-size:10px;line-height:1.5}.meta{display:flex;align-items:center;justify-content:space-between;margin-top:11px}.discount{font-size:13px;font-weight:800;color:var(--pink)}.cta{border:0;border-radius:11px;padding:8px 10px;background:linear-gradient(90deg,var(--pink),var(--pink2));color:#800020;font:700 10px Poppins}.empty{margin-top:50px;text-align:center;color:var(--muted);font-size:12px}[dir=rtl] .badge{left:auto;right:11px}[dir=rtl] .logo{right:auto;left:13px}</style><link rel="stylesheet" href="mira-pink-theme.css?v=20261008-luxe-contrast-2"><link rel="stylesheet" href="mira-favorite-heart.css?v=20261009-heart-only-1"></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><div class="brandmark" aria-label="MIRA"></div><div class="spacer"></div></div><div class="title" id="title"></div><div class="sub" id="sub"></div><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search"></label><div class="grid" id="grid"></div></main><script>const l=localStorage.getItem('mira_lang')||'en';document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';const section=new URLSearchParams(location.search).get('section')||'featured';const T={en:{featured:'Featured Offers',flash:'Flash Sales',recent:'Recently Added',interest:'Based on Your Interests',near:'Near You',sub:'Browse all active placements in this section.',search:'Search this section',view:'View',sponsored:'Sponsored'},ar:{featured:'العروض المميزة',flash:'العروض السريعة',recent:'أضيف حديثاً',interest:'حسب اهتماماتك',near:'قريب منك',sub:'تصفح جميع المساحات النشطة ضمن هذا القسم.',search:'ابحث داخل هذا القسم',view:'عرض',sponsored:'مدفوع'},es:{featured:'Ofertas destacadas',flash:'Ofertas flash',recent:'Añadido recientemente',interest:'Según tus intereses',near:'Cerca de ti',sub:'Explora todas las ubicaciones activas de esta sección.',search:'Buscar en esta sección',view:'Ver',sponsored:'Patrocinado'},ru:{featured:'Избранные предложения',flash:'Flash Sales',recent:'Недавно добавлено',interest:'По вашим интересам',near:'Рядом с вами',sub:'Все активные размещения в этом разделе.',search:'Поиск в разделе',view:'Открыть',sponsored:'Реклама'},tr:{featured:'Öne Çıkan Fırsatlar',flash:'Flash Sales',recent:'Yeni Eklenenler',interest:'İlgi Alanlarına Göre',near:'Yakınındaki Fırsatlar',sub:'Bu bölümdeki tüm aktif gösterimleri incele.',search:'Bu bölümde ara',view:'Görüntüle',sponsored:'Sponsorlu'}};const t=T[l]||T.en;title.textContent=t[section]||t.featured;sub.textContent=t.sub;q.placeholder=t.search;const DATA={featured:[['Premium Partner','30% OFF','A'],['Featured Brand','20% OFF','B'],['Signature Store','15% OFF','S'],['Top Partner','25% OFF','T']],flash:[['MIRA Partner','40% OFF','F'],['Flash Partner','25% OFF','S'],['Quick Deal','35% OFF','Q'],['Today Partner','20% OFF','T']],recent:[['New Partner Store','15% OFF','N'],['Recent Brand','20% OFF','R'],['Fresh Store','10% OFF','F'],['New Arrival Partner','25% OFF','A']],interest:[['Matched Partner','25% OFF','M'],['Recommended Offer','20% OFF','R'],['Interest Partner','30% OFF','I'],['For You Store','15% OFF','Y']],near:[['Local Partner','20% OFF','L'],['Partner Nearby','15% OFF','P'],['Area Store','25% OFF','A'],['Nearby Offer','30% OFF','N']]};const rows=DATA[section]||DATA.featured;function draw(){const s=q.value.trim().toLowerCase();grid.innerHTML='';rows.filter(x=>!s||x[0].toLowerCase().includes(s)||x[1].toLowerCase().includes(s)).forEach((x,i)=>{const c=document.createElement('article');c.className='card';c.innerHTML=`<div class="visual"><span class="badge">${t.sponsored}</span><div class="logo">${x[2]}</div></div><div class="body"><h3>${x[0]}</h3><p>MIRA managed placement</p><div class="meta"><span class="discount">${x[1]}</span><button class="cta">${t.view}</button></div></div>`;c.onclick=()=>{const type=section==='recent'?'store':'offer';location.href='offer.html?'+new URLSearchParams({id:section+'-'+i,type,name:x[0],discount:x[1],letter:x[2]}).toString()};grid.appendChild(c)});if(!grid.children.length)grid.innerHTML='<div class="empty">—</div>'}q.oninput=draw;draw();</script><script src="mira-favorites.js?v=20261008-cards"></script></body></html>
