<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#800020"><title>MIRA | سوق الجمعة</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8fb;color:#461326;font-family:Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:16px}.hero{min-height:280px;border-radius:22px;background:linear-gradient(0deg,#42091fdf,#80002033),url('assets/heritage-markets/market-mira-bazaar.jpg') center/cover;display:flex;flex-direction:column;justify-content:end;padding:25px;color:white}.hero h1{font-size:38px;margin:0 0 8px}.hero p{max-width:660px;line-height:1.8}.back{display:inline-block;margin:10px 0;color:#800020}.notice{background:#fff0f5;border-right:4px solid #800020;padding:14px;margin:15px 0;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card,form{background:white;border:1px solid #ecd4de;border-radius:15px;padding:17px;box-shadow:0 5px 15px #80002010}.card h3{margin:8px 0}.badge{display:inline-block;background:#ffe3ed;color:#800020;padding:5px 10px;border-radius:20px;font-size:12px}.price{font-weight:bold;color:#800020}input,textarea,select{width:100%;padding:11px;margin:7px 0 13px;border:1px solid #dec4ce;border-radius:9px;font:inherit}button,.contact{border:0;border-radius:10px;background:#800020;color:white;padding:11px 17px;cursor:pointer;text-decoration:none;display:inline-block}h2{margin-top:30px}label{font-weight:bold;font-size:14px}.empty{padding:24px;text-align:center;border:1px dashed #d7a8b9;border-radius:12px}.lang{float:left}small{color:#775765}</style></head><body><div class="wrap"><a class="back" href="home.html" id="back">← الرئيسية</a><select class="lang" id="language" aria-label="Language"><option value="ar">العربية</option><option value="en">English</option><option value="es">Español</option><option value="ru">Русский</option><option value="tr">Türkçe</option></select><header class="hero"><h1 id="title"></h1><p id="intro"></p></header><div class="notice" id="notice"></div><h2 id="listingHeading"></h2><div id="items" class="grid"></div><h2 id="publishHeading"></h2><form id="form"><label id="itemLabel" for="item"></label><input id="item" maxlength="100" required><label id="descriptionLabel" for="description"></label><textarea id="description" maxlength="800" rows="3" required></textarea><label id="conditionLabel" for="condition"></label><select id="condition"><option value="used"></option><option value="new"></option></select><label id="priceLabel" for="price"></label><input id="price" type="number" min="0" required><label id="phoneLabel" for="phone"></label><input id="phone" type="tel" pattern="[0-9+ ]{7,18}" required><button id="publish" type="submit"></button></form></div><script>
const tr={ar:['سوق الجمعة','مساحة لبيع الأغراض الشخصية الجديدة والمستعملة. أي شخص عنده غرض يريد يبيعه يگدر يعرضه هنا، بدون محل وبدون بسطية.','تنبيه: الإعلانات المنشورة هنا تُحفظ على هذا الجهاز فقط حالياً، ولا تظهر للآخرين حتى يتم ربط السوق بقاعدة البيانات. البيع والدفع والاتفاق على التسليم مباشرة بين البائع والمشتري؛ MIRA لا تستلم ثمن الأغراض.','الأغراض المعروضة','لا توجد أغراض منشورة على هذا الجهاز بعد.','أعرض غرضك','اسم الغرض','وصف الغرض','الحالة','مستعمل','جديد','السعر (د.ع)','رقم هاتف البائع','نشر الغرض','تواصل مع البائع','الرئيسية'],en:['Friday Market','An open space to sell new and pre-owned personal belongings. Anyone can list an item without renting a shop or stall.','Notice: Listings are currently saved on this device only and will not be visible to others until the market is connected to the database. Buyers and sellers arrange payment and delivery directly; MIRA does not collect item payments.','Listed items','No items listed on this device yet.','List your item','Item name','Item description','Condition','Used','New','Price (IQD)','Seller phone number','Post item','Contact seller','Home'],es:['Mercado del Viernes','Un espacio abierto para vender artículos personales nuevos y usados, sin tienda ni puesto.','Aviso: Los anuncios se guardan solo en este dispositivo hasta conectar la base de datos. El pago y la entrega se acuerdan directamente entre comprador y vendedor; MIRA no cobra las compras.','Artículos publicados','Todavía no hay artículos en este dispositivo.','Publica tu artículo','Nombre del artículo','Descripción','Estado','Usado','Nuevo','Precio (IQD)','Teléfono del vendedor','Publicar','Contactar al vendedor','Inicio'],ru:['Пятничный рынок','Открытая площадка для продажи новых и подержанных личных вещей без магазина или торгового места.','Внимание: объявления пока сохраняются только на этом устройстве до подключения базы данных. Оплата и доставка согласуются напрямую между продавцом и покупателем; MIRA не принимает оплату за товары.','Объявления','На этом устройстве пока нет объявлений.','Разместить вещь','Название','Описание','Состояние','Б/у','Новое','Цена (IQD)','Телефон продавца','Опубликовать','Связаться с продавцом','Главная'],tr:['Cuma Pazarı','Mağaza veya tezgâh olmadan yeni ve ikinci el kişisel eşyalarınızı satabileceğiniz açık alan.','Uyarı: İlanlar veritabanı bağlanana kadar yalnızca bu cihazda saklanır. Ödeme ve teslimat alıcı ile satıcı arasında yapılır; MIRA ürün ödemesi almaz.','İlanlar','Bu cihazda henüz ilan yok.','Ürününü ilan et','Ürün adı','Açıklama','Durum','İkinci el','Yeni','Fiyat (IQD)','Satıcı telefonu','İlanı yayınla','Satıcıyla iletişim','Ana Sayfa']};
let lang=localStorage.getItem('mira_lang')||'ar';if(!tr[lang])lang='ar';const ids=['title','intro','notice','listingHeading','empty','publishHeading','itemLabel','descriptionLabel','conditionLabel','used','new','priceLabel','phoneLabel','publish','contact','back'];const read=()=>{try{return JSON.parse(localStorage.getItem('mira_friday_items')||'[]')}catch{return []}};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('language').value=lang;const t=tr[lang];for(const [i,id] of ids.entries()){const el=document.getElementById(id);if(el)el.textContent=t[i]}document.querySelector('#condition option[value="used"]').textContent=t[9];document.querySelector('#condition option[value="new"]').textContent=t[10];document.getElementById('back').textContent='← '+t[15];const items=read();document.getElementById('items').innerHTML=items.length?items.map(x=>'<article class="card"><span class="badge">'+esc(x.condition==='new'?t[10]:t[9])+'</span><h3>'+esc(x.name)+'</h3><p>'+esc(x.description)+'</p><p class="price">'+Number(x.price).toLocaleString()+' IQD</p><a class="contact" href="tel:'+encodeURIComponent(x.phone)+'">'+t[14]+'</a></article>').join(''):'<div class="empty">'+t[4]+'</div>'}document.getElementById('language').onchange=e=>{lang=e.target.value;localStorage.setItem('mira_lang',lang);render()};document.getElementById('form').onsubmit=e=>{e.preventDefault();const x={name:document.getElementById('item').value.trim(),description:document.getElementById('description').value.trim(),condition:document.getElementById('condition').value,price:document.getElementById('price').value,phone:document.getElementById('phone').value.trim()};if(!x.name||!x.description||!x.phone)return;const list=read();list.unshift(x);localStorage.setItem('mira_friday_items',JSON.stringify(list.slice(0,100)));e.target.reset();render()};render();</script></body></html>
