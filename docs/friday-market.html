let lang=localStorage.getItem('mira_lang')||'ar';
if(!tr[lang])lang='ar';
const ids=['title','intro','notice','listingHeading','empty','publishHeading','itemLabel','descriptionLabel','conditionLabel','used','new','priceLabel','phoneLabel','publish','contact','back'];
let listings=[],status='loading',feedbackKey='',selectedPhotos=[],selectionError='',posting=false;
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showFeedback(){
 const box=document.getElementById('feedback');box.hidden=!feedbackKey;
 if(!feedbackKey){box.textContent='';return}
 const t=ui[lang],p=photoUI[lang];box.textContent=p[feedbackKey]||t[feedbackKey]||t.postError;
 if(feedbackKey==='signin'){
  const a=document.createElement('a');a.href='signin.html?return=friday-market.html';a.textContent=t.signinLink;box.appendChild(a);
 }
}
function render(){
 const t=tr[lang],messages=ui[lang],missing=status==='missing',failed=status==='unavailable';
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.title='MIRA | '+t[0];
 document.getElementById('language').value=lang;
 for(const [i,id] of ids.entries()){const el=document.getElementById(id);if(el)el.textContent=t[i]}
 document.querySelector('#condition option[value="used"]').textContent=t[9];
 document.querySelector('#condition option[value="new"]').textContent=t[10];
 document.getElementById('back').textContent='← '+t[15];
 const p=photoUI[lang];
 document.getElementById('photosLabel').textContent=p.label;
 document.getElementById('photosHint').textContent=p.hint;
 document.getElementById('photos').setAttribute('aria-label',p.label);
 renderPhotoPreviews();
 document.getElementById('notice').textContent=messages.policy+(missing?' '+messages.missing:failed?' '+messages.unavailable:'');
 const retry=document.getElementById('retry');retry.hidden=!missing&&!failed;retry.textContent=messages.retry;
 const publish=document.getElementById('publish');publish.disabled=status!=='ready'||posting;
 const items=document.getElementById('items');
 if(status==='loading'){items.innerHTML='<div class="empty">'+esc(messages.loading)+'</div>'}
 else if(status!=='ready'){items.innerHTML='<div class="empty">'+esc(missing?messages.missing:messages.unavailable)+'</div>'}
 else if(!listings.length){items.innerHTML='<div class="empty">'+esc(messages.empty)+'</div>'}
 else{items.innerHTML=listings.map((x,index)=>'<article class="card">'+listingGallery(x,index)+'<span class="badge">'+esc(x.condition==='new'?t[10]:t[9])+'</span><h3>'+esc(x.name)+'</h3><p>'+esc(x.description)+'</p><p class="price">'+Number(x.price).toLocaleString(lang==='ar'?'ar-IQ':'en-US')+' IQD</p><a class="contact" href="tel:'+esc(String(x.phone).replace(/[^+0-9]/g,''))+'">'+esc(t[14])+'</a><button type="button" class="mira-report-trigger" data-mira-report="friday" data-report-id="'+esc(x.id)+'">'+esc(({ar:'إبلاغ',en:'Report',es:'Denunciar',ru:'Пожаловаться',tr:'Bildir'})[lang]||'Report')+'</button></article>').join('')}
 showFeedback();
}
async function loadListings(){
 status='loading';render();
 try{
  const rows=await MiraCloud.request('mira_friday_listings?select=id,title,description,item_condition,price_iqd,contact_phone,image_paths,status,created_at&status=eq.active&order=created_at.desc&limit=100');
  if(!Array.isArray(rows))throw Error('Invalid listings response');
  listings=rows.map(x=>({name:x.title,description:x.description,condition:x.item_condition,price:x.price_iqd,phone:x.contact_phone,id:x.id,images:Array.isArray(x.image_paths)?x.image_paths:[]}));
  status='ready';
 }catch(e){
  const detail=String(e?.message||e||'');
  status=/PGRST205|mira_friday_listings.*schema cache|could not find the table/i.test(detail)?'missing':'unavailable';
  listings=[];
  console.warn('Friday Market loading failed:',status);
 }
 render();
}

const ALLOWED_TYPES={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};
const MAX_PHOTO_BYTES=5*1024*1024,MAX_PHOTOS=6;
function photoPublicUrl(path){
 const c=window.MIRA_SUPABASE;
 if(typeof path!=='string'||!/^[-a-f0-9]{36}\/[-a-f0-9]{36}\/[A-Za-z0-9._-]+\.(jpg|png|webp)$/.test(path))return '';
 return c.url+'/storage/v1/object/public/mira-friday-items/'+path.split('/').map(encodeURIComponent).join('/');
}
function listingGallery(item,index){
 const paths=(item.images||[]).slice(0,MAX_PHOTOS).map(photoPublicUrl).filter(Boolean);
 if(!paths.length){
  const alt=({ar:'صورة توضيحية للسوق، وليست صورة الغرض',en:'Illustrative marketplace photo, not the listed item',es:'Imagen ilustrativa del mercado, no del artículo',ru:'Иллюстрация рынка, не самого товара',tr:'Ürünün kendisi değil, temsili pazar görseli'})[lang]||'Illustrative marketplace photo';
  return '<div class="photo-gallery"><img class="photo-main" loading="lazy" src="assets/heritage-markets/market-mira-bazaar.jpg" alt="'+esc(alt)+'"><small>'+esc(alt)+'</small></div>';
 }
 const p=photoUI[lang];
 const thumbs=paths.length>1?'<div class="photo-thumbs">'+paths.map((url,i)=>'<button type="button" class="photo-thumb" data-gallery="'+index+'" data-photo="'+i+'" aria-label="'+esc(p.thumb)+' '+(i+1)+'" aria-pressed="'+(i===0?'true':'false')+'"><img loading="lazy" src="'+esc(url)+'" alt=""></button>').join('')+'</div>':'';
 return '<div class="photo-gallery"><img class="photo-main" loading="lazy" src="'+esc(paths[0])+'" alt="'+esc(p.image)+' — '+esc(item.name)+'">'+thumbs+'</div>';
}
function renderPhotoPreviews(){
 const p=photoUI[lang],root=document.getElementById('photosPreview');
 document.getElementById('photosCount').textContent=p.counter(selectedPhotos.length);
 root.replaceChildren();
 selectedPhotos.forEach((entry,index)=>{
  const wrap=document.createElement('div');wrap.className='photo-preview-item';
  const img=document.createElement('img');img.src=entry.url;img.alt=p.preview+' '+(index+1);
  const button=document.createElement('button');button.type='button';button.className='photo-remove';button.dataset.removePhoto=String(index);button.textContent='×';button.setAttribute('aria-label',p.remove+' '+(index+1));
  wrap.append(img,button);root.append(wrap);
 });
}
function clearPhotos(){
 for(const photo of selectedPhotos)URL.revokeObjectURL(photo.url);
 selectedPhotos=[];document.getElementById('photos').value='';renderPhotoPreviews();
}
document.getElementById('photos').addEventListener('change',event=>{
 const files=Array.from(event.target.files||[]);
 event.target.value='';
 feedbackKey='';selectionError='';
 for(const file of files){
  if(selectedPhotos.length>=MAX_PHOTOS){selectionError='max';break}
  if(!ALLOWED_TYPES[file.type]){selectionError='type';continue}
  if(!file.size||file.size>MAX_PHOTO_BYTES){selectionError='size';continue}
  if(selectedPhotos.some(p=>p.file.name===file.name&&p.file.size===file.size&&p.file.lastModified===file.lastModified))continue;
  selectedPhotos.push({file,url:URL.createObjectURL(file)});
 }
 if(selectionError)feedbackKey=selectionError;
 render();
});
document.getElementById('photosPreview').addEventListener('click',event=>{
 const btn=event.target.closest('[data-remove-photo]');
 if(!btn||posting)return;
 const index=Number(btn.dataset.removePhoto);
 if(!Number.isInteger(index)||index<0||index>=selectedPhotos.length)return;
 const removed=selectedPhotos.splice(index,1)[0];URL.revokeObjectURL(removed.url);
 feedbackKey='';render();
});
document.getElementById('items').addEventListener('click',event=>{
 const btn=event.target.closest('[data-gallery][data-photo]');
 if(!btn)return;
 const card=btn.closest('.card'),item=listings[Number(btn.dataset.gallery)];
 const url=photoPublicUrl(item?.images?.[Number(btn.dataset.photo)]);
 if(!card||!url)return;
 const main=card.querySelector('.photo-main');
 if(main)main.src=url;
 card.querySelectorAll('.photo-thumb').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
});
function randomUuid(){
 if(globalThis.crypto?.randomUUID)return crypto.randomUUID();
 const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);
 bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;
 const h=Array.from(bytes,n=>n.toString(16).padStart(2,'0')).join('');
 return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
async function uploadItemPhoto(file,path){
 await MiraCloud.ensureFreshSession();
 const c=window.MIRA_SUPABASE;
 const res=await fetch(c.url+'/storage/v1/object/mira-friday-items/'+path,{
  method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+MiraCloud.token(),'Content-Type':file.type,'x-upsert':'false'},body:file
 });
 if(!res.ok)throw Error('Storage upload failed');
}
async function deleteItemPhoto(path){
 await MiraCloud.ensureFreshSession();
 const c=window.MIRA_SUPABASE;
 const res=await fetch(c.url+'/storage/v1/object/mira-friday-items/'+path,{
  method:'DELETE',headers:{apikey:c.key,Authorization:'Bearer '+MiraCloud.token()}
 });
 if(!res.ok)console.warn('Unable to clean up an unpublished photo');
}
document.getElementById('language').addEventListener('change',e=>{
 lang=e.target.value;localStorage.setItem('mira_lang',lang);render()
});
document.getElementById('retry').addEventListener('click',loadListings);

document.getElementById('form').addEventListener('submit',async e=>{
 e.preventDefault();
 if(status!=='ready'||posting)return;
 const form=e.currentTarget;
 const x={name:document.getElementById('item').value.trim(),description:document.getElementById('description').value.trim(),condition:document.getElementById('condition').value,price:Number(document.getElementById('price').value),phone:document.getElementById('phone').value.trim()};
 if(!x.name||!x.description||!x.phone||!Number.isSafeInteger(x.price)||x.price<0)return;
 feedbackKey='';
 try{
  MiraCloud.loadSession();
  if(!MiraCloud.session?.access_token){feedbackKey='signin';render();return}
  await MiraCloud.ensureFreshSession();
  const user=await MiraCloud.getCurrentUser();
  if(!user?.id){feedbackKey='signin';render();return}
  posting=true;feedbackKey=selectedPhotos.length?'uploading':'';render();
  const listingId=randomUuid(),uploaded=[];
  let inserted=false;
  try{
   for(let i=0;i<selectedPhotos.length;i++){
    const file=selectedPhotos[i].file;
    const path=user.id+'/'+listingId+'/'+(i+1)+'-'+randomUuid().slice(0,8)+'.'+ALLOWED_TYPES[file.type];
    await uploadItemPhoto(file,path);
    uploaded.push(path);
   }
   await MiraCloud.request('mira_friday_listings',{method:'POST',requireAuth:true,body:JSON.stringify({id:listingId,seller_id:user.id,title:x.name,description:x.description,item_condition:x.condition,price_iqd:x.price,contact_phone:x.phone,image_paths:uploaded})});
   inserted=true;
  }finally{
   if(!inserted&&uploaded.length){
    for(const path of uploaded){try{await deleteItemPhoto(path)}catch(_){console.warn('Photo cleanup failed')}}
   }
  }
  clearPhotos();form.reset();feedbackKey='posted';
  await loadListings();
 }catch(err){
  feedbackKey='uploadError';
  console.warn('Friday Market submission failed');
 }finally{posting=false;render()}
});

render();MiraCloud.loadSession();loadListings();
