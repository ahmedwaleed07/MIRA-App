<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MIRA — Store</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--coral:#FF7F73;--pink:#FF4D8D;--pink2:#FF7EB6;--peach:#FFC8A1;--burgundy:#8F123F;--ink:#A62C63;--muted:#B86A8E;--line:#F2D6E0;--bg:#FFF9F8;--mira:#D94F8A}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--burgundy)}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100svh;background:linear-gradient(180deg,#FFF9F8 0%,#fff 40%,#FFF8F8 100%);padding:calc(14px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between}.back{border:0;background:#fff;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--pink);box-shadow:0 8px 22px rgba(92,50,76,.08)}.back svg{width:22px;height:22px}.brandmark{width:105px;height:34px;background:var(--mira);-webkit-mask:url('assets/mira_wordmark.svg') center/contain no-repeat;mask:url('assets/mira_wordmark.svg') center/contain no-repeat}.spacer{width:42px}.cover{height:205px;margin-top:18px;border-radius:28px;background:linear-gradient(135deg,var(--coral),var(--pink2),var(--peach));background-size:cover;background-position:center;position:relative;overflow:hidden;box-shadow:0 18px 42px rgba(92,50,76,.13)}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(143,18,63,.02),rgba(143,18,63,.18))}.logo{position:absolute;left:18px;bottom:18px;z-index:2;width:76px;height:76px;border-radius:23px;background:#fff;display:grid;place-items:center;color:var(--pink);font-size:26px;font-weight:800;overflow:hidden;box-shadow:0 10px 25px rgba(92,50,76,.18)}.logo img{width:100%;height:100%;object-fit:contain;padding:8px}.content{padding:18px 2px 0}.category{font-size:10px;font-weight:700;color:var(--pink)}h1{font-size:25px;line-height:1.2;margin:5px 0 8px;letter-spacing:-.4px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:700;color:var(--muted)}.section{margin-top:21px}.section h2{font-size:15px;margin:0 0 10px}.info{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 22px rgba(92,50,76,.04)}.row{display:flex;gap:9px;align-items:flex-start;font-size:11px;color:var(--muted);line-height:1.5}.row+.row{margin-top:10px}.row svg{width:18px;height:18px;color:var(--pink);flex:0 0 auto}.offers{display:grid;gap:11px}.offer-card{border:1px solid var(--line);background:#fff;border-radius:19px;padding:12px;display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;box-shadow:0 9px 24px rgba(92,50,76,.05);cursor:pointer}.offer-img{height:76px;border-radius:14px;background:linear-gradient(135deg,#FFF0F4,#FFF4EF);background-size:cover;background-position:center}.offer-card h3{font-size:12px;margin:0 0 5px}.offer-card p{font-size:9.5px;color:var(--muted);margin:0}.discount{display:inline-block;margin-top:7px;color:var(--pink);font-size:11px;font-weight:800}.empty{text-align:center;padding:24px 10px;color:var(--muted);font-size:11px}.primary{display:block;margin-top:10px;width:100%;border:0;border-radius:14px;padding:12px;background:linear-gradient(90deg,var(--pink),var(--pink2));color:#fff;font:700 12px Poppins;text-decoration:none;text-align:center}[dir=rtl] .logo{left:auto;right:18px}
</style></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><div class="brandmark" aria-label="MIRA"></div><div class="spacer"></div></div><section class="cover" id="cover"><div class="logo" id="logo">M</div></section><div class="content"><div class="category" id="category"></div><h1 id="name"></h1><div class="meta"><span class="chip" id="market"></span><span class="chip" id="status"></span></div><section class="section"><h2 id="contactTitle"></h2><div class="info" id="contact"></div></section><section class="section"><h2 id="offersTitle"></h2><div class="offers" id="offers"></div></section></div></main><script>
const q=new URLSearchParams(location.search),lang=localStorage.getItem('mira_lang')||'en';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';const T={en:{contact:'Store details',offers:'Available offers',active:'Active',inactive:'Inactive',none:'No active offers for this store yet.'},ar:{contact:'تفاصيل المتجر',offers:'العروض المتاحة',active:'فعال',inactive:'غير فعال',none:'ماكو عروض فعالة لهذا المتجر حالياً.'},es:{contact:'Detalles de la tienda',offers:'Ofertas disponibles',active:'Activo',inactive:'Inactivo',none:'No hay ofertas activas.'},ru:{contact:'Информация о магазине',offers:'Доступные предложения',active:'Активен',inactive:'Неактивен',none:'Активных предложений пока нет.'},tr:{contact:'Mağaza bilgileri',offers:'Mevcut fırsatlar',active:'Aktif',inactive:'Pasif',none:'Henüz aktif fırsat yok.'}};const t=T[lang]||T.en;function list(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}const stores=list('mira_admin_stores'),allOffers=list('mira_admin_offers'),s=stores.find(x=>x.id===q.get('id'));if(!s){location.replace('home.html')}else{category.textContent=s.category||'';name.textContent=s.name;market.textContent=[s.country,s.city].filter(Boolean).join(' · ');status.textContent=s.status==='active'?t.active:t.inactive;contactTitle.textContent=t.contact;offersTitle.textContent=t.offers;if(s.cover)cover.style.backgroundImage='url("'+s.cover.replace(/"/g,'%22')+'")';if(s.logo)logo.innerHTML='<img src="'+s.logo+'" alt="">';else logo.textContent=(s.name[0]||'M').toUpperCase();const rows=[];if(s.address)rows.push(['<path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11z"/><circle cx="12" cy="10" r="2"/>',s.address]);if(s.phone)rows.push(['<path d="M5 4h4l2 5-3 2c1.5 3 3.5 5 6.5 6.5l2-3 4 2.5v4c-8 1-16-7-15.5-17z"/>',s.phone]);if(s.email)rows.push(['<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',s.email]);if(s.website)rows.push(['<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 4.5 6 4.5 9S15 18 12 21c-3-3-4.5-6-4.5-9S9 6 12 3"/>',s.website]);if(s.instagram)rows.push(['<rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3"/><circle cx="17" cy="7" r=".8" fill="currentColor"/>',s.instagram]);contact.innerHTML=rows.length?rows.map(r=>'<div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+r[0]+'</svg><span>'+r[1]+'</span></div>').join(''):'<div class="empty">MIRA Partner</div>';const now=Date.now(),oa=allOffers.filter(o=>o.storeId===s.id&&o.status==='active'&&(!o.start||new Date(o.start).getTime()<=now)&&(!o.end||new Date(o.end).getTime()>=now));offers.innerHTML=oa.length?oa.map(o=>{const d=o.discount?String(o.discount).replace('%','')+'% OFF':'Offer';return '<article class="offer-card" data-id="'+o.id+'"><div class="offer-img"'+(o.image?' style="background-image:url(\''+o.image.replace(/'/g,'%27')+'\')"':'')+'></div><div><h3>'+o.title+'</h3><p>'+((o.description||'').slice(0,90))+'</p><span class="discount">'+d+'</span></div></article>'}).join(''):'<div class="empty">'+t.none+'</div>';offers.onclick=e=>{const c=e.target.closest('.offer-card');if(!c)return;const o=oa.find(x=>x.id===c.dataset.id);if(!o)return;const d=o.discount?String(o.discount).replace('%','')+'% OFF':'Offer';location.href='offer.html?'+new URLSearchParams({id:o.id,storeId:s.id,name:s.name,title:o.title,discount:d,letter:(s.name[0]||'M')}).toString()}}}
</script></body></html>
