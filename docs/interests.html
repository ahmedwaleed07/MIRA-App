<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8fb"><title>MIRA — Interests</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--pink:#FF4D8D;--pink2:#FF7EB6;--peach:#FFC8A1;--blue:#6EC6FF;--ink:#A62C63;--muted:#B86A8E;--line:#F0DCE6;--mira:#D94F8A}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff8fb;color:var(--ink)}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100svh;background:radial-gradient(circle at 12% 4%,rgba(255,126,182,.16),transparent 28%),radial-gradient(circle at 95% 2%,rgba(110,198,255,.15),transparent 30%),linear-gradient(180deg,#fffafd 0%,#fff 48%,#fff9fc 100%);padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between}.back{width:42px;height:42px;border:0;border-radius:50%;background:#fff;box-shadow:0 7px 22px rgba(43,35,56,.08);font-size:27px;line-height:1;color:var(--pink);cursor:pointer}.brandmark{width:132px;height:42px;background:var(--mira);-webkit-mask:url('assets/mira_wordmark.svg') center/contain no-repeat;mask:url('assets/mira_wordmark.svg') center/contain no-repeat}.spacer{width:42px}.hero{text-align:center;margin-top:30px}h1{font-size:29px;line-height:1.15;margin:0 0 9px;font-weight:800;color:var(--ink)}.sub{margin:0 auto;color:var(--muted);font-size:13.5px;line-height:1.55;max-width:340px}.count{margin-top:10px;font-size:12px;font-weight:700;color:var(--pink)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:24px}.interest{position:relative;min-height:98px;border:1px solid var(--line);border-radius:21px;background:#fff;padding:13px 12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;color:var(--ink);font-family:inherit;box-shadow:0 9px 24px rgba(92,50,76,.05);transition:.15s ease;cursor:pointer}.interest.selected{background:#fff;border-color:#FF9BC2;box-shadow:0 9px 24px rgba(92,50,76,.06)}.icon{width:32px;height:32px;display:grid;place-items:center;color:var(--pink)}.icon svg{width:29px;height:29px;display:block}.name{font-size:12.2px;line-height:1.3;font-weight:700;margin-top:10px}.check{position:absolute;top:9px;right:9px;width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;font-size:14px;font-weight:800;display:none;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(255,77,141,.22)}.interest.selected .check{display:flex}.actions{margin:24px 0 0;padding:0 0 calc(4px + env(safe-area-inset-bottom))}.primary{width:100%;border:0;border-radius:17px;padding:15px 16px;background:linear-gradient(90deg,var(--pink),var(--pink2) 35%,var(--peach) 60%,var(--blue));color:#fff;font:800 16px Poppins;box-shadow:0 12px 26px rgba(255,77,141,.22)}.primary:disabled{opacity:.38;box-shadow:none}.skip{width:100%;border:0;background:transparent;color:var(--muted);font:700 13px Poppins;padding:12px 10px}.lang{margin-top:10px;text-align:center;font-size:11px;color:var(--muted)}.lang button{border:0;background:transparent;color:var(--ink);font-weight:600;padding:4px 6px;font-family:inherit}[dir=rtl] .interest{text-align:right;align-items:flex-end}[dir=rtl] .check{right:auto;left:9px}@media(max-width:355px){.grid{gap:8px}.interest{min-height:92px;padding:11px 10px}.name{font-size:11.5px}}</style></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()" aria-label="Back">‹</button><div class="brandmark" aria-label="MIRA"></div><div class="spacer"></div></div><section class="hero"><h1 id="title"></h1><p class="sub" id="subtitle"></p><div class="count" id="count"></div></section><section class="grid" id="grid"></section><div class="actions"><button class="primary" id="continueBtn" disabled onclick="continueSetup()"></button><button class="skip" id="skipBtn" onclick="skipInterests()"></button><div class="lang"><button onclick="setLang('en')">English</button> · <button onclick="setLang('ar')">العربية</button> · <button onclick="setLang('es')">Español</button> · <button onclick="setLang('ru')">Русский</button> · <button onclick="setLang('tr')">Türkçe</button></div></div></main><script>const ICONS={fashion:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l-4 3 2 4 2-1v10h8V10l2 1 2-4-4-3-2 2h-4L8 4z"/></svg>',shoes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 16c4.5.4 7-1.5 8-5l2 1c1.5 2.8 3.6 4.4 7 4.5V20H4a1 1 0 0 1-1-1v-3z"/></svg>',accessories:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="12" r="3.5"/><circle cx="17" cy="12" r="3.5"/><path d="M10.5 12h3"/></svg>',beauty:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3h8v4H8zM7 7h10v14H7zM10 11h4M12 9v4"/></svg>',perfume:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3h6v4H9zM8 7h8l2 3v10H6V10l2-3zM10 12h4"/></svg>',electronics:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M10 5h4M11 18.5h2"/></svg>',food:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3v8M3.5 3v5c0 2 1 3 2.5 3s2.5-1 2.5-3V3M6 11v10M15 3v18M15 3c3 1 4 4 4 7h-4"/></svg>',grocery:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5h2l2 10h10l2-7H6"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>',home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-8 9 8M5 10v10h14V10M9 20v-6h6v6"/></svg>',travel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="7" width="14" height="13" rx="2"/><path d="M9 7V5h6v2M9 20v1M15 20v1"/></svg>',cars:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 16l1-5 2-3h8l2 3 1 5"/><rect x="3" y="13" width="18" height="6" rx="2"/><circle cx="7" cy="18" r="1"/><circle cx="17" cy="18" r="1"/></svg>',sports:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 9v6M8 7v10M16 7v10M19 9v6M8 12h8"/></svg>',kids:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M5 21c.8-4.5 3.2-7 7-7s6.2 2.5 7 7"/></svg>',health:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21S4 16.5 4 10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6.5-8 11-8 11zM8 12h2l1-2 2 4 1-2h2"/></svg>',entertainment:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M10 9.5l5 2.5-5 2.5v-5z"/></svg>',jewelry:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6l2-3h4l2 3-4 5-4-5z"/><circle cx="12" cy="15.5" r="5.5"/></svg>',services:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.5 5.5a4 4 0 0 0-5 5L4 16l4 4 5.5-5.5a4 4 0 0 0 5-5l-3 3-4-4 3-3z"/></svg>'};const ITEMS=[['fashion','Fashion & Clothing','الأزياء والملابس','Moda y ropa','Одежда и мода','Moda ve giyim'],['shoes','Shoes','الأحذية','Calzado','Обувь','Ayakkabı'],['accessories','Accessories','الإكسسوارات','Accesorios','Аксессуары','Aksesuarlar'],['beauty','Beauty & Cosmetics','الجمال ومستحضرات التجميل','Belleza y cosmética','Красота и косметика','Güzellik ve kozmetik'],['perfume','Perfumes & Fragrances','العطور','Perfumes y fragancias','Парфюмерия','Parfüm'],['electronics','Electronics','الإلكترونيات','Electrónica','Электроника','Elektronik'],['food','Restaurants & Cafés','المطاعم والمقاهي','Restaurantes y cafés','Рестораны и кафе','Restoranlar ve kafeler'],['grocery','Supermarkets & Groceries','السوبرماركت والمواد الغذائية','Supermercados y comestibles','Супермаркеты и продукты','Süpermarket ve market'],['home','Home & Furniture','المنزل والأثاث','Hogar y muebles','Дом и мебель','Ev ve mobilya'],['travel','Travel & Hotels','السفر والفنادق','Viajes y hoteles','Путешествия и отели','Seyahat ve oteller'],['cars','Cars & Automotive','السيارات','Autos y automoción','Автомобили','Otomobil'],['sports','Sports & Fitness','الرياضة واللياقة','Deportes y fitness','Спорт и фитнес','Spor ve fitness'],['kids','Kids & Family','الأطفال والعائلة','Niños y familia','Дети и семья','Çocuk ve aile'],['health','Health','الصحة','Salud','Здоровье','Sağlık'],['entertainment','Entertainment','الترفيه','Entretenimiento','Развлечения','Eğlence'],['jewelry','Jewelry & Watches','المجوهرات والساعات','Joyería y relojes','Украшения и часы','Mücevher ve saat'],['services','Services','الخدمات','Servicios','Услуги','Hizmetler']];const T={en:{title:'What are you interested in?',sub:'Choose 3 or more interests so MIRA can show you more relevant offers.',selected:n=>`${n} selected`,cont:'Continue',skip:'Skip for now'},ar:{title:'شنو الأشياء اللي تهمك؟',sub:'اختار 3 اهتمامات أو أكثر حتى نعرض إلك عروض تناسبك أكثر.',selected:n=>`تم اختيار ${n}`,cont:'متابعة',skip:'تخطي حالياً'},es:{title:'¿Qué te interesa?',sub:'Elige 3 o más intereses para mostrarte ofertas más relevantes.',selected:n=>`${n} seleccionados`,cont:'Continuar',skip:'Omitir por ahora'},ru:{title:'Что вам интересно?',sub:'Выберите 3 или больше интересов, чтобы MIRA показывала более подходящие предложения.',selected:n=>`Выбрано: ${n}`,cont:'Продолжить',skip:'Пропустить пока'},tr:{title:'Nelerle ilgileniyorsun?',sub:'MIRA’nın sana daha uygun fırsatlar göstermesi için 3 veya daha fazla ilgi alanı seç.',selected:n=>`${n} seçildi`,cont:'Devam et',skip:'Şimdilik geç'}};let selected=new Set(JSON.parse(localStorage.getItem('mira_interests')||'[]'));function langIndex(lang){return {en:1,ar:2,es:3,ru:4,tr:5}[lang]||1}function getLang(){return localStorage.getItem('mira_lang')||'en'}function render(){const lang=getLang(),idx=langIndex(lang);grid.innerHTML='';ITEMS.forEach(item=>{const b=document.createElement('button');b.className='interest'+(selected.has(item[0])?' selected':'');b.type='button';b.innerHTML=`<span class="check">✓</span><span class="icon">${ICONS[item[0]]}</span><span class="name">${item[idx]}</span>`;b.onclick=()=>toggle(item[0]);grid.appendChild(b)});updateState()}function toggle(id){selected.has(id)?selected.delete(id):selected.add(id);localStorage.setItem('mira_interests',JSON.stringify([...selected]));render()}function updateState(){const t=T[getLang()]||T.en;count.textContent=t.selected(selected.size);continueBtn.disabled=selected.size<3}function continueSetup(){if(selected.size<3)return;localStorage.setItem('mira_interests',JSON.stringify([...selected]));location.href='home.html'}function skipInterests(){localStorage.setItem('mira_interests','[]');location.href='home.html'}function setLang(lang){localStorage.setItem('mira_lang',lang);applyLang(lang)}function applyLang(lang){const t=T[lang]||T.en;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';title.textContent=t.title;subtitle.textContent=t.sub;continueBtn.textContent=t.cont;skipBtn.textContent=t.skip;render()}applyLang(getLang());</script></body></html>
