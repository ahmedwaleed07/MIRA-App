<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#800020"><title>MIRA | الأسواق التراثية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--wine:#800020;--pink:#FC618F;--white:#fff;--ink:#29212a;--muted:#756b72;--line:#f0e6e9;--bg:#fff8fa}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,"Noto Sans Arabic",sans-serif;background:var(--bg);color:var(--ink)}body{display:flex;justify-content:center}.app{width:min(100%,480px);min-height:100svh;background:var(--bg);padding-bottom:34px}.top{background:var(--wine);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 20px;border-radius:0 0 28px 28px}.topline{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800;letter-spacing:.2px}.back{border:1px solid #ffffff55;background:transparent;color:#fff;border-radius:14px;padding:8px 12px;font:600 12px inherit}.eyebrow{margin:22px 0 6px;color:#fff;font-size:11px;font-weight:700;opacity:.86;letter-spacing:.08em}.title{font-size:27px;line-height:1.35;margin:0;font-weight:800}.sub{font-size:12px;line-height:1.8;color:#fff;margin:8px 0 0;opacity:.9}.body{padding:0 16px}.markets{display:flex;gap:8px;overflow:auto;padding:17px 0 10px;scrollbar-width:none}.markets::-webkit-scrollbar{display:none}.market{border:1px solid var(--line);background:white;color:var(--wine);border-radius:999px;white-space:nowrap;padding:9px 13px;font-size:11px;font-weight:700;cursor:pointer}.market.active{background:var(--pink);border-color:var(--pink);color:#fff}.market-desc{font-size:11px;color:var(--muted);margin:3px 2px 14px;line-height:1.7}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 8px 25px #8000200b}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.panel-head h2{margin:0;color:var(--wine);font-size:16px}.seller-entry{background:var(--pink);color:#fff;border:0;border-radius:12px;padding:9px 11px;font:700 10px Poppins,"Noto Sans Arabic";cursor:pointer}.sides{display:flex;gap:8px;margin:14px 0 12px}.side{flex:1;border:1px solid var(--line);background:#fff;color:var(--wine);border-radius:12px;padding:10px 6px;font:700 11px Poppins,"Noto Sans Arabic";cursor:pointer}.side.active{background:var(--wine);color:#fff;border-color:var(--wine)}.lane{position:relative;border-radius:19px;overflow:hidden;min-height:314px;background:linear-gradient(180deg,#ead8c8 0 38%,#c6b09d 38% 43%,#53433c 43% 100%);display:flex;align-items:flex-end;justify-content:center;padding:16px 44px}.lane:before{content:"";position:absolute;inset:0 0 43% 0;background:repeating-linear-gradient(90deg,#0000 0 13%,#73553d 13% 14%,#0000 14% 28%),linear-gradient(#cdb59c,#e5ceb5)}.awning{position:absolute;z-index:1;left:0;right:0;top:38%;height:33px;background:repeating-linear-gradient(90deg,#800020 0 48px,#FC618F 48px 96px);box-shadow:0 5px 9px #22130e55}.storefront{position:absolute;inset:15% 14% 23%;border:10px solid #80654d;border-bottom:0;background:linear-gradient(90deg,#35281f 0 17%,transparent 17% 83%,#35281f 83%),linear-gradient(180deg,#634a36 0 11%,#d4b99c 11% 17%,#30251e 17% 100%);box-shadow:0 12px 24px #33261d55}.storefront:before{content:"";position:absolute;left:18%;right:18%;top:35%;height:43%;background:repeating-linear-gradient(90deg,#b99b75 0 22px,#493526 22px 27px);border:5px solid #967657}.shelf{position:absolute;z-index:2;bottom:17%;left:9%;right:9%;height:48px;border-radius:5px;background:repeating-linear-gradient(90deg,#8e694a 0 18px,#543b2c 18px 22px);box-shadow:0 8px 0 #38291e}.goods{position:relative;z-index:3;background:#fffdf7;color:var(--ink);border:1px solid #fff;border-radius:17px;padding:15px;width:100%;box-shadow:0 13px 30px #180e0c55}.number{position:absolute;top:-13px;right:15px;min-width:43px;height:43px;border-radius:14px;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 6px 14px #80002035}.goods h3{margin:14px 0 5px;font-size:18px}.goods p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}.price-row{display:flex;align-items:center;justify-content:space-between;margin-top:13px}.price{color:var(--wine);font-size:16px;font-weight:800}.seller-phone{font-size:11px;color:var(--wine);direction:ltr;text-decoration:none;font-weight:700}.controls{display:flex;gap:8px;justify-content:center;margin:12px 0 4px}.arrow{width:45px;height:42px;border:0;border-radius:14px;background:var(--wine);color:white;font-size:22px;cursor:pointer}.index{align-self:center;color:var(--muted);font-size:10px;font-weight:700;min-width:82px;text-align:center}.offer-btn{width:100%;margin-top:10px;border:0;border-radius:13px;background:var(--pink);color:white;padding:12px;font:800 12px Poppins,"Noto Sans Arabic";cursor:pointer}.note{font-size:10px;color:var(--muted);line-height:1.7;margin:12px 4px 17px}.cta-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.cta{border:0;border-radius:14px;padding:12px 7px;background:var(--wine);color:#fff;font:700 11px Poppins,"Noto Sans Arabic";cursor:pointer}.cta.alt{background:var(--pink)}.modal{position:fixed;inset:0;background:#190b10a6;display:none;align-items:flex-end;justify-content:center;z-index:5}.modal.open{display:flex}.sheet{width:min(100%,480px);max-height:88svh;overflow:auto;background:white;border-radius:25px 25px 0 0;padding:22px 19px calc(24px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 6px;color:var(--wine);font-size:20px}.sheet p{color:var(--muted);font-size:11px;line-height:1.7}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:11px;font-weight:700;color:var(--wine)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font:12px inherit;background:#fff;color:var(--ink)}.field textarea{min-height:70px;resize:vertical}.submit{width:100%;border:0;border-radius:13px;background:var(--pink);color:#fff;padding:13px;font:800 12px Poppins,"Noto Sans Arabic";cursor:pointer}.close{float:left;border:0;background:#f9edf1;color:var(--wine);border-radius:50%;width:32px;height:32px;font-size:19px;cursor:pointer}.pending{display:grid;gap:9px;margin:12px 0}.pending-card{border:1px solid var(--line);border-radius:14px;padding:12px}.pending-card b{display:block;color:var(--wine);font-size:12px}.pending-card small{display:block;color:var(--muted);margin-top:5px}.actions{display:flex;gap:7px;margin-top:9px}.actions button{flex:1;border:0;border-radius:10px;padding:8px;font:700 10px inherit;cursor:pointer}.yes{background:var(--pink);color:#fff}.no{background:#f8eef1;color:var(--wine)}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--wine);color:#fff;border-radius:13px;padding:11px 15px;font-size:11px;opacity:0;pointer-events:none;transition:.2s;z-index:8}.toast.show{opacity:1;transform:translate(-50%,0)}.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}.foot{text-align:center;color:var(--muted);font-size:9px;padding:8px 0 25px}.foot b{color:var(--wine)}[dir=ltr] .number{right:auto;left:15px}[dir=ltr] .close{float:right}
</style></head>
<body><main class="app">
<header class="top"><div class="topline"><button class="back" onclick="location.href='home.html'">← الرئيسية</button><div class="brand">MIRA</div></div><div class="eyebrow">MIRA • أسواق محلية</div><h1 class="title">أسواق بغداد التراثية</h1><p class="sub">تسوّقها مثل ما تمشي بالسوق: بسطة وراء بسطة، وسعرك على كيفك.</p></header>
<div class="body">
<nav class="markets" id="markets"></nav><div class="market-desc" id="marketDesc"></div>
<section class="panel"><div class="panel-head"><h2 id="marketTitle"></h2><button class="seller-entry" onclick="openSheet('join')">اعرض بسطيّتك</button></div>
<div class="sides"><button class="side active" id="oddSide" onclick="chooseSide('odd')">الجهة الفردية · 1، 3، 5…</button><button class="side" id="evenSide" onclick="chooseSide('even')">الجهة الزوجية · 2، 4، 6…</button></div>
<div class="lane"><div class="storefront"></div><div class="awning"></div><div class="shelf"></div><article class="goods" id="stall"></article></div>
<div class="controls"><button class="arrow" aria-label="البسطة السابقة" onclick="move(-1)">‹</button><span class="index" id="stallIndex"></span><button class="arrow" aria-label="البسطة التالية" onclick="move(1)">›</button></div>
<button class="offer-btn" id="offerBtn" onclick="openSheet('offer')">اطلب سعر أقل</button>
</section><p class="note">خصوصية البسطات: يظهر للمتصفح رقم هاتف البائع فقط. ما يظهر اسم المحل ولا عنوانه. رقم البسطة يحدد موقعها على أحد جانبي السوق.</p>
<div class="cta-row"><button class="cta alt" onclick="openSheet('join')">افتح بسطة</button><a class="cta" href="business.html" style="display:grid;place-items:center;text-align:center;text-decoration:none">متجر اعتيادي</a><button class="cta" onclick="openSheet('seller')">طلبات الأسعار</button></div>
<div class="foot"><b>MIRA</b> · سوق واحد، تجربة شعبية جديدة</div></div></main>
<div class="modal" id="modal" onclick="if(event.target===this)closeSheet()"><section class="sheet"><button class="close" onclick="closeSheet()">×</button><div id="sheetContent"></div></section></div><div class="toast" id="toast"></div>
<script>
const MARKETS=[
{id:'mutanabbi',name:'شارع المتنبي',en:'Al-Mutanabbi Street',desc:'كتب، روايات، ومستلزمات القرطاسية',demo:[['رواية بغداد القديمة','رواية مستعملة بحالة ممتازة',12000,'0770 123 4501'],['دفتر رسم وألوان','عدة رسم للطلاب والهواة',8500,'0770 123 4502'],['كتب أطفال مصوّرة','مجموعة قصص عربية مصوّرة',10000,'0770 123 4503']]},
{id:'nahr',name:'شارع النهر',en:'Al-Nahr Street',desc:'ملابس نسائية واختيارات يومية',demo:[['عباءة بتطريز يدوي','قماش خفيف وتطريز أنيق',35000,'0770 234 5601'],['حقيبة نسائية','حقيبة جلد صناعي بحالة جديدة',28000,'0770 234 5602']]},
{id:'ghazi',name:'سوق غازي',en:'Ghazi Market',desc:'ملابس نسائية وموديلات متنوعة',demo:[['فستان صيفي','فستان نسائي مقاس متوسط',30000,'0770 345 6701'],['شال مطرّز','شال ناعم بألوان مختلفة',15000,'0770 345 6702']]},
{id:'arabi',name:'السوق العربي',en:'Arab Market',desc:'ملابس رجالية وأزياء شعبية',demo:[['دشداشة رجالية','قماش قطني، قياسات متعددة',25000,'0770 456 7801'],['حزام جلدي','حزام رجالي لون بني',18000,'0770 456 7802']]},
{id:'shorja',name:'الشورجة',en:'Al-Shorja',desc:'مواد غذائية، عطّاريات، وأدوات منزلية',demo:[['بهارات مشكلة','خلطة طازجة وزن 500 غرام',6000,'0770 567 8901'],['إبريق شاي نحاسي','إبريق تقليدي صغير',22000,'0770 567 8902']]},
{id:'ghazl',name:'سوق الغزل',en:'Al-Ghazl Market',desc:'حيوانات وأسماك زينة ومستلزماتها',demo:[['سمكة بيتا','سمكة زينة بألوان زاهية',12000,'0770 678 9011'],['حوض أسماك صغير','حوض زجاجي مع مستلزمات أساسية',35000,'0770 678 9012']]},
{id:'bazaar',name:'بازار MIRA',en:'MIRA Bazaar',desc:'مصنوعات يدوية، حرف، وقطع فريدة',demo:[['مبخرة فخارية','قطعة يدوية مصنوعة محلياً',18000,'0770 789 0121'],['حقيبة كروشيه','شغل يدوي بألوان حسب الطلب',25000,'0770 789 0122']]}
];
let marketId=new URLSearchParams(location.search).get('market')||MARKETS[0].id;let side='odd',idx=0;
const read=(k)=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const current=()=>MARKETS.find(m=>m.id===marketId)||MARKETS[0];
function stalls(){const s=read('mira_heritage_stalls').filter(x=>x.market===marketId&&x.side===side);const demos=current().demo.map((d,i)=>({id:'demo-'+marketId+'-'+side+'-'+i,market:marketId,side,number:side==='odd'?1+i*2:2+i*2,title:d[0],description:d[1],price:d[2],phone:d[3],demo:true}));return [...demos,...s].sort((a,b)=>a.number-b.number)}
function render(){document.documentElement.lang=localStorage.getItem('mira_lang')||'ar';document.documentElement.dir=document.documentElement.lang==='ar'?'rtl':'ltr';document.querySelector('#markets').innerHTML=MARKETS.map(m=>'<button class="market '+(m.id===marketId?'active':'')+'" onclick="selectMarket(\''+m.id+'\')">'+m.name+'</button>').join('');document.querySelector('#marketDesc').textContent=current().desc;document.querySelector('#marketTitle').textContent=current().name;document.querySelector('#oddSide').classList.toggle('active',side==='odd');document.querySelector('#evenSide').classList.toggle('active',side==='even');const ss=stalls();idx=(idx+ss.length)%ss.length;const s=ss[idx];document.querySelector('#stall').innerHTML='<span class="number">'+s.number+'</span><h3>'+esc(s.title)+'</h3><p>'+esc(s.description||'بسطة من سوق MIRA التراثي')+'</p><div class="price-row"><span class="price">'+Number(s.price).toLocaleString('ar-IQ')+' د.ع</span><a class="seller-phone" href="tel:'+esc(s.phone)+'">'+esc(s.phone)+'</a></div><button class="offer-btn" onclick="openSheet(\'offer\')">قدّم سعر مناسب</button>';document.querySelector('#stallIndex').textContent=(idx+1)+' / '+ss.length;document.querySelector('#offerBtn').textContent='اطلب سعر أقل';}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function selectMarket(id){marketId=id;idx=0;render()}function chooseSide(s){side=s;idx=0;render()}function move(n){const len=stalls().length;idx=(idx+n+len)%len;render()}
function openSheet(mode){const root=document.querySelector('#sheetContent');if(mode==='offer'){const s=stalls()[idx];root.innerHTML='<h2>قدّم عرضك للبائع</h2><p>البائع يراجع السعر ويوافق عليه أو يرفضه. يظهر له رقم تواصل الزبون حتى يرد على الطلب.</p><form onsubmit="sendOffer(event)"><div class="field"><label>السعر المعروض (دينار عراقي)</label><input required type="number" min="1" name="price" placeholder="اكتب السعر المناسب" /></div><div class="field"><label>رقم هاتفك</label><input required type="tel" name="phone" placeholder="07xxxxxxxxx" /></div><div class="field"><label>ملاحظة للبائع (اختياري)</label><textarea name="note" placeholder="مثلاً: أشتري قطعتين"></textarea></div><button class="submit">إرسال عرض السعر</button></form>';}else if(mode==='join'){root.innerHTML='<h2>افتح بسطة تراثية</h2><p>اختار السوق والجهة. النظام يعطيك رقم متسلسل فردي أو زوجي. المعروض للناس هو البضاعة ورقم الهاتف فقط، من دون اسم المحل أو عنوانه.</p><form onsubmit="addStall(event)"><div class="field"><label>السوق</label><select name="market">'+MARKETS.map(m=>'<option value="'+m.id+'" '+(m.id===marketId?'selected':'')+'>'+m.name+'</option>').join('')+'</select></div><div class="field"><label>جهة البسطة</label><select name="side"><option value="odd">فردية: 1، 3، 5…</option><option value="even">زوجية: 2، 4، 6…</option></select></div><div class="field"><label>اسم البضاعة أو المنتج</label><input required name="title" maxlength="60" placeholder="مثلاً: كتاب تراثي" /></div><div class="field"><label>وصف مختصر</label><textarea name="description" maxlength="180" placeholder="التفاصيل التي يحتاجها المشتري"></textarea></div><div class="field"><label>السعر (دينار عراقي)</label><input required type="number" min="1" name="price" /></div><div class="field"><label>رقم هاتف البائع</label><input required type="tel" name="phone" placeholder="07xxxxxxxxx" /></div><button class="submit">نشر البسطة</button></form>';}else{const pending=read('mira_heritage_offers').filter(x=>x.seller===localStorage.getItem('mira_heritage_phone'));root.innerHTML='<h2>طلبات السعر</h2><p>أدخل رقم هاتف البائع الذي نشر البسطة لمراجعة العروض.</p><form onsubmit="showSeller(event)"><div class="field"><label>رقم هاتف البائع</label><input required name="seller" type="tel" value="'+esc(localStorage.getItem('mira_heritage_phone')||'')+'" /></div><button class="submit">عرض الطلبات</button></form><div class="pending" id="pending">'+(pending.map(cardOffer).join('')||'<div class="empty">ماكو طلبات معروضة. أدخل رقم الهاتف حتى تظهر العروض المسجلة على هذا الجهاز.</div>')+'</div>';}document.querySelector('#modal').classList.add('open')}
function closeSheet(){document.querySelector('#modal').classList.remove('open')}
function sendOffer(e){e.preventDefault();const f=new FormData(e.target),s=stalls()[idx];const offers=read('mira_heritage_offers');offers.push({id:Date.now(),stall:s.id,market:marketId,number:s.number,seller:s.phone,buyer:f.get('phone'),price:Number(f.get('price')),note:f.get('note'),status:'pending',created:new Date().toISOString()});write('mira_heritage_offers',offers);closeSheet();toast('انرسل عرضك، وبانتظار قرار البائع');}
function addStall(e){e.preventDefault();const f=new FormData(e.target),m=f.get('market'),sd=f.get('side');let all=read('mira_heritage_stalls');const list=all.filter(s=>s.market===m&&s.side===sd);const base=MARKETS.find(x=>x.id===m)?.demo.length||0;const first=sd==='odd'?1:2;const demoLast=base?first+(base-1)*2:first-2;const next=Math.max(demoLast,...list.map(s=>s.number))+2;const seller=f.get('phone');localStorage.setItem('mira_heritage_phone',seller);all.push({id:'stall-'+Date.now(),market:m,side:sd,number:next,title:f.get('title'),description:f.get('description'),price:Number(f.get('price')),phone:seller});write('mira_heritage_stalls',all);marketId=m;side=sd;idx=(MARKETS.find(x=>x.id===m)?.demo.length||0)+all.filter(s=>s.market===m&&s.side===sd).length-1;closeSheet();render();toast('تم إنشاء بسطة رقم '+next);}
function cardOffer(o){return '<article class="pending-card"><b>بسطة رقم '+o.number+' · عرض '+Number(o.price).toLocaleString('ar-IQ')+' د.ع</b><small>رقم الزبون: '+esc(o.buyer)+'<br>'+esc(o.note||'بدون ملاحظة')+' · '+(o.status==='pending'?'بانتظار ردك':o.status==='accepted'?'مقبول':'مرفوض')+'</small>'+(o.status==='pending'?'<div class="actions"><button class="yes" onclick="decideOffer('+o.id+',\'accepted\')">موافقة</button><button class="no" onclick="decideOffer('+o.id+',\'rejected\')">رفض</button></div>':'')+'</article>'}
function showSeller(e){e.preventDefault();const seller=new FormData(e.target).get('seller');localStorage.setItem('mira_heritage_phone',seller);const found=read('mira_heritage_offers').filter(x=>x.seller===seller);document.querySelector('#pending').innerHTML=found.map(cardOffer).join('')||'<div class="empty">لا توجد عروض مرتبطة بهذا الرقم على هذا الجهاز.</div>'}
function decideOffer(id,status){const a=read('mira_heritage_offers');const o=a.find(x=>x.id===id);if(o){o.status=status;write('mira_heritage_offers',a);openSheet('seller')} }
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
render();
</script></body></html>
