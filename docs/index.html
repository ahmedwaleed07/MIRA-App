<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6f7b"><title>MIRA Interactive Preview</title>
<style>
:root{--pink:#ff4d8d;--pink2:#ff7eb6;--peach:#ffc8a1;--sky:#6ec6ff;--ink:#2d3444;--muted:#667085}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Nunito Sans",sans-serif;color:var(--ink)}body[dir=rtl]{font-family:"Tajawal","Segoe UI",sans-serif}button,input,select{font:inherit}
#app{width:min(100%,430px);margin:auto;background:#fff;min-height:100vh;overflow:hidden}.screen{display:none;min-height:100vh;position:relative}.screen.active{display:block}
#welcome{aspect-ratio:480/853;min-height:0;background:#ff7590}#welcome img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.hot{position:absolute;border:0;background:transparent;border-radius:999px;touch-action:manipulation}.hot:active{background:rgba(255,255,255,.14)}.lang{top:2.7%;height:5.8%}.en{left:5.1%;width:17.5%}.ar{left:23.8%;width:17%}.es{left:41%;width:18%}.ru{left:60.4%;width:18%}.tr{left:79.4%;width:15%}.action{left:8%;width:84%}.signin{top:66.7%;height:7.3%}.signup{top:74.8%;height:7.3%}.guest{left:22%;width:56%;top:82.6%;height:6%}
.brand{min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(145deg,#ff9d89 0%,#ff7594 31%,#f36eb3 55%,#baa5eb 76%,#74c7ff 100%)}.bar{display:flex;align-items:center;justify-content:space-between;color:white;gap:10px}.back,.langchip{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff}.back{width:44px;height:44px;border-radius:50%;font-size:28px}.langchip{height:38px;border-radius:999px;padding:0 12px;font-weight:800;font-size:13px}.brandname{font-weight:900;font-size:23px}.card{margin-top:18px;background:rgba(255,255,255,.97);border-radius:28px;padding:24px 20px;box-shadow:0 20px 50px rgba(82,49,86,.17)}h1{font-size:28px;line-height:1.15;margin:0 0 8px;font-weight:900}.sub{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 18px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f4eef3;border-radius:16px;padding:4px;margin-bottom:16px}.tab{border:0;background:transparent;padding:11px;border-radius:13px;font-weight:900;color:#7a8290}.tab.on{background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.06)}label{display:block;font-size:12px;font-weight:900;margin:13px 0 7px}.row{display:flex;gap:8px}.field,select{width:100%;height:54px;border:1px solid #e8e0e7;background:#fff;border-radius:15px;padding:0 13px;font-size:16px;outline:none}select.code{width:140px;flex:0 0 140px}.primary{width:100%;height:55px;border:0;border-radius:17px;background:linear-gradient(90deg,var(--pink),#ff7c9b);color:#fff;font-weight:900;font-size:16px;margin-top:18px}.link{width:100%;border:0;background:transparent;color:var(--pink);font-weight:900;padding:14px}.otp{display:flex;gap:7px;justify-content:center;margin:18px 0}.otp input{width:44px;height:53px;border:1px solid #e7e2e7;border-radius:13px;text-align:center;font-size:22px;font-weight:900}.notice{display:none;margin-top:12px;padding:11px 12px;border-radius:14px;background:#fff3f7;color:#b42365;font-size:13px}.notice.show{display:block}.market{display:grid;gap:10px}.market button{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:17px;border:1px solid #eee1e8;background:#fff;text-align:inherit}.market button.on{border-color:var(--pink2);background:#fff7fb;box-shadow:0 0 0 3px rgba(255,126,182,.12)}.pref{margin-top:16px;padding:16px;border:1px solid #f0e6eb;border-radius:20px}.choice{display:flex;gap:10px;align-items:center;padding:11px 0}.choice input{width:20px;height:20px;accent-color:var(--pink)}.home{background:#fff;padding-bottom:36px}.homehead{padding:calc(20px + env(safe-area-inset-top)) 18px 22px;background:linear-gradient(110deg,#ff7594,#ef8cbd 56%,#76c8ff);color:#fff;border-radius:0 0 28px 28px}.homebar{display:flex;align-items:center;justify-content:space-between}.pill{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:9px 12px;font-weight:800}.section{padding:20px 18px 0}.section h2{font-size:21px}.scroll{display:flex;gap:12px;overflow:auto}.offer{min-width:225px;padding:16px;border-radius:20px;background:linear-gradient(135deg,#fff4f8,#f4f8ff);border:1px solid #f0e7ed}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--pink);color:white;font-size:11px;font-weight:900}.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cat{min-height:88px;border:0;border-radius:20px;padding:14px;text-align:left;font-weight:900;background:linear-gradient(135deg,#fff1f7,#f0f8ff)}
</style></head><body><main id="app">
<section id="welcome" class="screen active"><img src="assets/approved-welcome.jpg" alt="MIRA approved welcome screen">
<button class="hot lang en" data-lang="en" aria-label="English"></button><button class="hot lang ar" data-lang="ar" aria-label="Arabic"></button><button class="hot lang es" data-lang="es" aria-label="Spanish"></button><button class="hot lang ru" data-lang="ru" aria-label="Russian"></button><button class="hot lang tr" data-lang="tr" aria-label="Turkish"></button>
<button class="hot action signin" data-go="signin" aria-label="Sign in"></button><button class="hot action signup" data-go="signup" aria-label="Sign up"></button><button class="hot action guest" id="guest" aria-label="Continue as guest"></button></section>

<section id="signup" class="screen brand"><div class="bar"><button class="back" data-go="welcome">‹</button><b class="brandname">MIRA</b><button class="langchip" data-lang-menu></button></div><div class="card"><h1 data-t="signupTitle"></h1><p class="sub" data-t="signupSub"></p><div class="tabs"><button class="tab on" data-auth2="phone" data-t="phone"></button><button class="tab" data-auth2="email" data-t="email"></button></div><div id="up"><label data-t="phoneNumber"></label><div class="row"><select class="code" id="uc"></select><input class="field" id="uphone" inputmode="tel" placeholder="770 000 0000"></div></div><div id="ue" hidden><label data-t="email"></label><input class="field" id="uemail" type="email" placeholder="name@example.com"></div><button class="primary" id="signupGo" data-t="createAccount"></button><button class="link" data-go="signin" data-t="alreadyAccount"></button><div class="notice" id="un"></div></div></section>
<section id="otp" class="screen brand"><div class="bar"><button class="back" id="otpBack">‹</button><b class="brandname">MIRA</b><button class="langchip" data-lang-menu></button></div><div class="card"><h1 data-t="otpTitle"></h1><p class="sub" id="otpText"></p><div class="otp"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"></div><button class="primary" id="verify" data-t="verify"></button><button class="link" id="resend" data-t="resend"></button><div class="notice" id="on"></div></div></section>
<section id="market" class="screen brand"><div class="bar"><button class="back" data-go="welcome">‹</button><b class="brandname">MIRA</b><button class="langchip" data-lang-menu></button></div><div class="card"><h1 data-t="marketTitle"></h1><p class="sub" data-t="marketSub"></p><div class="market" id="markets"></div><div class="pref"><b data-t="areaPreference"></b><label class="choice"><input type="radio" name="area" checked><span data-t="allAreas"></span></label><label class="choice"><input type="radio" name="area"><span data-t="selectedAreas"></span></label></div><button class="primary" id="enter" data-t="enterMira"></button></div></section>
<section id="home" class="screen home"><div class="homehead"><div class="homebar"><b style="font-size:24px">MIRA</b><button class="pill" id="place"></button></div><h1 style="color:#fff;margin-top:18px" data-t="homeHello"></h1><p data-t="homeSub"></p></div><div class="section"><h2 data-t="flashSales"></h2><div class="scroll"><article class="offer"><span class="badge">FLASH</span><h3>Up to 50% off</h3><p class="sub">Demo offer card</p></article><article class="offer"><span class="badge">MIRA</span><h3>MIRA Special</h3><p class="sub">Exclusive MIRA offer</p></article></div></div><div class="section"><h2 data-t="shopBy"></h2><div class="cats" id="cats"></div></div></section>
</main><script>
(()=>{const langs={en:'English',ar:'العربية',es:'Español',ru:'Русский',tr:'Türkçe'};const I={en:{signinTitle:'Welcome back',signinSub:'Sign in with your phone number or email.',phone:'Phone',email:'Email',phoneNumber:'Phone number',continue:'Continue',createAccount:'Create an account',signupTitle:'Create your MIRA account',signupSub:'Join MIRA and keep your shopping preferences wherever you go.',alreadyAccount:'Already have an account?',otpTitle:'Verify your code',verify:'Verify & continue',resend:'Resend code',marketTitle:'Where do you want to shop?',marketSub:'Choose your MIRA shopping country. You can change it later whenever you travel.',areaPreference:'Area preference',allAreas:'All cities / states',selectedAreas:'Select specific cities / states',enterMira:'Continue to MIRA',homeHello:'Offers all year round',homeSub:'Your saved market and filters stay with your profile.',flashSales:'Flash Sales',shopBy:'Shop by category',req:'Please enter your ',six:'Enter all 6 digits.'},ar:{signinTitle:'أهلاً برجعتك',signinSub:'سجّل دخولك برقم الهاتف أو البريد الإلكتروني.',phone:'الهاتف',email:'البريد الإلكتروني',phoneNumber:'رقم الهاتف',continue:'متابعة',createAccount:'إنشاء حساب',signupTitle:'أنشئ حساب MIRA',signupSub:'سجّل حتى تبقى اختياراتك محفوظة وين ما تروح.',alreadyAccount:'عندك حساب؟',otpTitle:'تأكيد الرمز',verify:'تأكيد ومتابعة',resend:'إعادة إرسال الرمز',marketTitle:'وين تريد تتسوق؟',marketSub:'اختر بلد التسوق وتكدر تغيّره من تسافر.',areaPreference:'تفضيل المنطقة',allAreas:'كل المدن / المحافظات',selectedAreas:'اختيار مدن / محافظات محددة',enterMira:'الدخول إلى MIRA',homeHello:'عروض طول السنة',homeSub:'الدولة والفلاتر تبقى محفوظة بحسابك.',flashSales:'فلاش سيل',shopBy:'تسوق حسب القسم',req:'يرجى إدخال ',six:'أدخل الأرقام الستة كاملة.'},es:{signinTitle:'Bienvenido de nuevo',signinSub:'Inicia sesión con tu teléfono o correo.',phone:'Teléfono',email:'Correo',phoneNumber:'Número de teléfono',continue:'Continuar',createAccount:'Crear cuenta',signupTitle:'Crea tu cuenta MIRA',signupSub:'Guarda tus preferencias de compra.',alreadyAccount:'¿Ya tienes cuenta?',otpTitle:'Verifica tu código',verify:'Verificar',resend:'Reenviar',marketTitle:'¿Dónde quieres comprar?',marketSub:'Elige tu país MIRA. Podrás cambiarlo cuando viajes.',areaPreference:'Zona',allAreas:'Todas las ciudades / estados',selectedAreas:'Elegir ciudades / estados',enterMira:'Continuar a MIRA',homeHello:'Ofertas todo el año',homeSub:'Tu país y filtros quedan guardados.',flashSales:'Ofertas Flash',shopBy:'Categorías',req:'Introduce ',six:'Introduce los 6 dígitos.'},ru:{signinTitle:'С возвращением',signinSub:'Войдите по телефону или email.',phone:'Телефон',email:'Email',phoneNumber:'Номер телефона',continue:'Продолжить',createAccount:'Создать аккаунт',signupTitle:'Создайте аккаунт MIRA',signupSub:'Сохраняйте свои предпочтения.',alreadyAccount:'Уже есть аккаунт?',otpTitle:'Подтвердите код',verify:'Подтвердить',resend:'Отправить снова',marketTitle:'Где вы хотите покупать?',marketSub:'Выберите страну MIRA. Позже её можно изменить.',areaPreference:'Регион',allAreas:'Все города / регионы',selectedAreas:'Выбрать города / регионы',enterMira:'Перейти в MIRA',homeHello:'Предложения круглый год',homeSub:'Страна и фильтры сохраняются.',flashSales:'Flash Sales',shopBy:'Категории',req:'Введите ',six:'Введите все 6 цифр.'},tr:{signinTitle:'Tekrar hoş geldiniz',signinSub:'Telefon veya e-posta ile giriş yapın.',phone:'Telefon',email:'E-posta',phoneNumber:'Telefon numarası',continue:'Devam',createAccount:'Hesap oluştur',signupTitle:'MIRA hesabınızı oluşturun',signupSub:'Tercihlerinizi kaydedin.',alreadyAccount:'Zaten hesabınız var mı?',otpTitle:'Kodu doğrulayın',verify:'Doğrula',resend:'Tekrar gönder',marketTitle:'Nerede alışveriş yapmak istiyorsunuz?',marketSub:'MIRA ülkenizi seçin. Seyahatte değiştirebilirsiniz.',areaPreference:'Bölge',allAreas:'Tüm şehirler / bölgeler',selectedAreas:'Şehir / bölge seç',enterMira:'MIRA’ya devam et',homeHello:'Yıl boyu fırsatlar',homeSub:'Ülke ve filtreleriniz kaydedilir.',flashSales:'Flash Satışlar',shopBy:'Kategoriler',req:'Lütfen girin: ',six:'6 hanenin tamamını girin.'}};
const countries=[['🇮🇶','Iraq','+964'],['🇦🇪','United Arab Emirates','+971'],['🇸🇦','Saudi Arabia','+966'],['🇹🇷','Türkiye','+90'],['🇩🇪','Germany','+49'],['🇨🇦','Canada','+1'],['🇺🇸','United States','+1'],['🇬🇧','United Kingdom','+44'],['🇪🇸','Spain','+34'],['🇷🇺','Russia','+7'],['🇫🇷','France','+33'],['🇮🇹','Italy','+39'],['🇯🇴','Jordan','+962'],['🇰🇼','Kuwait','+965'],['🇶🇦','Qatar','+974']];const markets=[['IQ','🇮🇶','Iraq'],['AE','🇦🇪','United Arab Emirates'],['TR','🇹🇷','Türkiye']];const categories=['Men','Women','Kids','Newborn','Accessories','Jewelry','MIRA Home','Electronics','Appliances'];
let lang=localStorage.getItem('mira_lang')||'en',source='signin',m1='phone',m2='phone',market=localStorage.getItem('mira_market')||'IQ';const screens=[...document.querySelectorAll('.screen')],t=k=>I[lang][k]||k;function go(id){screens.forEach(s=>s.classList.toggle('active',s.id===id));scrollTo(0,0)}function apply(){document.documentElement.lang=lang;document.body.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('[data-lang-menu]').forEach(e=>e.textContent=langs[lang]);['sc','uc'].forEach(id=>document.getElementById(id).innerHTML=countries.map(c=>`<option>${c[0]} ${c[1]} (${c[2]})</option>`).join(''));renderMarkets();renderHome()}
function renderMarkets(){document.getElementById('markets').innerHTML=markets.map(x=>`<button class="${market===x[0]?'on':''}" data-m="${x[0]}"><span>${x[1]} <b>${x[2]}</b></span><span>${market===x[0]?'✓':''}</span></button>`).join('');document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{market=b.dataset.m;renderMarkets()})}function renderHome(){let x=markets.find(x=>x[0]===market)||markets[0];let p=document.getElementById('place');if(p)p.textContent=`${x[1]} ${x[2]} ▾`;let c=document.getElementById('cats');if(c)c.innerHTML=categories.map(x=>`<button class="cat">${x}</button>`).join('')}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('mira_lang',lang);apply()});document.querySelectorAll('[data-lang-menu]').forEach(b=>b.onclick=()=>{let a=['en','ar','es','ru','tr'];lang=a[(a.indexOf(lang)+1)%a.length];localStorage.setItem('mira_lang',lang);apply()});document.getElementById('guest').onclick=()=>go('market');
function tabs(attr,p,e,set){document.querySelectorAll('['+attr+']').forEach(b=>b.onclick=()=>{document.querySelectorAll('['+attr+']').forEach(x=>x.classList.toggle('on',x===b));let m=b.getAttribute(attr);set(m);document.getElementById(p).hidden=m!=='phone';document.getElementById(e).hidden=m!=='email'})}tabs('data-auth','sp','se',x=>m1=x);tabs('data-auth2','up','ue',x=>m2=x);
function send(prefix,mode){source=prefix==='s'?'signin':'signup';let v=document.getElementById(prefix+(mode==='phone'?'phone':'email')).value.trim(),n=document.getElementById(prefix+'n');if(!v){n.textContent=t('req')+t(mode);n.classList.add('show');return}n.classList.remove('show');document.getElementById('otpText').textContent=(lang==='ar'?'أدخل الرمز المكون من 6 أرقام المرسل إلى ':'Enter the 6-digit code sent to ')+t(mode)+'.';go('otp')}document.getElementById('signinGo').onclick=()=>send('s',m1);document.getElementById('signupGo').onclick=()=>send('u',m2);document.getElementById('otpBack').onclick=()=>go(source);
const otp=[...document.querySelectorAll('.otp input')];otp.forEach((x,i)=>x.oninput=()=>{x.value=x.value.replace(/\D/g,'').slice(0,1);if(x.value&&otp[i+1])otp[i+1].focus()});document.getElementById('verify').onclick=()=>{let n=document.getElementById('on');if(otp.map(x=>x.value).join('').length!==6){n.textContent=t('six');n.classList.add('show');return}n.classList.remove('show');go('market')};document.getElementById('resend').onclick=e=>{let o=t('resend');e.currentTarget.textContent='✓';setTimeout(()=>e.currentTarget.textContent=o,1000)};document.getElementById('enter').onclick=()=>{localStorage.setItem('mira_market',market);go('home')};document.getElementById('place').onclick=()=>go('market');apply()})();
