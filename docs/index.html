<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MIRA</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button{font:inherit}#app{width:min(100%,430px);margin:auto;min-height:100svh}.screen{display:none;min-height:100svh;position:relative;overflow:hidden}.screen.active{display:block}#welcome{background:#ff7590}.approved-welcome-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}.welcome-hotspots{position:absolute;inset:0;z-index:5}.hotspot{position:absolute;appearance:none;border:0;background:transparent;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.hotspot:active{background:rgba(255,255,255,.10)}.lang-hot{top:2.7%;height:5.8%;border-radius:999px}.lang-hot.en{left:5.1%;width:17.5%}.lang-hot.ar{left:23.8%;width:17%}.lang-hot.es{left:41%;width:18%}.lang-hot.ru{left:60.4%;width:18%}.lang-hot.tr{left:79.4%;width:15%}.action-hot{left:8%;width:84%;border-radius:999px}.action-hot.signin{top:66.7%;height:7.3%}.action-hot.signup{top:74.8%;height:7.3%}.action-hot.guest{left:22%;width:56%;top:82.6%;height:6%}#next{display:none;min-height:100svh;padding:calc(20px + env(safe-area-inset-top)) 18px 28px;background:linear-gradient(145deg,#ff9d89,#ff7594 38%,#d58ad6 70%,#74c7ff);color:#fff}#next.active{display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between}.back{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff88;background:#ffffff22;color:#fff;font-size:28px}.brand{font-weight:900;font-size:22px}.card{margin-top:18px;background:#fff;color:#283142;border-radius:28px;padding:22px;box-shadow:0 20px 48px rgba(74,40,82,.18)}.card button{width:100%;height:54px;border:0;border-radius:16px;background:linear-gradient(90deg,#FF4D8D,#FF7EB6);color:#fff;font-weight:900;margin-top:14px}</style></head><body><main id="app"><section id="welcome" class="screen active"><img class="approved-welcome-art" src="assets/approved-welcome.jpg" alt="MIRA approved welcome screen"><div class="welcome-hotspots"><button class="hotspot lang-hot en" aria-label="English" data-lang="en"></button><button class="hotspot lang-hot ar" aria-label="العربية" data-lang="ar"></button><button class="hotspot lang-hot es" aria-label="Español" data-lang="es"></button><button class="hotspot lang-hot ru" aria-label="Русский" data-lang="ru"></button><button class="hotspot lang-hot tr" aria-label="Türkçe" data-lang="tr"></button><button class="hotspot action-hot signin" aria-label="Sign In" data-kind="signin"></button><button class="hotspot action-hot signup" aria-label="Sign Up" data-kind="signup"></button><button class="hotspot action-hot guest" aria-label="Continue as Guest" data-kind="guest"></button></div></section><section id="next" class="screen"><div class="top"><button class="back" id="back">‹</button><b class="brand">MIRA</b><span id="langName">English</span></div><div class="card"><h1 id="title">Sign In</h1><p id="text">Authentication screen ready.</p><button>Continue</button></div></section></main><script>const names={en:'English',ar:'العربية',es:'Español',ru:'Русский',tr:'Türkçe'};let lang='en';document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;langName.textContent=names[lang]});document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{const kind=b.dataset.kind;title.textContent=kind==='signin'?'Sign In':kind==='signup'?'Sign Up':'Continue as Guest';welcome.classList.remove('active');next.classList.add('active')});back.onclick=()=>{next.classList.remove('active');welcome.classList.add('active')};</script></body></html>
