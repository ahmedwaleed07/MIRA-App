<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MIRA</title><style>*{box-sizing:border-box}html,body{margin:0;background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}#app{width:min(100%,430px);margin:auto;background:#ff7893;min-height:100vh}.screen{display:none}.screen.active{display:block}#welcome{position:relative;aspect-ratio:240/427;overflow:hidden}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.hot{position:absolute;border:0;background:transparent;z-index:9;cursor:pointer}.lang{top:2.7%;height:5.8%;border-radius:999px}.en{left:5.1%;width:17.5%}.ar{left:23.8%;width:17%}.es{left:41%;width:18%}.ru{left:60.4%;width:18%}.tr{left:79.4%;width:15%}.action{left:8%;width:84%;border-radius:999px}.signin{top:66.7%;height:7.3%}.signup{top:74.8%;height:7.3%}.guest{left:22%;width:56%;top:82.6%;height:6%}.panel{min-height:100svh;padding:24px 18px;background:linear-gradient(145deg,#ff9d89,#ff7594 38%,#d58ad6 70%,#74c7ff);color:#fff}.top{display:flex;align-items:center;justify-content:space-between}.back{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff88;background:#ffffff22;color:#fff;font-size:28px}.brand{direction:ltr!important;unicode-bidi:isolate;font-weight:900;font-size:22px}.card{margin-top:22px;background:#fff;color:#283142;border-radius:28px;padding:24px}.card button{width:100%;height:54px;border:0;border-radius:16px;background:#ff4d8d;color:#fff;font-weight:800}</style></head><body><main id="app"><section id="welcome" class="screen active"><picture><source srcset="assets/approved-welcome.webp" type="image/webp"><img class="art" src="assets/approved-welcome.webp" alt="MIRA approved welcome"></picture><button class="hot lang en" data-lang="en"></button><button class="hot lang ar" data-lang="ar"></button><button class="hot lang es" data-lang="es"></button><button class="hot lang ru" data-lang="ru"></button><button class="hot lang tr" data-lang="tr"></button><button class="hot action signin" data-go="signin"></button><button class="hot action signup" data-go="signup"></button><button class="hot action guest" data-go="guest"></button></section><section id="next" class="screen panel"><div class="top"><button class="back" id="back">‹</button><b class="brand">MIRA</b><span id="langName">English</span></div><div class="card"><h1 id="title">Sign In</h1><p id="text">Authentication screen ready.</p><button>Continue</button></div></section></main><script>const T={en:{name:'English',signin:'Sign In',signup:'Sign Up',guest:'Continue as Guest'},ar:{name:'العربية',signin:'تسجيل الدخول',signup:'إنشاء حساب',guest:'المتابعة كضيف'},es:{name:'Español',signin:'Iniciar sesión',signup:'Crear cuenta',guest:'Continuar como invitado'},ru:{name:'Русский',signin:'Войти',signup:'Регистрация',guest:'Продолжить как гость'},tr:{name:'Türkçe',signin:'Giriş yap',signup:'Kayıt ol',guest:'Misafir olarak devam et'}};let lang='en';document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;langName.textContent=T[lang].name});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{title.textContent=T[lang][b.dataset.go];text.textContent=lang==='ar'?'الزر يشتغل، واسم MIRA واللوغو ثابتين بدون قلب أو إعادة رسم.':'The button works and the MIRA branding stays fixed.';welcome.classList.remove('active');next.classList.add('active')});back.onclick=()=>{next.classList.remove('active');welcome.classList.add('active')};</script></body></html>
