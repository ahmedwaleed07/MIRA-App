<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ef7892">
  <title>MIRA</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:#ef7892}
    body{display:flex;justify-content:center}
    .wrap{position:relative;width:min(100vw,430px);aspect-ratio:9/16;background:#ef7892;overflow:hidden}
    .art{display:block;width:100%;height:100%;object-fit:cover}
    .hot{position:absolute;z-index:5;display:block}
    .en,.ar,.es,.ru,.tr{top:4.2%;height:5.4%}
    .en{left:5.5%;width:18%}.ar{left:24%;width:18%}.es{left:43%;width:17%}.ru{left:61%;width:18%}.tr{left:80%;width:15%}
    .si{left:7%;width:86%;top:67.2%;height:7.1%}
    .su{left:7%;width:86%;top:75.2%;height:6.9%}
    .gu{left:22%;width:56%;top:84%;height:5.1%}
  </style>
</head>
<body>
  <main class="wrap">
    <picture>
      <source srcset="assets/mira_welcome_3x.webp" type="image/webp">
      <img class="art" src="assets/mira_welcome_3x.png" alt="MIRA">
    </picture>
    <a class="hot en" href="#"></a>
    <a class="hot ar" href="#"></a>
    <a class="hot es" href="#"></a>
    <a class="hot ru" href="#"></a>
    <a class="hot tr" href="#"></a>
    <a class="hot si" href="app.html#signin" aria-label="Sign In"></a>
    <a class="hot su" href="app.html#signup" aria-label="Sign Up"></a>
    <a class="hot gu" href="app.html#market" aria-label="Continue as Guest"></a>
  </main>
</body>
</html>
