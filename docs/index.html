<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6f98"><title>MIRA</title><style>@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Tajawal:wght@500;700;800&display=swap');*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#eef1f5}body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button{font:inherit}#app{width:min(100%,430px);margin:auto;min-height:100svh}.screen{display:none;min-height:100svh}.screen.active{display:flex}#welcome{position:relative;overflow:hidden;flex-direction:column;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));background:radial-gradient(circle at 88% 15%,rgba(110,198,255,.92),transparent 26%),radial-gradient(circle at 14% 8%,rgba(255,200,161,.78),transparent 28%),linear-gradient(145deg,#ff9187 0%,#ff6f98 35%,#ef67bc 62%,#74c8ff 100%)}#welcome:before,#welcome:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.10)}#welcome:before{width:360px;height:220px;left:-170px;bottom:15%;transform:rotate(18deg)}#welcome:after{width:430px;height:210px;right:-210px;bottom:5%;transform:rotate(-15deg)}.langbar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;z-index:4}.langbtn{height:42px;border-radius:999px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.06);color:#fff;font-weight:800;font-size:12px;padding:0 4px;white-space:nowrap}.langbtn.active{background:#fff;color:#FF4D8D;border-color:#fff;box-shadow:0 10px 24px rgba(79,28,79,.12)}.hero{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:34px}.brand-lock{direction:ltr!important;unicode-bidi:isolate!important;display:flex;flex-direction:column;align-items:center;width:100%}.icon{width:248px;max-width:70vw;display:block;filter:drop-shadow(0 22px 24px rgba(87,36,92,.20))}.wordmark{width:290px;max-width:79vw;margin-top:18px;display:block}.claim{margin-top:24px;font-size:29px;line-height:1.1;font-weight:900}.desc{margin-top:10px;font-size:16px;line-height:1.35;max-width:320px}.actions{z-index:3;display:grid;gap:14px;margin-top:32px}.action{height:58px;border-radius:999px;font-size:18px;font-weight:900}.primary{border:0;background:#fff;color:#FF4D8D;box-shadow:0 14px 28px rgba(85,30,77,.14)}.secondary{border:2px solid rgba(255,255,255,.85);background:rgba(255,255,255,.04);color:#fff}.ghost{border:0;background:transparent;color:#fff;height:44px}.footer{z-index:3;margin:18px auto 0;direction:ltr!important;unicode-bidi:isolate!important}.footer img{width:190px;display:block}.rtlcopy{direction:rtl;font-family:'Tajawal',sans-serif}.panel{flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) 18px 28px;background:linear-gradient(145deg,#ff9d89,#ff7594 38%,#d58ad6 70%,#74c7ff);color:#fff}.top{display:flex;align-items:center;justify-content:space-between}.back{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff88;background:#ffffff22;color:#fff;font-size:28px}.brand{direction:ltr!important;unicode-bidi:isolate!important;font-weight:900}.card{margin-top:18px;background:#fff;color:#283142;border-radius:28px;padding:22px;box-shadow:0 20px 48px rgba(74,40,82,.18)}.card button{width:100%;height:54px;border:0;border-radius:16px;background:linear-gradient(90deg,#FF4D8D,#FF7EB6);color:#fff;font-weight:900;margin-top:14px}@media(max-height:740px){.hero{padding-top:22px}.icon{width:205px}.wordmark{width:245px}.claim{font-size:24px;margin-top:17px}.desc{font-size:14px}.actions{margin-top:20px;gap:10px}.action{height:52px}.footer{margin-top:8px}}</style></head><body><main id="app"><section id="welcome" class="screen active"><div class="langbar"><button class="langbtn active" data-lang="en">English</button><button class="langbtn" data-lang="ar">العربية</button><button class="langbtn" data-lang="es">Español</button><button class="langbtn" data-lang="ru">Русский</button><button class="langbtn" data-lang="tr">Türkçe</button></div><div class="hero"><div class="brand-lock" dir="ltr"><img class="icon" src="assets/mira_icon.svg?v=2" alt="MIRA icon"><img class="wordmark" src="assets/mira_wordmark.svg?v=2" alt="MIRA"></div><div class="claim" id="claim">Offers all year round</div><div class="desc" id="desc">Discover offers made for you,<br>wherever you are.</div></div><div class="actions" id="actions"><button class="action primary" id="signin">Sign In ›</button><button class="action secondary" id="signup">Sign Up ›</button><button class="action ghost" id="guest">Continue as Guest ›</button></div><div class="footer" dir="ltr"><img src="assets/asas_footer.svg?v=2" alt="Powered by ASAS 360°"></div></section><section id="next" class="screen panel"><div class="top"><button class="back" id="back">‹</button><b class="brand" dir="ltr">MIRA</b><span id="nextLang">English</span></div><div class="card"><h1 id="nextTitle">Sign In</h1><p id="nextText">Authentication screen ready for the next build.</p><button id="continueBtn">Continue</button></div></section></main><script>const copy={en:{claim:'Offers all year round',desc:'Discover offers made for you,<br>wherever you are.',signin:'Sign In ›',signup:'Sign Up ›',guest:'Continue as Guest ›',signinTitle:'Sign In',signupTitle:'Sign Up',guestTitle:'Continue as Guest'},ar:{claim:'عروض طول السنة',desc:'اكتشف العروض المناسبة إلك،<br>وين ما تكون.',signin:'تسجيل الدخول ›',signup:'إنشاء حساب ›',guest:'المتابعة كضيف ›',signinTitle:'تسجيل الدخول',signupTitle:'إنشاء حساب',guestTitle:'المتابعة كضيف'},es:{claim:'Ofertas todo el año',desc:'Descubre ofertas pensadas para ti,<br>estés donde estés.',signin:'Iniciar sesión ›',signup:'Crear cuenta ›',guest:'Continuar como invitado ›',signinTitle:'Iniciar sesión',signupTitle:'Crear cuenta',guestTitle:'Continuar como invitado'},ru:{claim:'Предложения круглый год',desc:'Находите подходящие предложения,<br>где бы вы ни были.',signin:'Войти ›',signup:'Регистрация ›',guest:'Продолжить как гость ›',signinTitle:'Войти',signupTitle:'Регистрация',guestTitle:'Продолжить как гость'},tr:{claim:'Yıl boyu fırsatlar',desc:'Nerede olursanız olun,<br>size uygun fırsatları keşfedin.',signin:'Giriş yap ›',signup:'Kayıt ol ›',guest:'Misafir olarak devam et ›',signinTitle:'Giriş yap',signupTitle:'Kayıt ol',guestTitle:'Misafir olarak devam et'}};let lang='en';function setLang(l){lang=l;document.documentElement.lang=l;document.body.dir='ltr';document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));const c=copy[l];claim.innerHTML=c.claim;desc.innerHTML=c.desc;signin.textContent=c.signin;signup.textContent=c.signup;guest.textContent=c.guest;claim.classList.toggle('rtlcopy',l==='ar');desc.classList.toggle('rtlcopy',l==='ar');actions.classList.toggle('rtlcopy',l==='ar');nextLang.textContent=document.querySelector('.langbtn.active').textContent}document.querySelectorAll('.langbtn').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));function go(kind){const c=copy[lang];nextTitle.textContent=c[kind+'Title'];nextText.textContent=lang==='ar'?'الزر يشتغل، ونكمل شاشة التسجيل بنفس الهوية.':'The button works. Next we build the full authentication screen in the same identity.';nextTitle.classList.toggle('rtlcopy',lang==='ar');nextText.classList.toggle('rtlcopy',lang==='ar');welcome.classList.remove('active');next.classList.add('active')}signin.onclick=()=>go('signin');signup.onclick=()=>go('signup');guest.onclick=()=>go('guest');back.onclick=()=>{next.classList.remove('active');welcome.classList.add('active')};setLang('en');</script></body></html>
