<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f25d8d">
<title>MIRA — Language</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#FF4D8D;--pink2:#FF7EB6;--peach:#FFC8A1;--blue:#6EC6FF;--ink:#A62C63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f35d8e}
body{display:flex;justify-content:center}
.screen{
  width:min(100vw,430px);min-height:100svh;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 88% 10%,rgba(110,198,255,.95),transparent 31%),
    radial-gradient(circle at 5% 16%,rgba(255,200,161,.75),transparent 33%),
    linear-gradient(160deg,#ff8190 0%,#ff4d8d 48%,#ff748b 100%);
  padding:calc(38px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));
}
.screen:before,.screen:after{
  content:"";position:absolute;border-radius:50%;filter:blur(1px);opacity:.32;pointer-events:none
}
.screen:before{width:270px;height:270px;background:#ffd1bd;left:-145px;top:28%}
.screen:after{width:310px;height:310px;background:#85c9ff;right:-190px;top:32%}
.brand{position:relative;z-index:2;text-align:center}
.brandmark{width:178px;height:56px;margin:0 auto;background:#fff;-webkit-mask:url("assets/mira_wordmark.svg") center/contain no-repeat;mask:url("assets/mira_wordmark.svg") center/contain no-repeat}
.prompt{margin:20px auto 22px;color:#fff;font-size:18px;font-weight:700;text-align:center}
.cards{position:relative;z-index:2;display:grid;gap:12px}
.card{
  height:82px;border-radius:22px;overflow:hidden;position:relative;text-decoration:none;
  display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.48);
  box-shadow:0 12px 28px rgba(125,22,68,.14)
}
.card .label{
  position:relative;z-index:3;background:rgba(255,255,255,.92);color:var(--ink);
  padding:8px 18px;border-radius:999px;font-size:15px;font-weight:800;letter-spacing:.2px;
  box-shadow:0 5px 14px rgba(94,31,61,.10)
}
.flagfill{position:absolute;inset:0;font-size:86px;line-height:82px;text-align:center;transform:scale(1.45);filter:saturate(.95)}
.card:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.20))}
.split{position:absolute;inset:0;overflow:hidden}
.split .us,.split .uk{position:absolute;inset:-24%;display:flex;align-items:center;justify-content:center;font-size:112px;transform:scale(1.35)}
.split .us{clip-path:polygon(0 0,100% 0,0 100%)}
.split .uk{clip-path:polygon(100% 0,100% 100%,0 100%)}
.footer{position:absolute;z-index:2;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));text-align:center}
.footer img{width:155px;max-height:42px;object-fit:contain;filter:brightness(0) invert(1);opacity:.96}
.footer-text{font-size:11px;color:#fff;margin-bottom:6px;opacity:.86}
@media(max-height:760px){.card{height:68px}.flagfill{font-size:72px;line-height:68px}.split .us,.split .uk{font-size:94px}.prompt{margin:12px auto 14px}.cards{gap:9px}}
</style>
</head>
<body>
<main class="screen">
  <div class="brand"><div class="brandmark" aria-label="MIRA"></div><div class="prompt">Choose your language</div></div>

  <section class="cards">
    <a class="card" href="welcome-ar.html" onclick="localStorage.setItem('mira_lang','ar')">
      <div class="flagfill">🇮🇶</div><span class="label">العربية</span>
    </a>

    <a class="card" href="welcome-en.html" onclick="localStorage.setItem('mira_lang','en')">
      <div class="split"><span class="us">🇺🇸</span><span class="uk">🇬🇧</span></div><span class="label">ENGLISH</span>
    </a>

    <a class="card" href="welcome-ru.html" onclick="localStorage.setItem('mira_lang','ru')">
      <div class="flagfill">🇷🇺</div><span class="label">Русский</span>
    </a>

    <a class="card" href="welcome-es.html" onclick="localStorage.setItem('mira_lang','es')">
      <div class="flagfill">🇪🇸</div><span class="label">Español</span>
    </a>

    <a class="card" href="welcome-tr.html" onclick="localStorage.setItem('mira_lang','tr')">
      <div class="flagfill">🇹🇷</div><span class="label">Türkçe</span>
    </a>
  </section>

  <footer class="footer">
    <div class="footer-text">Powered by</div>
    <img src="assets/asas_footer.svg" alt="ASAS 360°">
  </footer>
</main>
</body>
</html>
