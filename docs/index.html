<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MIRA</title><style>@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Tajawal:wght@500;600;700;800&display=swap');:root{--pink:#FF4D8D;--pink2:#FF7EB6;--peach:#FFC8A1;--sky:#6EC6FF}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#eef1f5}body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button{font:inherit}#app{width:min(100%,430px);margin:auto;min-height:100svh}.screen{display:none;min-height:100svh}.screen.active{display:flex}#welcome{position:relative;overflow:hidden;flex-direction:column;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(circle at 88% 13%,rgba(110,198,255,.96),transparent 24%),radial-gradient(circle at 12% 8%,rgba(255,200,161,.75),transparent 25%),linear-gradient(145deg,#ff9089 0%,#ff7298 34%,#ef67bd 62%,#74c8ff 100%)}#welcome:before,#welcome:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}#welcome:before{width:360px;height:225px;left:-185px;bottom:12%;transform:rotate(15deg)}#welcome:after{width:430px;height:210px;right:-215px;bottom:5%;transform:rotate(-15deg)}.langbar{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;z-index:4}.langbtn{height:42px;border-radius:999px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.06);color:#fff;font-weight:800;font-size:12px;padding:0 3px;white-space:nowrap}.langbtn.active{background:#fff;color:var(--pink);border-color:#fff;box-shadow:0 10px 24px rgba(79,28,79,.12)}.hero{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:34px}.iconWrap{width:242px;aspect-ratio:240/215;height:auto;max-width:70vw;overflow:visible;filter:drop-shadow(0 22px 24px rgba(89,37,91,.22));flex:0 0 auto}.iconWrap img{width:100%;height:auto;display:block;object-fit:contain}.wordmark{width:282px;max-width:80vw;margin-top:15px;display:block;direction:ltr!important}.claim{margin-top:23px;font-size:29px;line-height:1.08;font-weight:900}.desc{margin-top:10px;font-size:16px;line-height:1.35;max-width:320px}.actions{position:relative;z-index:3;display:grid;gap:14px;margin-top:31px}.action{height:58px;border-radius:999px;font-size:18px;font-weight:900}.primary{border:0;background:#fff;color:var(--pink);box-shadow:0 14px 28px rgba(85,30,77,.14)}.secondary{border:2px solid rgba(255,255,255,.86);background:rgba(255,255,255,.03);color:#fff}.ghost{border:0;background:transparent;color:#fff;height:44px}.footer{position:relative;z-index:5;margin:18px auto 0;display:flex;align-items:center;justify-content:center;width:100%;min-height:42px;padding-bottom:2px}.footer img{width:214px;max-width:62vw;height:auto;display:block;opacity:1;filter:brightness(0) invert(1) drop-shadow(0 1px 1px rgba(0,0,0,.12));transform:none}.rtlText{direction:rtl;font-family:'Tajawal',sans-serif}.panel{flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) 18px 28px;background:linear-gradient(145deg,#ff9d89,#ff7594 38%,#d58ad6 70%,#74c7ff);color:#fff}.top{display:flex;align-items:center;justify-content:space-between}.back{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff88;background:#ffffff22;color:#fff;font-size:28px}.brand{direction:ltr!important;unicode-bidi:isolate;font-weight:900;font-size:22px}.card{margin-top:18px;background:#fff;color:#283142;border-radius:28px;padding:22px;box-shadow:0 20px 48px rgba(74,40,82,.18)}.card button{width:100%;height:54px;border:0;border-radius:16px;background:linear-gradient(90deg,var(--pink),var(--pink2));color:white;font-weight:900;margin-top:14px}@media(max-height:760px){.hero{padding-top:22px}.iconWrap{width:205px}.wordmark{width:242px;margin-top:10px}.claim{font-size:24px;margin-top:17px}.desc{font-size:14px}.actions{margin-top:20px;gap:10px}.action{height:52px}.footer{margin-top:10px;min-height:38px}.footer img{width:196px}}</style></head><body><main id="app"><section id="welcome" class="screen active"><div class="langbar"><button class="langbtn active" data-lang="en">English</button><button class="langbtn" data-lang="ar">العربية</button><button class="langbtn" data-lang="es">Español</button><button class="langbtn" data-lang="ru">Русский</button><button class="langbtn" data-lang="tr">Türkçe</button></div><div class="hero" id="hero"><div class="iconWrap"><img src="assets/mira_icon.svg" alt="MIRA icon"></div><img class="wordmark" src="assets/mira_wordmark.svg" alt="MIRA"><div class="claim" id="claim">Offers all year round</div><div class="desc" id="desc">Discover offers made for you,<br>wherever you are.</div></div><div class="actions" id="actions"><button class="action primary" id="signin">Sign In ›</button><button class="action secondary" id="signup">Sign Up ›</button><button class="action ghost" id="guest">Continue as Guest ›</button></div><div class="footer"><img src="assets/asas_footer.svg" alt="Powered by ASAS 360°"></div></section><section id="next" class="screen panel"><div class="top"><button class="back" id="back">‹</button><b class="brand">MIRA</b><span id="langName">English</span></div><div class="card" id="card"><h1 id="title">Sign In</h1><p id="text">Authentication screen ready.</p><button id="continueBtn">Continue</button></div></section></main><script>const T={en:{name:'English',claim:'Offers all year round',desc:'Discover offers made for you,<br>wherever you are.',signin:'Sign In ›',signup:'Sign Up ›',guest:'Continue as Guest ›',signinTitle:'Sign In',signupTitle:'Sign Up',guestTitle:'Continue as Guest'},ar:{name:'العربية',claim:'عروض طول السنة',desc:'اكتشف العروض المناسبة إلك،<br>وين ما تكون.',signin:'تسجيل الدخول ›',signup:'إنشاء حساب ›',guest:'المتابعة كضيف ›',signinTitle:'تسجيل الدخول',signupTitle:'إنشاء حساب',guestTitle:'المتابعة كضيف'},es:{name:'Español',claim:'Ofertas todo el año',desc:'Descubre ofertas pensadas para ti,<br>estés donde estés.',signin:'Iniciar sesión ›',signup:'Crear cuenta ›',guest:'Continuar como invitado ›',signinTitle:'Iniciar sesión',signupTitle:'Crear cuenta',guestTitle:'Continuar como invitado'},ru:{name:'Русский',claim:'Предложения круглый год',desc:'Находите подходящие предложения,<br>где бы вы ни были.',signin:'Войти ›',signup:'Регистрация ›',guest:'Продолжить как гость ›',signinTitle:'Войти',signupTitle:'Регистрация',guestTitle:'Продолжить как гость'},tr:{name:'Türkçe',claim:'Yıl boyu fırsatlar',desc:'Nerede olursanız olun,<br>size uygun fırsatları keşfedin.',signin:'Giriş yap ›',signup:'Kayıt ol ›',guest:'Misafir olarak devam et ›',signinTitle:'Giriş yap',signupTitle:'Kayıt ol',guestTitle:'Misafir olarak devam et'}};let lang='en';function applyLang(l){lang=l;const c=T[l];document.documentElement.lang=l;document.documentElement.dir='ltr';document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));claim.innerHTML=c.claim;desc.innerHTML=c.desc;signin.textContent=c.signin;signup.textContent=c.signup;guest.textContent=c.guest;hero.classList.toggle('rtlText',l==='ar');actions.classList.toggle('rtlText',l==='ar');langName.textContent=c.name;card.classList.toggle('rtlText',l==='ar')}document.querySelectorAll('.langbtn').forEach(b=>b.onclick=()=>applyLang(b.dataset.lang));function go(kind){const c=T[lang];title.textContent=c[kind+'Title'];text.textContent=lang==='ar'?'الزر يشتغل واسم MIRA واللوغو ثابتين بدون قلب.':'The button works and the MIRA branding stays fixed.';welcome.classList.remove('active');next.classList.add('active')}signin.onclick=()=>go('signin');signup.onclick=()=>go('signup');guest.onclick=()=>go('guest');back.onclick=()=>{next.classList.remove('active');welcome.classList.add('active')};applyLang('en');</script></body></html>
