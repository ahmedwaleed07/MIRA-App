lick="go('profile')"><span>◎</span>Profile</button></nav>`}function offerCard(o){return `<div class="offer" onclick="go('offer',${o.id})"><div class="offer-img"><span class="badge">${o.off}</span><button class="heart" onclick="event.stopPropagation();toggleFav(${o.id})">${state.favorites.has(o.id)?'♥':'♡'}</button>${o.emoji}</div><div class="offer-body"><div class="merchant">${o.shop}</div><div class="offer-title">${o.title}</div><div><span class="price">${o.price}</span><span class="old">${o.old}</span></div></div></div>`}function toggleFav(id){state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);go(document.body.dataset.route||'home')}const routes={welcome(){document.body.dataset.route='welcome';const t=langs[state.lang];app().innerHTML=`<section class="welcome${rtlClass()}"><div class="langbar">${Object.entries(langs).map(([k,v])=>`<button class="${state.lang===k?'on':''}" onclick="state.lang='${k}';go('welcome')">${v.name}</button>`).join('')}</div><div class="hero"><div class="gift"><img src="${A}mira_icon.svg"></div><img class="wordmark" src="${A}mira_wordmark.svg"><div class="claim">${t.claim}</div><div class="subclaim">${t.desc}</div></div><div class="welcome-actions"><button class="pill white" onclick="state.authMode='signin';go('auth')">${t.signin} ›</button><button class="pill outline" onclick="state.authMode='signup';go('auth')">${t.signup} ›</button><button class="pill clear" onclick="go('market')">${t.guest} ›</button></div><div class="powered"><img src="${A}asas_footer_strong.svg?v=2" alt="Powered by ASAS 360°"></div></section>`},auth(){document.body.dataset.route='auth';const sign=state.authMode==='signup';app().innerHTML=`<section class="page${rtlClass()}"><div class="content">${back('MIRA')}<h1 class="title">${sign?'Create your account':'Welcome back'}</h1><p class="subtitle">${sign?'Join MIRA with your phone number or email.':'Sign in with your phone number or email.'}</p><div class="card"><div class="tabs"><button class="${s
