<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FF4D8D"><title>MIRA</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f5f8}button{font:inherit}.app{width:min(100%,430px);min-height:100svh;margin:auto}.welcome{min-height:100svh;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;background:radial-gradient(circle at 90% 12%,#6EC6FF,transparent 27%),radial-gradient(circle at 7% 8%,#FFC8A1,transparent 28%),linear-gradient(145deg,#ff9189 0%,#ff7299 35%,#ef66bd 64%,#76c8ff 100%);overflow:hidden}.langs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.langs button{height:42px;border-radius:999px;border:1px solid #ffffff99;background:#ffffff12;color:#fff;font-weight:700;font-size:12px}.langs button.active{background:#fff;color:#FF4D8D}.hero{text-align:center;display:flex;flex-direction:column;align-items:center;padding-top:30px}.gift{width:240px;max-width:70vw}.wordmark{width:280px;max-width:80vw;margin-top:12px}.claim{font-size:29px;font-weight:800;margin-top:18px}.desc{font-size:16px;line-height:1.35;margin-top:8px}.actions{display:grid;gap:13px;margin-top:28px}.pill{height:58px;border-radius:999px;font-size:18px;font-weight:800}.primary{border:0;background:#fff;color:#FF4D8D}.outline{border:2px solid #fff;background:transparent;color:#fff}.ghost{border:0;background:transparent;color:#fff}.footer{width:240px;height:76px;margin:12px auto 0}.footer img{width:100%;height:100%;object-fit:contain}.page{min-height:100svh;background:#f7f7fb;padding:20px}.back{border:0;background:#fff;border-radius:50%;width:44px;height:44px;font-size:28px}.card{background:#fff;border-radius:24px;padding:20px;margin-top:18px;box-shadow:0 10px 30px #00000012}.btn{width:100%;height:54px;border:0;border-radius:16px;background:linear-gradient(90deg,#FF4D8D,#FF7EB6,#FFC8A1);color:#fff;font-weight:800;margin-top:12px}.hidden{display:none}</style></head><body><main id="app" class="app"><section id="welcome" class="welcome"><div class="langs"><button class="active" onclick="setLang('en',this)">English</button><button onclick="setLang('ar',this)">العربية</button><button onclick="setLang('es',this)">Español</button><button onclick="setLang('ru',this)">Русский</button><button onclick="setLang('tr',this)">Türkçe</button></div><div class="hero"><img class="gift" src="assets/mira_icon.svg" alt="MIRA"><img class="wordmark" src="assets/mira_wordmark.svg" alt="MIRA"><div id="claim" class="claim">Offers all year round</div><div id="desc" class="desc">Discover offers made for you,<br>wherever you are.</div></div><div class="actions"><button id="signin" class="pill primary" onclick="openPage('Sign In')">Sign In ›</button><button id="signup" class="pill outline" onclick="openPage('Sign Up')">Sign Up ›</button><button id="guest" class="pill ghost" onclick="openPage('Continue as Guest')">Continue as Guest ›</button></div><div class="footer"><img src="assets/asas_footer_strong.svg" alt="Powered by ASAS 360°"></div></section><section id="next" class="page hidden"><button class="back" onclick="backHome()">‹</button><div class="card"><h1 id="title">MIRA</h1><p>The application is loading correctly. Continue to the next setup step.</p><button class="btn" onclick="alert('MIRA flow is active')">Continue</button></div></section></main><script>var T={en:['Offers all year round','Discover offers made for you,<br>wherever you are.','Sign In ›','Sign Up ›','Continue as Guest ›'],ar:['عروض طول السنة','اكتشف العروض المناسبة إلك،<br>وين ما تكون.','تسجيل الدخول ›','إنشاء حساب ›','المتابعة كضيف ›'],es:['Ofertas todo el año','Descubre ofertas pensadas para ti,<br>estés donde estés.','Iniciar sesión ›','Crear cuenta ›','Continuar como invitado ›'],ru:['Предложения круглый год','Находите подходящие предложения,<br>где бы вы ни были.','Войти ›','Регистрация ›','Продолжить как гость ›'],tr:['Yıl boyu fırsatlar','Nerede olursanız olun,<br>size uygun fırsatları keşfedin.','Giriş yap ›','Kayıt ol ›','Misafir olarak devam et ›']};function setLang(k,b){var t=T[k];document.getElementById('claim').innerHTML=t[0];document.getElementById('desc').innerHTML=t[1];document.getElementById('signin').textContent=t[2];document.getElementById('signup').textContent=t[3];document.getElementById('guest').textContent=t[4];var bs=document.querySelectorAll('.langs button');for(var i=0;i<bs.length;i++)bs[i].classList.remove('active');b.classList.add('active')}function openPage(t){document.getElementById('welcome').classList.add('hidden');document.getElementById('next').classList.remove('hidden');document.getElementById('title').textContent=t}function backHome(){document.getElementById('next').classList.add('hidden');document.getElementById('welcome').classList.remove('hidden')}</script></body></html>
