',old:'1,000,000',off:'25%',city:'Baghdad',cat:'Electronics'},{id:2,shop:'Urban Men',title:'Premium Sneakers',emoji:'👟',price:'90,000 IQD',old:'150,000',off:'40%',city:'Baghdad',cat:'Men'},{id:3,shop:'Mira Café',title:'Coffee & Dessert Bundle',emoji:'☕',price:'12,000 IQD',old:'18,000',off:'33%',city:'Baghdad',cat:'Restaurants'},{id:4,shop:'Glow Beauty',title:'Weekend Beauty Box',emoji:'💄',price:'45,000 IQD',old:'70,000',off:'36%',city:'Erbil',cat:'Beauty'},{id:5,shop:'Home Line',title:'Kitchen Essentials',emoji:'🏠',price:'65,000 IQD',old:'95,000',off:'32%',city:'Baghdad',cat:'Home'},{id:6,shop:'Kids Planet',title:'Back to School Set',emoji:'🎒',price:'35,000 IQD',old:'55,000',off:'36%',city:'Basra',cat:'Kids'}];function set(html){app.innerHTML=html;window.scrollTo(0,0)}function rtl(){return state.lang==='ar'?'rtl':''}function logo(){return `<div class="brand"><img src="${A}mira_icon.svg"><b>MIRA</b></div>`}function top(title=''){return `<div class="topbar">${logo()}<b>${title}</b><div class="topicons"><button class="iconbtn" onclick="notifications()">🔔</button><button class="iconbtn" onclick="profile()">👤</button></div></div>`}function nav(active){return `<nav class="bottomnav">${[['home','⌂','Home'],['explore','⌖','Explore'],['search','⌕','Search'],['favorites','♡','Favorites'],['profile','◉','Profile']].map(x=>`<button class="${active===x[0]?'on':''}" onclick="${x[0]}()"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}function welcome(){const t=L[state.lang];set(`<section class="welcome ${rtl()}"><div class="langbar">${Object.entries(L).map(([k,v])=>`<button class="${state.lang===k?'on':''}" onclick="state.lang='${k}';welcome()">${v.n}</button>`).join('')}</div><div class="hero"><div class="gift"><img src="${A}mira_icon.svg"></div><img class="wordmark" src="${A}mira_wordmark.svg"><div class="claim">${t.claim}</div><div class="subclaim">${t.desc}</div></div><div class="welcome-actions"><button class="pill white" onclick="auth('signin')">${t.signin} ›</button><button class="pill outline" onclick="auth('signup')">${t.signup} ›</button><button class="pill clear" onclick="market()">${t.guest} ›</button></div><div class="powered"><img src="${A}asas_footer_strong.svg" alt="Powered by ASAS 360°"></div></section>`)}function auth(mode){state.authMode=mode;set(`<section class="page ${rtl()}"><div class="content"><button class="back" onclick="welcome()">‹</button><h1 class="title">${mode==='signin'?'Welcome back':'Create your account'}</h1><p class="subtitle">Use your phone number or email.</p><div class="card"><div class="tabs"><button class="${state.authType==='phone'?'on':''}" onclick="state.authType='phone';auth('${mode}')">Phone</button><button class="${state.authType==='email'?'on':''}" onclick="state.authType='email';auth('${mode}')">Email</button></div>${state.authType==='phone'?`<div class="field"><label>Country</label><select class="input"><option>🇮🇶 Iraq +964</option><option>🇦🇪 UAE +971</option><option>🇸🇦 Saudi Arabia +966</option><option>🇹🇷 Türkiye +90</option><option>🇩🇪 Germany +49</option><option>🇨🇦 Canada +1</option><option>🇺🇸 United States +1</option><option>🇬🇧 United Kingdom +44</option></select></div><div class="field"><label>Phone number</label><input class="input" placeholder="7XX XXX XXXX"></div>`:`<div class="field"><label>Email</label><input class="input" type="email" placeholder="name@example.com"></div>`}<button class="primary" onclick="otp()">Continue</button></div></div></section>`)}function otp(){set(`<section class="page ${rtl()}"><div class="content"><button class="back" onclick="auth(state.authMode)">‹</button><h1 class="title">Verify your account</h1><p class="subtitle">Enter the 6-digit code we sent to you.</p><div class="card"><div class="otp">${'<input maxlength="1">'.repeat(6)}</div><button class="primary" onclick="market()">Verify</button><div class="notice">Didn't get the code? <b>Resend</b></div></div></div></section>`)}function market(){const countries=['🇮🇶 Iraq','🇦🇪 UAE','🇸🇦 Saudi Arabia', oggleInterest(x){state.interests=state.interests.includes(x)?state.interests.filter(i=>i!==x):[...state.interests,x];interests()}function offerCard(o){return `<article class="offer" onclick="detail(${o.id})"><div class="offerimg"><span class="badge">${o.off} OFF</span><button class="heart" onclick="event.stopPropagation();fav(${o.id})">${state.favorites.has(o.id)?'♥':'♡'}</button>${o.emoji}</div><div class="offerbody"><div class="merchant">${o.shop}</div><div class="offertitle">${o.title}</div><div><span class="price">${o.price}</span><span class="old">${o.old}</span></div></div></article>`}function home(){state.tab='home';set(`<section class="page">${top()}<div class="content"><div class="search" onclick="search()">⌕ <span style="color:#8d8f9d">Search offers, stores, brands...</span></div><div style="height:14px"></div><div class="banner"><small>${state.city}, ${state.market}</small><h2>Deals made for you</h2><p>Fresh offers from stores you love.</p></div><div class="sectionhead"><h3>Flash Sales</h3><button class="linkbtn" onclick="allOffers('Flash Sales')">See All</button></div><div class="offers">${offers.slice(0,2).map(offerCard).join('')}</div><div class="sectionhead"><h3>Shop by Category</h3></div><div class="cats">${[['👕','Men'],['👗','Women'],['📱','Electronics'],['🍽️','Restaurants'],['💄','Beauty'],['🏠','Home'],['🧸','Kids'],['🚗','Auto']].map(c=>`<button class="cat" onclick="category('${c[1]}')"><b>${c[0]}</b>${c[1]}</button>`).join('')}</div><div class="sectionhead"><h3>Recommended for You</h3><button class="linkbtn" onclick="allOffers('Recommended')">See All</button></div><div class="offers">${offers.slice(2,6).map(offerCard).join('')}</div></div>${nav('home')}</section>`)}function detail(id){const o=offers.find(x=>x.id===id);set(`<section class="page"><div class="detailhero"><button class="back" style="position:absolute;left:14px;top:18px" onclick="home()">‹</button>${o.emoji}</div><div class="detailbody"><div class="row"><div><div class="merchant">${o.cat} • ${o.city}</div><h1 style="margin:4px 0 7px">${o.title}</h1></div><button class="iconbtn" onclick="fav(${o.id});detail(${o.id})">${state.favorites.has(o.id)?'♥':'♡'}</button></div><div class="store"><div class="avatar">${o.shop[0]}</div><div><b>${o.shop}</b><div class="small">✓ Verified Merchant</div></div><button class="linkbtn" onclick="toggleFollow(1);detail(${o.id})">${state.following.has(1)?'Following':'Follow'}</button></div><div class="stats"><div class="stat"><b>${o.off}</b><span class="small">Discount</span></div><div class="stat"><b>${o.price.split(' ')[0]}</b><span class="small">Offer price</span></div><div class="stat"><b>2.4 km</b><span class="small">Away</span></div></div><h3>Offer details</h3><p>Limited-time promotion available at selected branches. Valid while stocks last.</p><div class="notice">Ends in <b>02:14:36</b></div><h3>Available at</h3><div class="map"><span class="pin" style="left:48%;top:40%">📍</span></div><div class="actions2"><button class="secondary" onclick="alert('Opening directions…')">Directions</button><button class="primary" onclick="alert('Opening WhatsApp…')">WhatsApp</button></div><button class="secondary" style="margin-top:10px" onclick="reportOffer(${o.id})">Report offer</button></div></section>`)}function fav(id){state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id)}function toggleFollow(id){state.following.has(id)?state.following.delete(id):state.following.add(id)}function category(cat){set(`<section class="page">${top(cat)}<div class="content"><div class="row"><button class="back" onclick="home()">‹</button><button class="secondary" style="width:auto;padding:0 16px" onclick="filters()">Filters</button></div><div class="sectionhead"><h3>${cat} Offers</h3><span class="small">${offers.filter(o=>o.cat===cat).length||offers.length} results</span></div><div class="offers">${(offers.filter(o=>o.cat===cat).length?offers.filter(o=>o.cat===cat):offers).map(offerCard).join('')}</div></div>${nav('home')}</section>`)}function allOffers(title){set(`<section class="page">${top(title)}<div class="content"><button class="back" onclick="home()">‹</button><div style="height:12px"></div><div class="offers">${offers.map(offerCard).join('')}</div></div>${nav('home')}</section>`)}function explore(){state.tab='explore';set(`<section class="page">${top('Explore')}<div class="content"><div class="row"><div class="search" style="flex:1">⌕ <input placeholder="Search this area"></div><button class="iconbtn" onclick="filters()">⚙</button></div><div style="height:14px"></div><div class="map"><span class="pin" style="left:25%;top:30%">📍</span><span class="pin" style="left:61%;top:46%">📍</span><span class="pin" style="left:42%;top:65%">📍</span></div><div class="sectionhead"><h3>Offers Near Me</h3><span class="small">Within 5 km</span></div><div class="list">${offers.slice(0,4).map(o=>`<div class="item" onclick="detail(${o.id})"><div class="itemicon">${o.emoji}</div><div class="grow"><b>${o.title}</b><div class="small">${o.shop} • ${o.city}</div></div><b style="color:var(--p)">${o.off}</b></div>`).join('')}</div></div>${nav('explore')}</section>`)}function search(){state.tab='search';set(`<section class="page">${top('Search')}<div class="content"><div class="search">⌕ <input id="q" placeholder="Search products, offers, stores..." oninput="runSearch(this.value)"></div><div class="sectionhead"><h3>Trending</h3></div><div class="chips">${['Samsung','Shoes','Pizza','Perfume','TV','Coffee'].map(x=>`<button class="chip" onclick="document.getElementById('q').value='${x}';runSearch('${x}')">${x}</button>`).join('')}</div><div id="results"><div class="sectionhead"><h3>Popular Offers</h3></div><div class="offers">${offers.slice(0,4).map(offerCard).join('')}</div></div></div>${nav('search')}</section>`)}function runSearch(q){const r=offers.filter(o=>(o.title+' '+o.shop+' '+o.cat).toLowerCase().includes(q.toLowerCase()));document.getElementById('results').innerHTML=`<div class="sectionhead"><h3>Results</h3><span class="small">${r.length}</span></div><div class="offers">${r.map(offerCard).join('')||'<p>No results found.</p>'}</div>`}function filters(){set(`<section class="page"><div class="content"><button class="back" onclick="explore()">‹</button><h1 class="title">Filters</h1><div class="card"><div class="field"><label>Distance</label><select class="input"><option>Nearby</option><option>1 km</option><option>5 km</option><option>10 km</option><option>25 km</option><option>50 km</option></select></div><div class="field"><label>Minimum discount</label><select class="input"><option>Any</option><option>20%+</option><option>30%+</option><option>50%+</option></select></div><div class="field"><label>Sort</label><select class="input"><option>Recommended</option><option>Nearest</option><option>Biggest Discount</option><option>Newest</option><option>Ending Soon</option></select></div><button class="primary" onclick="explore()">Apply Filters</button></div></div></section>`)}function favorites(){state.tab='favorites';const f=offers.filter(o=>state.favorites.has(o.id));set(`<section class="page">${top('Favorites')}<div class="content"><div class="tabs"><button class="on">Saved Offers</button><button>Saved Stores</button></div>${f.length?`<div class="offers">${f.map(offerCard).join('')}</div>`:`<div class="card"><h3>No saved offers yet.</h3><p class="subtitle">Start exploring and save the deals you love.</p><button class="primary" onclick="home()">Explore Offers</button></div>`}</div>${nav('favorites')}</section>`)}function notifications(){set(`<section class="page">${top('Notifications')}<div class="content"><button class="back" onclick="home()">‹</button><div style="height:12px"></div><div class="list"><div class="item"><div class="itemicon">⚡</div><div><b>Flash Sale started</b><div class="small">Samsung has a new 25% offer near you.</div></div></div><div class="item"><div class="itemicon">♥</div><div><b>Favorite store update</b><div class="small">Urban Men published a new offer. v></div></section>`)}function reportOffer(id){set(`<section class="page"><div class="content"><button class="back" onclick="detail(${id})">‹</button><h1 class="title">Report Offer</h1><div class="card"><div class="field"><label>Reason</label><select class="input"><option>Incorrect price</option><option>Expired offer</option><option>Misleading offer</option><option>Wrong location</option><option>Scam / fraud suspicion</option><option>Other</option></select></div><div class="field"><label>Details</label><textarea class="input" style="height:110px;padding-top:12px" placeholder="Tell us what happened"></textarea></div><button class="primary" onclick="alert('Report submitted');home()">Submit Report</button></div></div></section>`)}function merchant(){set(`<section class="page">${top('Merchant')}<div class="content"><div class="banner"><small>Business Dashboard</small><h2>ABC Electronics</h2><p>Verified • Baghdad</p></div><div class="sectionhead"><h3>Overview</h3></div><div class="kpis"><div class="kpi"><span class="small">Active Offers</span><strong>${state.merchantOffers}</strong></div><div class="kpi"><span class="small">Views</span><strong>18.4K</strong></div><div class="kpi"><span class="small">Favorites</span><strong>220</strong></div><div class="kpi"><span class="small">Leads</span><strong>143</strong></div></div><div class="sectionhead"><h3>Campaign Performance</h3></div><div class="list"><div class="item"><div class="itemicon">📺</div><div class="grow"><b>Samsung TV Weekend Offer</b><div class="small">18,000 impressions • 95 WhatsApp clicks</div></div><b style="color:var(--p)">25%</b></div><div class="item" onclick="merchantAnalytics()"><div class="itemicon">📊</div><div class="grow"><b>Analytics</b><div class="small">Cities, categories, conversions</div></div>›</div><div class="item" onclick="billing()"><div class="itemicon">💳</div><div class="grow"><b>Subscription & Billing</b><div class="small">Business Plan</div></div>›</div></div></div><button class="fab" onclick="createOffer()">＋</button>${nav('profile')}</section>`)}function createOffer(){set(`<section class="page"><div class="content"><button class="back" onclick="merchant()">‹</button><h1 class="title">Create Offer</h1><p class="subtitle">Create, preview and publish a promotion.</p><div class="card"><div class="field"><label>Offer title</label><input class="input" value="Samsung TV Weekend Offer"></div><div class="grid2"><div class="field"><label>Original price</label><input class="input" value="1000000"></div><div class="field"><label>Offer price</label><input class="input" value="750000"></div></div><div class="field"><label>Type</label><select class="input"><option>Standard Offer</option><option>Flash Sale</option><option>Featured Offer</option></select></div><div class="field"><label>Branches</label><select class="input"><option>All Baghdad branches</option><option>Mansour only</option><option>Karrada only</option></select></div><div class="field"><label>End date</label><input class="input" type="date"></div><button class="secondary" onclick="alert('Preview ready')">Preview Offer</button><button class="primary" style="margin-top:10px" onclick="state.merchantOffers++;alert('Offer published');merchant()">Publish Offer</button></div></div></section>`)}function merchantAnalytics(){set(`<section class="page"><div class="content"><button class="back" onclick="merchant()">‹</button><h1 class="title">Merchant Analytics</h1><div class="kpis"><div class="kpi"><span class="small">Impressions</span><strong>18K</strong></div><div class="kpi"><span class="small">Offer Views</span><strong>2.1K</strong></div><div class="kpi"><span class="small">WhatsApp</span><strong>95</strong></div><div class="kpi"><span class="small">Directions</span><strong>48</strong></div></div><div class="sectionhead"><h3>Best Cities</h3></div><div class="card"><p>Baghdad <b style="float:right">72%</b></p><p>Erbil <b style="float:right">18%</b></p><p>Basra <b style="float:right">10%</b></p></div></div></section>`)}function billing(){set(`<section class="page"><div class="content"><button class="back" onclick="merchant()">‹</button><h1 class="title">Subscription & Billing</h1><div class="card"><h2>Business Plan</h2><p class="subtitle">Renews monthly • 5 branches • advanced analytics</p><button class="primary">Upgrade Plan</button></div><div class="sectionhead"><h3>Invoices</h3></div><div class="list"><div class="item"><div class="grow"><b>September 2026</b><div class="small">Paid</div></div><b>Invoice ›</b></div></div></div></section>`)}function admin(){set(`<section class="page">${top('Admin')}<div class="content"><div class="banner"><small>MIRA Control Center</small><h2>Admin Dashboard</h2><p>Iraq Market • Live</p></div><div class="sectionhead"><h3>Platform KPIs</h3></div><div class="kpis"><div class="kpi"><span class="small">Users</span><strong>12.8K</strong></div><div class="kpi"><span class="small">Merchants</span><strong>428</strong></div><div class="kpi"><span class="small">Active Offers</span><strong>1,245</strong></div><div class="kpi"><span class="small">Pending</span><strong>17</strong></div></div><div class="sectionhead"><h3>Admin Tools</h3></div><div class="list"><div class="item" onclick="adminMerchants()"><div class="itemicon">🏪</div><div class="grow"><b>Merchant Approvals</b><div class="small">8 awaiting review</div></div>›</div><div class="item"><div class="itemicon">🎯</div><div class="grow"><b>MIRA Specials & Campaigns</b><div class="small">Manage banners and featured offers</div></div>›</div><div class="item"><div class="itemicon">🌍</div><div class="grow"><b>Markets</b><div class="small">Iraq active • UAE coming soon</div></div>›</div><div class="item"><div class="itemicon">💰</div><div class="grow"><b>Revenue</b><div class="small">Subscriptions & promoted placements</div></div>›</div></div></div>${nav('profile')}</section>`)}function adminMerchants(){set(`<section class="page"><div class="content"><button class="back" onclick="admin()">‹</button><h1 class="title">Merchant Approvals</h1><div class="list">${['Future Tech','Baghdad Style','Urban Coffee'].map((x,i)=>`<div class="item"><div class="itemicon">🏪</div><div class="grow"><b>${x}</b><div class="small">Documents submitted • Baghdad</div></div><button class="linkbtn" onclick="alert('Merchant approved')">Approve</button></div>`).join('')}</div></div></section>`)}welcome();</script></body></html>
