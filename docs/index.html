<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FF7EB6"><title>MIRA</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f5f8}button{font:inherit;-webkit-tap-highlight-color:transparent}.app{width:min(100%,430px);min-height:100svh;margin:auto}.welcome{height:100svh;min-height:640px;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative;overflow:hidden;background:radial-gradient(circle at 90% 10%,rgba(110,198,255,.96) 0 10%,transparent 28%),radial-gradient(circle at 8% 6%,rgba(255,200,161,.88) 0 10%,transparent 30%),linear-gradient(145deg,#ff9489 0%,#ff779c 34%,#f35ca8 60%,#d184d5 78%,#72c7ff 100%)}.welcome:before,.welcome:after{content:"";position:absolute;pointer-events:none;border-radius:50%;filter:blur(.2px)}.welcome:before{width:620px;height:215px;left:-355px;top:36%;background:linear-gradient(90deg,rgba(255,198,160,.88),rgba(255,105,151,.62));transform:rotate(13deg)}.welcome:after{width:650px;height:215px;right:-390px;top:47%;background:linear-gradient(90deg,rgba(255,163,151,.6),rgba(111,198,255,.48));transform:rotate(-15deg)}.langs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;position:relative;z-index:5}.langs button{height:42px;border-radius:999px;border:1px solid rgba(255,255,255,.62);background:rgba(255,255,255,.055);color:#fff;font-weight:750;font-size:11.5px;padding:0 2px;white-space:nowrap}.langs button.active{background:#fff;color:#FF4D8D;border-color:#fff;box-shadow:0 8px 22px rgba(83,32,79,.12)}.hero{position:relative;z-index:3;text-align:center;display:flex;flex-direction:column;align-items:center;padding-top:clamp(18px,3vh,34px)}.giftcrop{width:210px;max-width:60vw;aspect-ratio:240/215;overflow:hidden;clip-path:inset(2.7% 4% 2.5% 4% round 24%);filter:drop-shadow(0 18px 22px rgba(76,32,87,.23))}.giftcrop img{width:100%;height:100%;object-fit:cover;display:block}.wordmark{width:244px;max-width:70vw;margin-top:9px;display:block}.claim{font-size:clamp(25px,7vw,31px);font-weight:850;line-height:1.05;margin-top:15px;letter-spacing:-.6px}.desc{font-size:15.5px;line-height:1.25;margin-top:7px}.actions{position:relative;z-index:4;display:grid;gap:10px;margin-top:clamp(15px,2.3vh,25px)}.pill{height:55px;border-radius:999px;font-size:17px;font-weight:820}.primary{border:0;background:#fff;color:#FF4D8D;box-shadow:0 12px 28px rgba(91,33,77,.14)}.outline{border:2px solid rgba(255,255,255,.94);background:rgba(255,255,255,.02);color:#fff}.ghost{height:40px;border:0;background:transparent;color:#fff}.footer{position:relative;z-index:5;width:228px;height:64px;margin:auto auto 0;display:flex;align-items:center;justify-content:center}.footer img{width:100%;height:100%;object-fit:contain;display:block;filter:brightness(0) invert(1);opacity:.98}.page{min-height:100svh;background:#f7f7fb;padding:20px}.back{border:0;background:#fff;border-radius:50%;width:44px;height:44px;font-size:28px}.card{background:#fff;border-radius:24px;padding:20px;margin-top:18px;box-shadow:0 10px 30px #00000012}.btn{width:100%;height:54px;border:0;border-radius:16px;background:linear-gradient(90deg,#FF4D8D,#FF7EB6,#FFC8A1);color:#fff;font-weight:800;margin-top:12px}.hidden{display:none}@media(max-height:760px){.langs button{height:37px;font-size:10px}.hero{padding-top:8px}.giftcrop{width:172px}.wordmark{width:198px;margin-top:5px}.claim{font-size:22px;margin-top:8px}.desc{font-size:12.5px;margin-top:5px}.actions{margin-top:9px;gap:6px}.pill{height:46px;font-size:14.5px}.ghost{height:32px}.footer{height:46px;width:185px}}</style></head><body><main id="app" class="app"><section id="welcome" class="welcome"><div class="langs"><button class="active" onclick="setLang('en',this)">English</button><button onclick="setLang('ar',this)">العربية</button><button onclick="setLang('es',this)">Español</button><button onclick="setLang('ru',this)">Русский</button><button onclick="setLang('tr',this)">Türkçe</button></div><div class="hero"><div class="giftcrop"><img src="assets/mira_icon.svg" alt="MIRA icon"></div><img class="wordmark" src="assets/mira_wordmark.svg" alt="MIRA"><div id="claim" class="claim">Offers all year round</div><div id="desc" class="desc">Discover offers made for you,<br>wherever you are.</div></div><div class="actions"><button id="signin" class="pill primary" onclick="openPage('Sign In')">Sign In ›</button><button id="signup" class="pill outline" onclick="openPage('Sign Up')">Sign Up ›</button><button id="guest" class="pill ghost" onclick="openPage('Continue as Guest')">Continue as Guest ›</button></div><div class="footer"><img src="assets/asas_footer.svg?v=4" alt="Powered by ASAS 360°"></div></section><section id="next" class="page hidden"><button class="back" onclick="backHome()">‹</button><div class="card"><h1 id="title">MIRA</h1><p>The application is ready for the next setup step.</p><button class="btn" onclick="alert('MIRA flow is active')">Continue</button></div></section></main><script>var T={en:['Offers all year round','Discover offers made for you,<br>wherever you are.','Sign In ›','Sign Up ›','Continue as Guest ›'],ar:['عروض طول السنة','اكتشف العروض المناسبة إلك،<br>وين ما تكون.','تسجيل الدخول ›','إنشاء حساب ›','المتابعة كضيف ›'],es:['Ofertas todo el año','Descubre ofertas pensadas para ti,<br>estés donde estés.','Iniciar sesión ›','Crear cuenta ›','Continuar como invitado ›'],ru:['Предложения круглый год','Находите подходящие предложения,<br>где бы вы ни были.','Войти ›','Регистрация ›','Продолжить как гость ›'],tr:['Yıl boyu fırsatlar','Nerede olursanız olun,<br>size uygun fırsatları keşfedin.','Giriş yap ›','Kayıt ol ›','Misafir olarak devam et ›']};function setLang(k,b){var t=T[k];document.getElementById('claim').innerHTML=t[0];document.getElementById('desc').innerHTML=t[1];document.getElementById('signin').textContent=t[2];document.getElementById('signup').textContent=t[3];document.getElementById('guest').textContent=t[4];document.querySelectorAll('.langs button').forEach(function(x){x.classList.remove('active')});b.classList.add('active')}function openPage(t){document.getElementById('welcome').classList.add('hidden');document.getElementById('next').classList.remove('hidden');document.getElementById('title').textContent=t}function backHome(){document.getElementById('next').classList.add('hidden');document.getElementById('welcome').classList.remove('hidden')}</script></body></html>
