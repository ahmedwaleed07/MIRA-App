20px}.link{border:0;background:transparent;color:var(--p);font-weight:850}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cat{border:1px solid #ededf3;background:#fff;border-radius:17px;padding:11px 4px;font-size:11px;font-weight:800}.cat b{display:block;font-size:25px;margin-bottom:4px}.offers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.offer{overflow:hidden;border:1px solid #eeeeF3;border-radius:19px;background:#fff;text-align:left;padding:0}.offerimg{height:120px;display:flex;align-items:center;justify-content:center;font-size:50px;background:linear-gradient(135deg,#ffd2df,#d8efff);position:relative}.badge{position:absolute;top:8px;left:8px;border-radius:999px;background:var(--p);color:#fff;font-size:10px;font-weight:900;padding:5px 7px}.fav{position:absolute;right:8px;top:8px;width:29px;height:29px;border:0;border-radius:50%;background:#fff}.offerbody{padding:9px}.merchant{font-size:11px;color:#888b98}.offertitle{font-size:13px;font-weight:850;margin:3px 0 5px}.price{font-weight:900;color:var(--p);font-size:13px}.old{text-decoration:line-through;color:#9a9ca7;font-size:10px;margin-left:3px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);display:grid;grid-template-columns:repeat(5,1fr);z-index:30;background:#ffffffef;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:6px 5px calc(6px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#8d8f9a;font-size:10px;font-weight:800}.nav button.on{color:var(--p)}.nav span{display:block;font-size:20px}.list{display:grid;gap:9px}.item{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid #eeeef3;border-radius:17px;padding:13px}.itemicon{width:43px;height:43px;border-radius:13px;background:#fff0f6;display:flex;align-items:center;justify-content:center;font-size:21px}.grow{flex:1}.small{font-size:12px;color:#898c99}.map{height:205px;border-radius:21px;position:relative;overflow:hidden;background:linear-gradient(145deg,#dcecff,#fce0eb)}.map:before{content:"";position:absolute;inset:-25%;background:repeating-linear-gradient(38deg,transparent 0 25px,#fff9 25px 30px)}.pin{position:absolute;font-size:32px}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kpi{background:#fff;border:1px solid #eeeef3;border-radius:17px;padding:14px}.kpi strong{display:block;font-size:23px}.detailhero{height:275px;display:flex;align-items:center;justify-content:center;font-size:100px;background:linear-gradient(135deg,#ffd2df,#d8efff);position:relative}.detailbody{position:relative;margin-top:-28px;border-radius:27px 27px 0 0;background:#fff;padding:20px 17px 100px;min-height:55vh}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.store{display:flex;align-items:center;gap:9px}.avatar{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--p2),var(--sky));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}.actions2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.notice{margin-top:11px;padding:11px 13px;border-radius:14px;background:#fff3f7;color:#9a345a;font-size:13px}.profile{text-align:center;padding:20px 0}.profilepic{width:82px;height:82px;border-radius:26px;margin:auto;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--p),var(--sky));color:#fff;font-size:29px;font-weight:900}.switch{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #eeeef3}.toggle{width:47px;height:27px;border:0;border-radius:99px;background:#ddd;position:relative}.toggle:after{content:"";position:absolute;width:21px;height:21px;top:3px;left:3px;border-radius:50%;background:#fff;box-shadow:0 2px 5px #0002}.toggle.on{background:var(--p)}.toggle.on:after{left:23px}.fab{position:fixed;right:calc(50% - min(215px,50%) + 17px);bottom:96px;width:57px;height:57px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:26px;box-shadow:0 12px 27px #ff4d8d42}.rtl{direction:rtl}</style></head><body><main id="app" class="shell"></main><script>const app=document.getElementById('app'),A='assets/';const state={lang:'en',market:'Iraq',city:'Baghdad',interests:['Men','Electronics','Restaurants'],favorites:new Set([2]),following:new Set([1]),tab:'home',auth:'signin',authType:'phone',notes:{near:true,flash:true,stores:true,special:true},merchantOffers:3};const offers=[{id:1,shop:'Samsung House',title:'Neo QLED TV Weekend Deal',emoji:'📺',price:'750,000 IQD',old:'1,000,000',off:'25%',city:'Baghdad',cat:'Electronics'},{id:2,shop:'Urban Men',title:'Premium Sneakers',emoji:'👟',price:'90,000 IQD',old:'150,000',off:'40%',city:'Baghdad',cat:'Men'},{id:3,shop:'Mira Café',title:'Coffee & Dessert Bundle',emoji:'☕',price:'12,000 IQD',old:'18,000',off:'33%',city:'Baghdad',cat:'Restaurants'},{id:4,shop:'Glow Beauty',title:'Weekend Beauty Box',emoji:'💄',price:'45,000 IQD',old:'70,000',off:'36%',city:'Erbil',cat:'Beauty'},{id:5,shop:'Home Line',title:'Kitchen Essentials',emoji:'🏠',price:'65,000 IQD',old:'95,000',off:'32%',city:'Baghdad',cat:'Home'},{id:6,shop:'Kids Planet',title:'Back to School Set',emoji:'🎒',price:'35,000 IQD',old:'55,000',off:'36%',city:'Basra',cat:'Kids'}];function set(x){app.innerHTML=x;scrollTo(0,0)}function welcome(){set(`<section class="welcome"><iframe src="welcome-exact.html" title="MIRA approved welcome"></iframe><button class="hot langhot en" onclick="state.lang='en'"></button><button class="hot langhot ar" onclick="state.lang='ar'"></button><button class="hot langhot es" onclick="state.lang='es'"></button><button class="hot langhot ru" onclick="state.lang='ru'"></button><button class="hot langhot tr" onclick="state.lang='tr'"></button><button class="hot acthot si" onclick="auth('signin')"></button><button class="hot acthot su" onclick="auth('signup')"></button><button class="hot acthot gu" onclick="market()"></button></section>`)}function brand(){return `<div class="brand"><img src="${A}mira_icon.svg"><b>MIRA</b></div>`}function top(t=''){return `<header class="top">${brand()}<b>${t}</b><div><button class="topbtn" onclick="notifications()">🔔</button></div></header>`}function nav(a){return `<nav class="nav">${[['home','⌂','Home'],['explore','⌖','Explore'],['search','⌕','Search'],['favorites','♡','Favorites'],['profile','◉','Profile']].map(x=>`<button class="${a===x[0]?'on':''}" onclick="${x[0]}()"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}function auth(m){state.auth=m;set(`<section class="page"><div class="content"><button class="back" onclick="welcome()">‹</button><h1 class="title">${m==='signin'?'Welcome back':'Create your account'}</h1><p class="sub">Sign in with phone number or email.</p><div class="card"><div class="tabs"><button class="${state.authType==='phone'?'on':''}" onclick="state.authType='phone';auth('${m}')">Phone</button><button class="${state.authType==='email'?'on':''}" onclick="state.authType='email';auth('${m}')">Email</button></div>${state.authType==='phone'?`<div class="field"><label>Country code</label><select class="input"><option>🇮🇶 Iraq +964</option><option>🇦🇪 UAE +971</option><option>🇸🇦 Saudi Arabia +966</option><option>🇹🇷 Türkiye +90</option><option>🇩🇪 Germany +49</option><option>🇨🇦 Canada +1</option><option>🇺🇸 USA +1</option><option>🇬🇧 UK +44</option></select></div><div class="field"><label>Phone number</label><input class="input" placeholder="7XX XXX XXXX"></div>`:`<div class="field"><label>Email</label><input class="input" type="email" placeholder="name@example.com"></div>`}<button class="primary" onclick="otp()">Continue</button></div></div></section>`)}function otp(){set(`<section class="page"><div class="content"><button class="back" onclick="auth(state.auth)">‹</button><h1 class="title">Verify your account</h1><p class="sub">Enter the 6-digit verification code.</p><div class="card"><div class="grid2"><input class="input" maxlength="3" placeholder="123"><input class="input" maxlength="3" placeholder="456"></div><button class="primary" style="margin-top:14px" onclick="market()">Verify</button><div class="notice">Didn't get the code? <b>Resend</b></div></div></div></section>`)}function market(){let c=['🇮🇶 Iraq','🇦🇪 UAE','🇸🇦 Saudi Arabia','🇹🇷 Türkiye','🇨🇦 Canada','🇺🇸 United States','🇩🇪 Germany','🇬🇧 United Kingdom'];set(`<section class="page"><div class="content"><button class="back" onclick="welcome()">‹</button><div class="progress"><i style="width:33%"></i></div><h1 class="title">Where do you want to shop?</h1><p class="sub">Choose your MIRA market. You can change it anytime.</p><div class="grid2">${c.map(x=>`<button class="choice" onclick="state.market='${x.replace(/^.. /,'')}';city()">${x}</button>`).join('')}</div></div></section>`)}function city(){let c=state.market==='Iraq'?['Entire Country','Baghdad','Basra','Erbil','Sulaymaniyah','Najaf','Karbala','Mosul']:['Entire Country','Capital City','North Region','South Region'];set(`<section class="page"><div class="content"><button class="back" onclick="market()">‹</button><div class="progress"><i style="width:66%"></i></div><h1 class="title">Where inside ${state.market}?</h1><p class="sub">Select the whole country or a city/state.</p><div class="chips">${c.map(x=>`<button class="chip ${state.city===x?'on':''}" onclick="state.city='${x}';interests()">${x}</button>`).join('')}</div></div></section>`)}function interests(){let x=['Men','Women','Kids','Newborn','Accessories','Jewelry','Home','Electronics','Restaurants','Beauty','Automotive','Entertainment'];set(`<section class="page"><div class="content"><button class="back" onclick="city()">‹</button><div class="progress"><i style="width:100%"></i></div><h1 class="title">What are you interested in?</h1><p class="sub">Choose as many as you like.</p><div class="chips">${x.map(i=>`<button class="chip ${state.interests.includes(i)?'on':''}" onclick="toggleInterest('${i}')">${i}</button>`).join('')}</div><button class="primary" style="margin-top:20px" onclick="home()">Start exploring</button><button class="secondary" style="margin-top:9px" onclick="home()">Skip for now</button></div></section>`)}function toggleInterest(x){state.interests=state.interests.includes(x)?state.interests.filter(i=>i!==x):[...state.interests,x];interests()}function offerCard(o){return `<button class="offer" onclick="detail(${o.id})"><div class="offerimg"><span class="badge">${o.off} OFF</span><button class="fav" onclick="event.stopPropagation();toggleFav(${o.id});home()">${state.favorites.has(o.id)?'♥':'♡'}</button>${o.emoji}</div><div class="offerbody"><div class="merchant">${o.shop}</div><div class="offertitle">${o.title}</div><span class="price">${o.price}</span><span class="old">${o.old}</span></div></button>`}function home(){state.tab='home';set(`<section class="page">${top()}<div class="content"><div class="search" onclick="search()">⌕ <span class="small">Search offers, stores, brands...</span></div><div style="height:13px"></div><div class="banner"><small>${state.city}, ${state.market}</small><h2>Deals made for you</h2><div>Fresh offers from stores you love.</div></div><div class="section"><h3>Flash Sales</h3><button class="link" onclick="allOffers('Flash Sales')">See All</button></div><div class="offers">${offers.slice(0,2).map(offerCard).join('')}</div><div class="section"><h3>Shop by Category</h3></div><div class="cats">${[['👕','Men'],['👗','Women'],['📱','Electronics'],['🍽️','Restaurants'],['💄','Beauty'],['🏠','Home'],['🧸','Kids'],['🚗','Automotive']].map(c=>`<button class="cat" onclick="category('${c[1]}')"><b>${c[0]}</b>${c[1]}</button>`).join('')}</div><div class="section"><h3>Recommended for You</h3><button class="link" onclick="allOffers('Recommended')">See All</button></div><div class="offers">${offers.slice(2).map(offerCard).join('')}</div></div>${nav('home')}</section>`)}function toggleFav(id){state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id)}function detail(id){let o=offers.find(x=>x.id===id);set(`<section class="page"><div class="detailhero"><button class="back" style="position:absolute;left:14px;top:18px" onclick="home()">‹</button>${o.emoji}</div><div class="detailbody"><div class="row"><div><div class="merchant">${o.cat} • ${o.city}</div><h1 style="margin:3px 0 8px">${o.title}</h1></div><button class="topbtn" onclick="toggleFav(${id});detail(${id})">${state.favorites.has(id)?'♥':'♡'}</button></div><div class="store"><div class="avatar">${o.shop[0]}</div><div class="grow"><b>${o.shop}</b><div class="small">✓ Verified Merchant</div></div><button class="link" onclick="storePage(1)">View Store</button></div><div class="kpis" style="margin-top:14px"><div class="kpi"><span class="small">Discount</span><strong>${o.off}</strong></div><div class="kpi"><span class="small">Distance</span><strong>2.4 km</strong></div></div><div class="notice">Ends in <b>02:14:36</b></div><h3>Offer details</h3><p>Limited-time promotion available at selected branches while stocks last.</p><div class="map"><span class="pin" style="left:48%;top:42%">📍</span></div><div class="actions2"><button class="secondary" onclick="alert('Opening directions')">Directions</button><button class="primary" onclick="alert('Opening WhatsApp')">WhatsApp</button></div><button class="secondary" style="margin-top:9px" onclick="reportOffer(${id})">Report offer</button></div></section>`)}function allOffers(t){set(`<section class="page">${top(t)}<div class="content"><button class="back" onclick="home()">‹</button><div style="height:12px"></div><div class="offers">${offers.map(offerCard).join('')}</div></div>${nav('home')}</section>`)}function category(c){let r=offers.filter(o=>o.cat===c);if(!r.length)r=offers;set(`<section class="page">${top(c)}<div class="content"><div class="row"><button class="back" onclick="home()">‹</button><button class="secondary" style="width:auto;padding:0 16px" onclick="filters()">Filters</button></div><div class="section"><h3>${c} Offers</h3><span class="small">${r.length} results</span></div><div class="offers">${r.map(offerCard).join('')}</div></div>${nav('home')}</section>`)}function explore(){state.tab='explore';set(`<section class="page">${top('Explore')}<div class="content"><div class="search">⌕ <input placeholder="Search this area"></div><div style="height:13px"></div><div class="map"><span class="pin" style="left:22%;top:28%">📍</span><span class="pin" style="left:60%;top:47%">📍</span><span class="pin" style="left:42%;top:66%">📍</span></div><div class="section"><h3>Offers Near Me</h3><button class="link" onclick="filters()">Filters</button></div><div class="list">${offers.slice(0,4).map(o=>`<div class="item" onclick="detail(${o.id})"><div class="itemicon">${o.emoji}</div><div class="grow"><b>${o.title}</b><div class="small">${o.shop} • ${o.city}</div></div><b style="color:var(--p)">${o.off}</b></div>`).join('')}</div></div>${nav('explore')}</section>`)}function filters(){set(`<section class="page"><div class="content"><button class="back" onclick="explore()">‹</button><h1 class="title">Filters</h1><div class="card"><div class="field"><label>Distance</label><select class="input"><option>Nearby</option><option>1 km</option><option>5 km</option><option>10 km</option><option>25 km</option><option>50 km</option></select></div><div class="field"><label>Minimum discount</label><select class="input"><option>Any</option><option>20%+</option><option>30%+</option><option>50%+</option></select></div><div class="field"><label>Sort</label><select class="input"><option>Recommended</option><option>Nearest</option><option>Biggest Discount</option><option>Newest</option><option>Ending Soon</option></select></div><button class="primary" onclick="explore()">Apply Filters</button></div></div></section>`)}function search(){state.tab='search';set(`<section class="page">${top('Search')}<div class="content"><div class="search">⌕ <input id="q" placeholder="Search products, stores, brands..." oninput="runSearch(this.value)"></div><div class="section"><h3>Trending</h3></div><div class="chips">${['Samsung','Shoes','Pizza','Perfume','TV','Coffee'].map(x=>`<button class="chip" onclick="q.value='${x}';runSearch('${x}')">${x}</button>`).join('')}</div><div id="results"><div class="section"><h3>Popular Offers</h3></div><div class="offers">${offers.slice(0,4).map(offerCard).join('')}</div></div></div>${nav('search')}</section>`)}function runSearch(q){let r=offers.filter(o=>(o.title+' '+o.shop+' '+o.cat).toLowerCase().includes(q.toLowerCase()));results.innerHTML=`<div class="section"><h3>Results</h3><span class="small">${r.length}</span></div><div class="offers">${r.map(offerCard).join('')||'<p>No results found.</p>'}</div>`}function favorites(){state.tab='favorites';let f=offers.filter(o=>state.favorites.has(o.id));set(`<section class="page">${top('Favorites')}<div class="content"><div class="tabs"><button class="on">Saved Offers</button><button onclick="followedStores()">Saved Stores</button></div>${f.length?`<div class="offers">${f.map(offerCard).join('')}</div>`:`<div class="card"><h3>No saved offers yet.</h3><p class="sub">Start exploring and save the deals you love.</p><button class="primary" onclick="home()">Explore Offers</button></div>`}</div>${nav('favorites')}</section>`)}function followedStores(){set(`<section class="page">${top('Followed Stores')}<div class="content"><button class="back" onclick="favorites()">‹</button><div class="list" style="margin-top:12px"><div class="item" onclick="storePage(1)"><div class="avatar">S</div><div class="grow"><b>Samsung House</b><div class="small">3 active offers</div></div>›</div></div></div>${nav('favorites')}</section>`)}function storePage(id){let following=state.following.has(id);set(`<section class="page">${top('Store')}<div class="content"><button class="back" onclick="home()">‹</button><div class="profile"><div class="avatar" style="width:80px;height:80px;margin:auto;font-size:28px">S</div><h2>Samsung House ✓</h2><div class="small">Electronics • Ba
