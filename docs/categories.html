<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FC618F">
<title>MIRA — Categories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#FC618F;
  --pink2:#800020;
  --coral:#FC618F;
  --peach:#800020;
  --burgundy:#FFFFFF;
  --ink:#FFFFFF;
  --muted:#FC618F;
  --line:#800020;
  --bg:#800020;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
body{display:flex;justify-content:center}
.app{width:min(100vw,430px);min-height:100svh;background:radial-gradient(circle at 8% 0%,#FC618F,transparent 25%),radial-gradient(circle at 100% 5%,#FC618F,transparent 28%),linear-gradient(180deg,#800020 0%,#800020 46%,#800020 100%);padding:calc(16px + env(safe-area-inset-top)) 16px calc(94px + env(safe-area-inset-bottom))}
.title{margin-top:8px;font-size:25px;font-weight:800;letter-spacing:-.5px;color:var(--burgundy)}
.sub{font-size:11px;color:var(--muted);line-height:1.55;margin-top:4px}
.search{margin-top:17px;display:flex;align-items:center;gap:9px;background:#800020;border:1px solid var(--line);border-radius:17px;padding:12px 13px;box-shadow:0 7px 20px #800020}
.search svg{width:20px;color:var(--pink)}
.search input{border:0;outline:0;background:transparent;width:100%;font:500 12px Poppins;color:var(--burgundy)}
.search input::placeholder{color:#FC618F}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.cat{-webkit-appearance:none;appearance:none;border:1px solid var(--line);background:#800020;border-radius:22px;padding:15px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;text-align:start;box-shadow:0 10px 26px #800020;cursor:pointer;color:var(--burgundy);font-family:Poppins}
.cat:active{transform:scale(.985)}
.ico{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#800020 0%,#800020 100%);display:grid;place-items:center}
.ico svg{width:24px;height:24px;color:var(--pink)}
.cat b{font-size:12px;line-height:1.25;color:var(--burgundy);font-weight:700}
.cat small{font-size:9px;color:var(--muted)}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100vw,430px);padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:#FFFFFF;backdrop-filter:blur(18px);border-top:1px solid #800020;display:grid;grid-template-columns:repeat(4,1fr)}
.nav{color:#FC618F;text-decoration:none;font:600 9.5px Poppins;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav svg{width:22px;height:22px}
.nav.active{color:var(--pink)}

/* MIRA categories: vivid, layered and readable */
html,body{background:#fff4f7!important;color:#800020!important}
.app{
  background:
    radial-gradient(ellipse at 100% 0%,#f9d8e3 0,transparent 34%),
    radial-gradient(ellipse at 0% 35%,#f5dce5 0,transparent 30%),
    linear-gradient(180deg,#fff9fb 0%,#fff0f5 52%,#fff8fa 100%)!important;
  color:#800020!important;
}
.title{color:#800020!important;font-size:27px;letter-spacing:-.7px}
.sub{color:#800020!important;opacity:.75}
.search{background:#fff!important;border:1px solid #ead2dc!important;box-shadow:0 9px 22px #80002012!important}
.search svg{color:#800020!important}.search input{color:#800020!important}
.search input::placeholder{color:#800020!important;opacity:.62}
.grid{gap:13px}
.cat{
  position:relative;overflow:hidden;
  border:1px solid #ead2dc!important;border-radius:23px!important;
  background:linear-gradient(150deg,#fff 0%,#fff7fa 100%)!important;
  color:#800020!important;
  box-shadow:0 10px 24px #80002016,inset 0 1px 0 #fff!important;
  min-height:132px;transition:transform .2s ease,box-shadow .2s ease;
}
.cat:before{content:"";position:absolute;inset-inline-end:-19px;top:-25px;width:78px;height:78px;border-radius:50%;background:#FC618F14}
.cat:nth-child(4n+2),.cat:nth-child(4n+3){
  background:#800020!important;border-color:#800020!important;color:#fff!important;
  box-shadow:0 12px 25px #80002030,inset 0 1px 0 #ffffff24!important;
}
.cat:nth-child(4n+2) b,.cat:nth-child(4n+3) b,
.cat:nth-child(4n+2) small,.cat:nth-child(4n+3) small{color:#fff!important}
.ico{width:46px;height:46px;border-radius:16px;background:#fff!important;border:1px solid #f2d5df;box-shadow:0 4px 12px #80002012}
.ico svg{color:#800020!important}
.cat:active{transform:translateY(2px) scale(.98);box-shadow:0 5px 13px #8000201c!important}
.bottom{
  background:rgba(255,255,255,.95)!important;border:1px solid #ead8df!important;
  border-bottom:0!important;border-radius:24px 24px 0 0;
  box-shadow:0 -8px 26px #80002012!important;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)
}
.nav{color:#800020!important}.nav.active{color:#FC618F!important}
@media(prefers-reduced-motion:no-preference){.cat:hover{transform:translateY(-3px);box-shadow:0 15px 27px #80002020!important}}
@media(max-width:360px){.cat{min-height:120px;padding:13px}.title{font-size:24px}}


/* Category photography: retain each original glyph size and layout */
.cat{
  isolation:isolate;position:relative;overflow:hidden;
  background:#800020!important;color:#fff!important;border-color:#ffffff80!important;
  box-shadow:0 12px 25px #80002030,inset 0 1px 0 #ffffff24!important
}
.cat-photo{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  border-radius:inherit;z-index:0;pointer-events:none
}
.cat:before{display:none!important}
.cat:after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,#24030c20 0%,#35071466 56%,#21030de0 100%)
}
.cat .ico,.cat b,.cat small{position:relative;z-index:2}
.cat b,.cat small{color:#fff!important;text-shadow:0 1px 4px #1d030b80}
.cat .ico{
  width:46px;height:46px;flex:0 0 46px;
  background:#fff!important;border:1px solid #fff!important;
  box-shadow:0 5px 14px #1c030c30
}
.cat .ico svg{color:#800020!important}

</style>
<link rel="stylesheet" href="mira-pink-theme.css?v=20261008-luxe-contrast-2"><style id="mira-category-photo-contrast">#grid .cat b,#grid .cat small{color:#fff!important;text-shadow:0 1px 5px #21030ddd!important}#grid .cat:after{background:linear-gradient(180deg,#24030c26 0%,#35071480 54%,#21030df0 100%)!important}</style>
</head>
<body>
<main class="app">
  <div class="title" id="title"></div>
  <div class="sub" id="sub"></div>
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search">
  </label>
  <div class="grid" id="grid"></div>
</main>
<nav class="bottom">
  <a class="nav" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg><span id="nHome"></span></a>
  <a class="nav active" href="categories.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span id="nCat"></span></a>
  <a class="nav" href="saved.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 21s-8-4.7-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6.3-8 11-8 11z"/></svg><span id="nSaved"></span></a>
  <a class="nav" href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.4 3.7-7 8-7s7 2.6 8 7"/></svg><span id="nProfile"></span></a>
</nav>
<script src="taxonomy.js?v=20261007-taxonomy"></script><script src="mira-category-glyphs.js?v=20261019-toy-blocks-1"></script><script src="mira-cloud.js?v=20261009-cross-tab-remember-1"></script><script>
const T={
 en:{title:'Categories',sub:'Browse all MIRA categories',search:'Search categories',home:'Home',cat:'Categories',saved:'Saved',profile:'Profile'},
 ar:{title:'التصنيفات',sub:'تصفح جميع تصنيفات MIRA',search:'ابحث في التصنيفات',home:'الرئيسية',cat:'التصنيفات',saved:'المحفوظات',profile:'حسابي'},
 es:{title:'Categorías',sub:'Explora todas las categorías de MIRA',search:'Buscar categorías',home:'Inicio',cat:'Categorías',saved:'Guardado',profile:'Perfil'},
 ru:{title:'Категории',sub:'Все категории MIRA',search:'Поиск категорий',home:'Главная',cat:'Категории',saved:'Сохранено',profile:'Профиль'},
 tr:{title:'Kategoriler',sub:'Tüm MIRA kategorilerine göz at',search:'Kategori ara',home:'Ana Sayfa',cat:'Kategoriler',saved:'Kaydedilenler',profile:'Profil'}
};
const paths=[
'<path d="M8 4l-4 3 2 4 2-1v10h8V10l2 1 2-4-4-3-2 2h-4L8 4z"/>',
'<path d="M3 16c4.5.4 7-1.5 8-5l2 1c1.5 2.8 3.6 4.4 7 4.5V20H4a1 1 0 0 1-1-1v-3z"/>',
'<circle cx="7" cy="12" r="3.5"/><circle cx="17" cy="12" r="3.5"/><path d="M10.5 12h3"/>',
'<path d="M8 3h8v4H8zM7 7h10v14H7z"/>',
'<path d="M9 3h6v4H9zM8 7h8l2 3v10H6V10l2-3z"/>',
'<rect x="7" y="2.5" width="10" height="19" rx="2"/>',
'<path d="M6 3v8M3.5 3v5c0 2 1 3 2.5 3s2.5-1 2.5-3V3M6 11v10M15 3v18"/>',
'<path d="M3 5h2l2 10h10l2-7H6"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>',
'<path d="M4 10h16v10H4zM7 10V6h10v4"/>',
'<path d="M4 7h16v13H4zM8 7V4h8v3"/>',
'<path d="M5 16l1-5 2-3h8l2 3 1 5"/><rect x="3" y="13" width="18" height="6" rx="2"/>',
'<circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/>',
'<circle cx="8" cy="8" r="3"/><circle cx="16" cy="9" r="2.5"/><path d="M3 20c.8-4 2.7-6 5-6s4.2 2 5 6M12 20c.5-3 2-4.5 4-4.5s3.5 1.5 4 4.5"/>',
'<path d="M12 21s-7-4.2-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 11c0 5.8-7 10-7 10z"/>',
'<path d="M8 4h8l2 4-2 12H8L6 8l2-4z"/><path d="M9 9h6"/>',
'<circle cx="9" cy="12" r="3"/><circle cx="15" cy="12" r="3"/><path d="M6 17h12"/>',
'<path d="M7 3h10v18H7zM10 7h4M10 11h4M10 15h4"/>'
];
function render(){
 const l=localStorage.getItem('mira_lang')||'en',t=T[l]||T.en;
 document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
 title.textContent=t.title;sub.textContent=t.sub;q.placeholder=t.search;nHome.textContent=t.home;nCat.textContent=t.cat;nSaved.textContent=t.saved;nProfile.textContent=t.profile;
 const items=(window.MIRA_TAXONOMY||[]).filter(x=>x.active!==false);
 const photoFor={
  clothing:'clothing',shoes:'shoes',perfumes:'perfumes',accessories:'accessories',
  bags:'bags',watches:'watches',beauty:'beauty',electronics:'electronics',
  'home-appliances':'home-appliances',home:'home',sports:'sports','toys-kids':'toys-kids',
  jewelry:'jewelry',eyewear:'eyewear',automotive:'automotive',
  'stationery-office':'stationery-office',gifts:'gifts',restaurants:'restaurants-cafes'
 };
 const txName=x=>l==='ar'?(x.ar||x.en):(x.en||x.ar);
 const draw=(filter='')=>{grid.innerHTML='';items.forEach((item,i)=>{const name=txName(item);if(filter&&!name.toLowerCase().includes(filter.toLowerCase()))return;const b=document.createElement('button');b.className='cat';b.onclick=()=>location.href='category.html?slug='+encodeURIComponent(item.slug);b.innerHTML=`<div class="ico">${window.MIRACategoryIcon(item.slug)}</div><b>${name}</b><small>${(item.subs||[]).filter(x=>x.active!==false).length} ${l==='ar'?'أقسام فرعية':'subcategories'}</small>`;const photo=document.createElement('img');photo.className='cat-photo';photo.src='assets/categories/'+(photoFor[item.slug]||'clothing')+'.webp';photo.alt='';photo.loading='lazy';photo.decoding='async';b.appendChild(photo);grid.appendChild(b)})};
 draw();q.oninput=()=>draw(q.value)
}
render();window.addEventListener('mira-taxonomy-synced',render);
</script>
</body>
</html>
