<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8fb"><title>MIRA — Choose City</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--pink:#FF4D8D;--pink2:#FF7EB6;--peach:#FFC8A1;--blue:#6EC6FF;--ink:#A62C63;--muted:#B86A8E;--line:#F0DCE6;--mira:#D94F8A}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff8fb;color:var(--ink)}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100svh;background:radial-gradient(circle at 12% 4%,rgba(255,126,182,.17),transparent 28%),radial-gradient(circle at 95% 1%,rgba(110,198,255,.15),transparent 30%),linear-gradient(180deg,#fffafd 0%,#fff 48%,#fff9fc 100%);padding:calc(18px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between}.back{width:42px;height:42px;border:0;border-radius:50%;background:#fff;box-shadow:0 7px 22px rgba(43,35,56,.08);font-size:27px;line-height:1;color:var(--pink);cursor:pointer}.wordmark{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1;color:var(--mira)}.wordmark .dot{color:var(--pink)}.spacer{width:42px}.lang{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}.lang button{border:0;background:transparent;color:var(--ink);font-weight:600;padding:4px 7px;font-family:inherit}.hero{text-align:center;margin-top:52px}h1{font-size:28px;margin:0 0 8px;font-weight:800;color:var(--ink)}.sub{margin:0 auto;color:var(--muted);font-size:14px;line-height:1.55;max-width:330px}.card{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:0 18px 45px rgba(75,42,71,.08)}.label{display:block;font-size:13px;font-weight:700;margin:0 0 9px 2px;color:var(--ink)}.select-wrap{position:relative;border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}.select-wrap:focus-within{border-color:#ff8ab8;box-shadow:0 0 0 3px rgba(255,77,141,.10)}select{width:100%;appearance:none;-webkit-appearance:none;border:0;outline:none;background:transparent;padding:16px 48px 16px 16px;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink)}.chevron{position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:16px;color:var(--pink)}.hint{margin:12px 3px 0;font-size:11.5px;line-height:1.5;color:var(--muted)}.primary{width:100%;margin-top:22px;border:0;border-radius:17px;padding:15px 16px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(90deg,var(--pink),var(--pink2) 35%,var(--peach) 60%,var(--blue));box-shadow:0 12px 26px rgba(255,77,141,.22);font-family:inherit}.primary:disabled{opacity:.45;box-shadow:none}[dir=rtl] .label{text-align:right}[dir=rtl] select{padding:16px 16px 16px 48px}[dir=rtl] .chevron{right:auto;left:16px}
</style></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()">‹</button><div class="wordmark" aria-label="MIRA">MIR<span>A</span><span class="dot">•</span></div><div class="spacer"></div></div><section class="hero"><h1 id="title"></h1><p class="sub" id="subtitle"></p></section><section class="card"><label class="label" id="cityLabel" for="city"></label><div class="select-wrap"><select id="city" onchange="onCityChange()"></select><span class="chevron">⌄</span></div><p class="hint" id="hint"></p><button class="primary" id="continueBtn" disabled onclick="continueCity()"></button></section><div class="lang"><button onclick="setLang('en')">English</button> · <button onclick="setLang('ar')">العربية</button> · <button onclick="setLang('es')">Español</button> · <button onclick="setLang('ru')">Русский</button> · <button onclick="setLang('tr')">Türkçe</button></div></main><script>
const CITIES=[{"value":"baghdad","en":"Baghdad","ar":"بغداد","es":"Bagdad","ru":"Багдад","tr":"Bağdat"},{"value":"erbil","en":"Erbil","ar":"أربيل","es":"Erbil","ru":"Эрбиль","tr":"Erbil"},{"value":"basra","en":"Basra","ar":"البصرة","es":"Basora","ru":"Басра","tr":"Basra"},{"value":"sulaymaniyah","en":"Sulaymaniyah","ar":"السليمانية","es":"Sulaymaniyah","ru":"Сулеймания","tr":"Süleymaniye"},{"value":"duhok","en":"Duhok","ar":"دهوك","es":"Duhok","ru":"Дохук","tr":"Duhok"},{"value":"anbar","en":"Al Anbar","ar":"الأنبار","es":"Al Anbar","ru":"Анбар","tr":"Enbar"},{"value":"nineveh","en":"Nineveh / Mosul","ar":"نينوى / الموصل","es":"Nínive / Mosul","ru":"Найнава / Мосул","tr":"Ninova / Musul"},{"value":"saladin","en":"Saladin","ar":"صلاح الدين","es":"Saladino","ru":"Салах-эд-Дин","tr":"Selahaddin"},{"value":"najaf","en":"Najaf","ar":"النجف","es":"Náyaf","ru":"Наджаф","tr":"Necef"},{"value":"karbala","en":"Karbala","ar":"كربلاء","es":"Karbala","ru":"Кербела","tr":"Kerbela"},{"value":"diyala","en":"Diyala","ar":"ديالى","es":"Diyala","ru":"Дияла","tr":"Diyala"},{"value":"kirkuk","en":"Kirkuk","ar":"كركوك","es":"Kirkuk","ru":"Киркук","tr":"Kerkük"},{"value":"babil","en":"Babil","ar":"بابل","es":"Babil","ru":"Бабиль","tr":"Babil"},{"value":"wasit","en":"Wasit","ar":"واسط","es":"Wasit","ru":"Васит","tr":"Vasit"},{"value":"maysan","en":"Maysan","ar":"ميسان","es":"Maysan","ru":"Майсан","tr":"Meysan"},{"value":"dhiqar","en":"Dhi Qar","ar":"ذي قار","es":"Dhi Qar","ru":"Ди-Кар","tr":"Zi Kar"},{"value":"muthanna","en":"Al Muthanna","ar":"المثنى","es":"Al Muthanna","ru":"Мутанна","tr":"Müsenna"},{"value":"qadisiyah","en":"Al-Qadisiyah","ar":"القادسية","es":"Al-Qadisiyah","ru":"Кадисия","tr":"Kadisiye"},{"value":"halabja","en":"Halabja","ar":"حلبجة","es":"Halabja","ru":"Халабджа","tr":"Halepçe"}];
const market=new URLSearchParams(location.search).get('market')||localStorage.getItem('mira_market')||'IQ';
const T={en:{titleIQ:'Choose your governorate',subIQ:'Choose a governorate or all cities in Iraq.',titleOther:'Choose city coverage',subOther:'For this country, offers are currently shown for all cities.',labelIQ:'Governorate / city coverage',labelOther:'City coverage',placeholder:'Select option',all:'All Cities',cont:'Continue',hintIQ:'Choose All Cities to see offers across Iraq, or select a specific governorate.',hintOther:'All Cities is the only option for this country for now.'},ar:{titleIQ:'اختار محافظتك',subIQ:'اختار محافظة محددة أو جميع المدن داخل العراق.',titleOther:'اختار نطاق المدن',subOther:'حالياً العروض بهذا البلد تظهر لجميع المدن.',labelIQ:'المحافظة / نطاق المدن',labelOther:'نطاق المدن',placeholder:'اختار الخيار',all:'جميع المدن',cont:'متابعة',hintIQ:'اختار جميع المدن حتى تشوف العروض بكل العراق، أو اختار محافظة محددة.',hintOther:'حالياً خيار جميع المدن هو الخيار الوحيد بهذا البلد.'},es:{titleIQ:'Elige tu gobernación',subIQ:'Elige una gobernación o todas las ciudades de Irak.',titleOther:'Elige cobertura de ciudades',subOther:'Por ahora, las ofertas de este país se muestran para todas las ciudades.',labelIQ:'Gobernación / cobertura',labelOther:'Cobertura de ciudades',placeholder:'Selecciona una opción',all:'Todas las ciudades',cont:'Continuar',hintIQ:'Elige Todas las ciudades para ver ofertas en todo Irak o selecciona una gobernación.',hintOther:'Todas las ciudades es la única opción disponible por ahora.'},ru:{titleIQ:'Выберите провинцию',subIQ:'Выберите провинцию или все города Ирака.',titleOther:'Выберите охват городов',subOther:'Сейчас предложения в этой стране показываются для всех городов.',labelIQ:'Провинция / охват городов',labelOther:'Охват городов',placeholder:'Выберите вариант',all:'Все города',cont:'Продолжить',hintIQ:'Выберите «Все города», чтобы видеть предложения по всему Ираку, или выберите провинцию.',hintOther:'Пока «Все города» — единственный доступный вариант.'},tr:{titleIQ:'Valiliğinizi seçin',subIQ:'Irak’ta bir valilik veya tüm şehirleri seçin.',titleOther:'Şehir kapsamını seçin',subOther:'Bu ülkede fırsatlar şimdilik tüm şehirler için gösteriliyor.',labelIQ:'Valilik / şehir kapsamı',labelOther:'Şehir kapsamı',placeholder:'Seçenek seçin',all:'Tüm Şehirler',cont:'Devam et',hintIQ:'Irak genelindeki fırsatlar için Tüm Şehirler’i veya belirli bir valiliği seçin.',hintOther:'Şimdilik bu ülkede yalnızca Tüm Şehirler seçeneği kullanılabilir.'}};
function getLang(){return localStorage.getItem('mira_lang')||'en'}
function renderCities(lang){const t=T[lang]||T.en;city.innerHTML='';if(market==='IQ'){let p=document.createElement('option');p.value='';p.textContent=t.placeholder;city.appendChild(p);let all=document.createElement('option');all.value='all';all.textContent=t.all;city.appendChild(all);CITIES.forEach(c=>{let o=document.createElement('option');o.value=c.value;o.textContent=c[lang];city.appendChild(o)});continueBtn.disabled=true}else{let all=document.createElement('option');all.value='all';all.textContent=t.all;city.appendChild(all);city.value='all';continueBtn.disabled=false}}
function onCityChange(){continueBtn.disabled=!city.value}
function continueCity(){if(!city.value)return;localStorage.setItem('mira_city',city.value);location.href='interests.html?market='+encodeURIComponent(market)+'&city='+encodeURIComponent(city.value)}
function setLang(lang){localStorage.setItem('mira_lang',lang);applyLang(lang)}
function applyLang(lang){let t=T[lang]||T.en;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';const iraq=market==='IQ';title.textContent=iraq?t.titleIQ:t.titleOther;subtitle.textContent=iraq?t.subIQ:t.subOther;cityLabel.textContent=iraq?t.labelIQ:t.labelOther;continueBtn.textContent=t.cont;hint.textContent=iraq?t.hintIQ:t.hintOther;renderCities(lang)}
applyLang(getLang());
</script></body></html>
