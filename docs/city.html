<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8fb">
<title>MIRA — Choose City</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#FF4D8D;
  --pink2:#FF7EB6;
  --peach:#FFC8A1;
  --blue:#6EC6FF;
  --ink:#20222a;
  --muted:#7b8491;
  --line:#ece8ee;
  --mira:#D96A99;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;min-height:100%;
  font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#fff8fb;color:var(--ink)
}
body{display:flex;justify-content:center}
.app{
  width:min(100vw,430px);min-height:100svh;
  background:
    radial-gradient(circle at 12% 4%,rgba(255,126,182,.17),transparent 28%),
    radial-gradient(circle at 95% 1%,rgba(110,198,255,.15),transparent 30%),
    linear-gradient(180deg,#fffafd 0%,#fff 48%,#fff9fc 100%);
  padding:calc(18px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))
}
.top{display:flex;align-items:center;justify-content:space-between}
.back{
  width:42px;height:42px;border:0;border-radius:50%;background:#fff;
  box-shadow:0 7px 22px rgba(43,35,56,.08);
  font-size:27px;line-height:1;color:var(--pink);cursor:pointer
}
.brandmark{
  width:124px;height:39px;background:var(--mira);
  -webkit-mask:url("assets/mira_wordmark.svg") center/contain no-repeat;
  mask:url("assets/mira_wordmark.svg") center/contain no-repeat
}
.spacer{width:42px}

.hero{text-align:center;margin-top:52px}
h1{font-size:28px;line-height:1.2;margin:0 0 8px;font-weight:800;letter-spacing:-.5px}
.sub{margin:0 auto;color:var(--muted);font-size:14px;line-height:1.55;max-width:330px}

.card{
  margin-top:28px;background:rgba(255,255,255,.95);
  border:1px solid rgba(236,232,238,.95);
  border-radius:28px;padding:18px;
  box-shadow:0 18px 45px rgba(75,42,71,.08)
}
.label{display:block;font-size:13px;font-weight:700;margin:0 0 9px 2px;color:#625b65}

.select-wrap{
  position:relative;
  border:1px solid var(--line);
  border-radius:18px;
  background:#fff;
  overflow:hidden;
}
.select-wrap:focus-within{
  border-color:#ff8ab8;
  box-shadow:0 0 0 3px rgba(255,77,141,.10)
}
select{
  width:100%;
  appearance:none;
  -webkit-appearance:none;
  border:0;
  outline:none;
  background:transparent;
  padding:16px 48px 16px 16px;
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  color:#29262d;
}
.chevron{
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  pointer-events:none;
  font-size:16px;
  color:var(--pink);
}
.hint{
  margin:12px 3px 0;
  font-size:11.5px;
  line-height:1.5;
  color:#9a939d
}
.primary{
  width:100%;margin-top:22px;border:0;border-radius:17px;
  padding:15px 16px;font-weight:700;font-size:16px;color:#fff;
  background:linear-gradient(90deg,var(--pink) 0%,var(--pink2) 35%,var(--peach) 60%,var(--blue) 100%);
  box-shadow:0 12px 26px rgba(255,77,141,.22);
  font-family:inherit;cursor:pointer
}
.primary:disabled{opacity:.45;box-shadow:none;cursor:default}

.lang{
  margin-top:20px;text-align:center;
  font-size:12px;color:#9a939d
}
.lang button{
  border:0;background:transparent;color:#6c6670;
  font-weight:600;padding:4px 7px;font-family:inherit
}

[dir=rtl] .label{text-align:right}
[dir=rtl] select{padding:16px 16px 16px 48px}
[dir=rtl] .chevron{right:auto;left:16px}

@media(max-height:760px){
  .hero{margin-top:34px}
  h1{font-size:25px}
  .card{margin-top:22px}
}
</style>
</head>

<body>
<main class="app">

  <div class="top">
    <button class="back" onclick="history.back()" aria-label="Back">‹</button>
    <div class="brandmark" aria-label="MIRA"></div>
    <div class="spacer"></div>
  </div>

  <section class="hero">
    <h1 id="title">Choose your governorate</h1>
    <p class="sub" id="subtitle">
      Select where you want to see nearby offers and stores in Iraq.
    </p>
  </section>

  <section class="card">

    <label class="label" id="cityLabel" for="city">Governorate</label>

    <div class="select-wrap">
      <select id="city" onchange="onCityChange()">
        <option value="">Select governorate</option>

        <option value="baghdad">Baghdad — بغداد</option>
        <option value="erbil">Erbil — أربيل</option>
        <option value="basra">Basra — البصرة</option>
        <option value="sulaymaniyah">Sulaymaniyah — السليمانية</option>
        <option value="duhok">Duhok — دهوك</option>
        <option value="anbar">Al Anbar — الأنبار</option>
        <option value="nineveh">Nineveh / Mosul — نينوى / الموصل</option>
        <option value="saladin">Saladin — صلاح الدين</option>

        <option value="najaf">Najaf — النجف</option>
        <option value="karbala">Karbala — كربلاء</option>
        <option value="diyala">Diyala — ديالى</option>
        <option value="kirkuk">Kirkuk — كركوك</option>
        <option value="babil">Babil — بابل</option>
        <option value="wasit">Wasit — واسط</option>
        <option value="maysan">Maysan — ميسان</option>
        <option value="dhiqar">Dhi Qar — ذي قار</option>
        <option value="muthanna">Al Muthanna — المثنى</option>
        <option value="qadisiyah">Al-Qadisiyah — القادسية</option>
        <option value="halabja">Halabja — حلبجة</option>
      </select>
      <span class="chevron">⌄</span>
    </div>

    <p class="hint" id="hint">
      Baghdad appears first by default, followed by Erbil, Basra, Sulaymaniyah, Duhok, Al Anbar, Mosul and Saladin.
    </p>

    <button class="primary" id="continueBtn" disabled onclick="continueCity()">Continue</button>

  </section>

  <div class="lang">
    <button onclick="setLang('en')">English</button> ·
    <button onclick="setLang('ar')">العربية</button> ·
    <button>Español</button> ·
    <button>Русский</button> ·
    <button>Türkçe</button>
  </div>

</main>

<script>
const qs=new URLSearchParams(location.search);
const market=qs.get('market') || localStorage.getItem('mira_market') || 'IQ';

function onCityChange(){
  const city=document.getElementById('city').value;
  document.getElementById('continueBtn').disabled=!city;
}

function continueCity(){
  const city=document.getElementById('city').value;
  if(!city)return;
  localStorage.setItem('mira_city',city);
  location.href='interests.html?market='+encodeURIComponent(market)+'&city='+encodeURIComponent(city);
}

function setLang(lang){
  const ar=lang==='ar';
  document.documentElement.dir=ar?'rtl':'ltr';
  document.documentElement.lang=lang;

  document.getElementById('title').textContent=
    ar?'اختار محافظتك':'Choose your governorate';

  document.getElementById('subtitle').textContent=
    ar?'اختار المحافظة حتى نعرض إلك العروض والمتاجر الأقرب داخل العراق.':
       'Select where you want to see nearby offers and stores in Iraq.';

  document.getElementById('cityLabel').textContent=
    ar?'المحافظة':'Governorate';

  document.getElementById('continueBtn').textContent=
    ar?'متابعة':'Continue';

  document.getElementById('hint').textContent=
    ar?'بغداد أول اختيار، بعدها أربيل، البصرة، السليمانية، دهوك، الأنبار، الموصل، ثم صلاح الدين وباقي المحافظات.':
       'Baghdad appears first by default, followed by Erbil, Basra, Sulaymaniyah, Duhok, Al Anbar, Mosul and Saladin.';

  const city=document.getElementById('city');
  city.options[0].text=ar?'اختار المحافظة':'Select governorate';
}
</script>

</body>
</html>
