<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8fb"><title>MIRA — OTP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--pink:#FF4D8D;--pink2:#FF7EB6;--peach:#FFC8A1;--blue:#6EC6FF;--ink:#A62C63;--muted:#B86A8E;--line:#F0DCE6;--mira:#D94F8A}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"Poppins",sans-serif;background:#fff8fb;color:var(--ink)}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100svh;background:radial-gradient(circle at 12% 4%,rgba(255,126,182,.17),transparent 28%),radial-gradient(circle at 95% 1%,rgba(110,198,255,.15),transparent 30%),linear-gradient(180deg,#fffafd 0%,#fff 48%,#fff9fc 100%);padding:calc(18px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between}.back{width:42px;height:42px;border:0;border-radius:50%;background:#fff;box-shadow:0 7px 22px rgba(43,35,56,.08);font-size:27px;line-height:1;color:var(--pink)}.brandmark{width:132px;height:42px;background:var(--mira);-webkit-mask:url('assets/mira_wordmark.svg') center/contain no-repeat;mask:url('assets/mira_wordmark.svg') center/contain no-repeat;direction:ltr;flex:0 0 auto}.spacer{width:42px}.hero{text-align:center;margin-top:54px}h1{font-size:30px;margin:0 0 10px;font-weight:800;color:var(--ink)}.sub{margin:0 auto;color:var(--muted);font-size:14px;line-height:1.55;max-width:330px}.card{margin-top:30px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px 18px;box-shadow:0 18px 45px rgba(75,42,71,.08)}.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;direction:ltr}.otp input{width:100%;aspect-ratio:1/1.08;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:center;font:700 24px Poppins;color:var(--ink);outline:none}.otp input:focus{border-color:#ff8ab8;box-shadow:0 0 0 3px rgba(255,77,141,.10)}.primary{width:100%;margin-top:22px;border:0;border-radius:17px;padding:15px 16px;font:700 16px Poppins;color:#fff;background:linear-gradient(90deg,var(--pink),var(--pink2) 35%,var(--peach) 60%,var(--blue));box-shadow:0 12px 26px rgba(255,77,141,.22)}.resend{margin-top:16px;text-align:center;font-size:13px;color:var(--muted)}.resend button{border:0;background:transparent;color:var(--pink);font:700 13px Poppins}.notice{margin-top:12px;text-align:center;font-size:12px;color:var(--muted);min-height:18px}.lang{margin-top:18px;text-align:center;font-size:12px}.lang button{border:0;background:transparent;color:var(--ink);font:600 12px Poppins;padding:4px 7px}</style></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()">‹</button><div class="brandmark" aria-label="MIRA"></div><div class="spacer"></div></div><section class="hero"><h1 id="title"></h1><p class="sub" id="subtitle"></p></section><section class="card"><div class="otp"><input maxlength="1" inputmode="numeric" autocomplete="one-time-code"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"></div><button class="primary" id="verifyBtn" onclick="verifyCode()"></button><div class="resend"><span id="noCode"></span> <button id="resendBtn" onclick="resendCode()"></button></div><div class="notice" id="notice"></div></section><div class="lang"><button onclick="setLang('en')">English</button> · <button onclick="setLang('ar')">العربية</button> · <button onclick="setLang('es')">Español</button> · <button onclick="setLang('ru')">Русский</button> · <button onclick="setLang('tr')">Türkçe</button></div></main><script src="mira-cloud.js?v=20261007-0915"></script><script>const params=new URLSearchParams(location.search),via=params.get('via')||sessionStorage.getItem('mira_otp_via')||'phone',mode=params.get('mode')||sessionStorage.getItem('mira_otp_mode')||'signin';const T={en:{t:'Verify your account',p:'Enter the 6-digit code we sent to your phone.',e:'Enter the 6-digit code we sent to your email.',v:'Verify & continue',n:"Didn't get the code?",r:'Resend',s:'A new code has been sent.',b:'Enter the complete 6-digit code.',o:'Verified. Continuing...'},ar:{t:'تأكيد الحساب',p:'اكتب الرمز المكوّن من 6 أرقام اللي أرسلناه إلى رقم هاتفك.',e:'اكتب الرمز المكوّن من 6 أرقام اللي أرسلناه إلى بريدك الإلكتروني.',v:'تأكيد ومتابعة',n:'ما وصلك الكود؟',r:'إعادة الإرسال',s:'تم إرسال رمز جديد.',b:'اكتب الرمز كامل من 6 أرقام.',o:'تم التحقق. جاري المتابعة...'},es:{t:'Verifica tu cuenta',p:'Introduce el código de 6 dígitos enviado a tu teléfono.',e:'Introduce el código de 6 dígitos enviado a tu correo.',v:'Verificar y continuar',n:'¿No recibiste el código?',r:'Reenviar',s:'Se envió un nuevo código.',b:'Introduce el código completo de 6 dígitos.',o:'Verificado. Continuando...'},ru:{t:'Подтвердите аккаунт',p:'Введите 6-значный код, отправленный на ваш телефон.',e:'Введите 6-значный код, отправленный на вашу почту.',v:'Подтвердить и продолжить',n:'Не получили код?',r:'Отправить снова',s:'Новый код отправлен.',b:'Введите полный 6-значный код.',o:'Подтверждено. Продолжаем...'},tr:{t:'Hesabınızı doğrulayın',p:'Telefonunuza gönderilen 6 haneli kodu girin.',e:'E-postanıza gönderilen 6 haneli kodu girin.',v:'Doğrula ve devam et',n:'Kodu almadınız mı?',r:'Tekrar gönder',s:'Yeni bir kod gönderildi.',b:'6 haneli kodun tamamını girin.',o:'Doğrulandı. Devam ediliyor...'}};const inputs=[...document.querySelectorAll('.otp input')];inputs.forEach((x,i)=>{x.addEventListener('input',()=>{x.value=x.value.replace(/\D/g,'').slice(0,1);if(x.value&&i<5)inputs[i+1].focus()});x.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!x.value&&i>0)inputs[i-1].focus()})});function getLang(){return localStorage.getItem('mira_lang')||'en'}function applyLang(l){const t=T[l]||T.en;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';title.textContent=t.t;subtitle.textContent=via==='email'?t.e:t.p;verifyBtn.textContent=t.v;noCode.textContent=t.n;resendBtn.textContent=t.r}function setLang(l){localStorage.setItem('mira_lang',l);applyLang(l)}async function verifyCode(){
    const t=T[getLang()]||T.en,c=inputs.map(i=>i.value).join('');if(c.length!==6){notice.textContent=t.b;return}
    const target=sessionStorage.getItem('mira_otp_target')||'';if(!target){notice.textContent='Missing verification destination.';return}
    notice.textContent=t.o;verifyBtn.disabled=true;
    try{
      await MiraCloud.verifyOtp(via==='email'?{email:target,token:c}:{phone:target,token:c});
      if(mode==='signup'){try{const p=JSON.parse(sessionStorage.getItem('mira_signup_profile')||'{}');if(p.full_name)localStorage.setItem('mira_profile_name',p.full_name)}catch(_){}}
      const ret=sessionStorage.getItem('mira_auth_return')||'';
      ['mira_otp_via','mira_otp_target','mira_otp_mode','mira_signup_profile'].forEach(k=>sessionStorage.removeItem(k));
      if(ret){sessionStorage.removeItem('mira_auth_return');location.href=ret}else location.href=mode==='signup'?'market.html':'home.html';
    }catch(e){let m=e.message||String(e);try{const p=JSON.parse(m);m=p.msg||p.message||m}catch(_){}notice.textContent=m;verifyBtn.disabled=false}
  }
  async function resendCode(){const target=sessionStorage.getItem('mira_otp_target')||'',profile=JSON.parse(sessionStorage.getItem('mira_signup_profile')||'{}');try{await MiraCloud.startOtp(via==='email'?{email:target,createUser:mode==='signup',data:profile}:{phone:target,createUser:mode==='signup',data:profile});notice.textContent=(T[getLang()]||T.en).s}catch(e){notice.textContent=e.message||String(e)}}applyLang(getLang());inputs[0].focus();</script></body></html>
