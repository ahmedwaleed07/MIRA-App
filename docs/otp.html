<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8fb"><title>MIRA — OTP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{
  --pink:#FF4D8D;
  --pink2:#FF7EB6;
  --peach:#FFC8A1;
  --blue:#6EC6FF;
  --ink:#A62C63;
  --muted:#B86A8E;
  --line:#F0DCE6;
  --mira:#D96A99;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff8fb;color:var(--ink)}
body{display:flex;justify-content:center}
.app{width:min(100vw,430px);min-height:100svh;background:radial-gradient(circle at 12% 4%,rgba(255,126,182,.17),transparent 28%),radial-gradient(circle at 95% 1%,rgba(110,198,255,.15),transparent 30%),linear-gradient(180deg,#fffafd 0%,#fff 48%,#fff9fc 100%);padding:calc(18px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between}
.back{width:42px;height:42px;border:0;border-radius:50%;background:#fff;box-shadow:0 7px 22px rgba(43,35,56,.08);font-size:27px;line-height:1;color:var(--pink);cursor:pointer}
.brandmark{width:124px;height:39px;background:var(--mira);-webkit-mask:url("assets/mira_wordmark.svg") center/contain no-repeat;mask:url("assets/mira_wordmark.svg") center/contain no-repeat}
.spacer{width:42px}
.lang{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}
.lang button{border:0;background:transparent;color:var(--ink);font-weight:600;padding:4px 7px;font-family:inherit}

.hero{text-align:center;margin-top:68px} h1{font-size:30px;margin:0 0 10px;font-weight:800;color:var(--ink)} .sub{margin:0 auto;color:var(--muted);font-size:14px;line-height:1.55;max-width:330px}
.card{margin-top:30px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px 18px;box-shadow:0 18px 45px rgba(75,42,71,.08)}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;direction:ltr} .otp input{width:100%;aspect-ratio:1/1.08;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:center;font-family:inherit;font-size:24px;font-weight:700;color:var(--ink);outline:none} .otp input:focus{border-color:#ff8ab8;box-shadow:0 0 0 3px rgba(255,77,141,.10)}
.primary{width:100%;margin-top:22px;border:0;border-radius:17px;padding:15px 16px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(90deg,var(--pink),var(--pink2) 35%,var(--peach) 60%,var(--blue));box-shadow:0 12px 26px rgba(255,77,141,.22);font-family:inherit}
.resend{margin-top:16px;text-align:center;font-size:13px;color:var(--muted)} .resend button{border:0;background:transparent;color:var(--pink);font-family:inherit;font-weight:700;font-size:13px} .notice{margin-top:12px;text-align:center;font-size:12px;color:var(--muted);min-height:18px}
</style></head><body><main class="app">
<div class="top"><button class="back" onclick="history.back()">‹</button><div class="brandmark"></div><div class="spacer"></div></div>
<section class="hero"><h1 id="title"></h1><p class="sub" id="subtitle"></p></section>
<section class="card"><div class="otp" id="otp"><input maxlength="1" inputmode="numeric" autocomplete="one-time-code"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"></div>
<button class="primary" id="verifyBtn" onclick="verifyCode()"></button><div class="resend"><span id="noCode"></span> <button id="resendBtn" onclick="resendCode()"></button></div><div class="notice" id="notice"></div></section>
<div class="lang"><button onclick="setLang('en')">English</button> · <button onclick="setLang('ar')">العربية</button> · <button onclick="setLang('es')">Español</button> · <button onclick="setLang('ru')">Русский</button> · <button onclick="setLang('tr')">Türkçe</button></div>
</main><script>
const via=new URLSearchParams(location.search).get("via")||"phone";
const T={
en:{title:"Verify your account",phone:"Enter the 6-digit code we sent to your phone.",email:"Enter the 6-digit code we sent to your email.",verify:"Verify & continue",no:"Didn't get the code?",resend:"Resend",sent:"A new code has been sent.",bad:"Enter the complete 6-digit code.",ok:"Verified. Continuing..."},
ar:{title:"تأكيد الحساب",phone:"اكتب الرمز المكوّن من 6 أرقام اللي أرسلناه إلى رقم هاتفك.",email:"اكتب الرمز المكوّن من 6 أرقام اللي أرسلناه إلى بريدك الإلكتروني.",verify:"تأكيد ومتابعة",no:"ما وصلك الكود؟",resend:"إعادة الإرسال",sent:"تم إرسال رمز جديد.",bad:"اكتب الرمز كامل من 6 أرقام.",ok:"تم التحقق. جاري المتابعة..."},
es:{title:"Verifica tu cuenta",phone:"Introduce el código de 6 dígitos enviado a tu teléfono.",email:"Introduce el código de 6 dígitos enviado a tu correo.",verify:"Verificar y continuar",no:"¿No recibiste el código?",resend:"Reenviar",sent:"Se envió un nuevo código.",bad:"Introduce el código completo de 6 dígitos.",ok:"Verificado. Continuando..."},
ru:{title:"Подтвердите аккаунт",phone:"Введите 6-значный код, отправленный на ваш телефон.",email:"Введите 6-значный код, отправленный на вашу почту.",verify:"Подтвердить и продолжить",no:"Не получили код?",resend:"Отправить снова",sent:"Новый код отправлен.",bad:"Введите полный 6-значный код.",ok:"Подтверждено. Продолжаем..."},
tr:{title:"Hesabınızı doğrulayın",phone:"Telefonunuza gönderilen 6 haneli kodu girin.",email:"E-postanıza gönderilen 6 haneli kodu girin.",verify:"Doğrula ve devam et",no:"Kodu almadınız mı?",resend:"Tekrar gönder",sent:"Yeni bir kod gönderildi.",bad:"6 haneli kodun tamamını girin.",ok:"Doğrulandı. Devam ediliyor..."}
};
const inputs=[...document.querySelectorAll(".otp input")];inputs.forEach((x,i)=>{x.addEventListener("input",()=>{x.value=x.value.replace(/\D/g,"").slice(0,1);if(x.value&&i<5)inputs[i+1].focus()});x.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!x.value&&i>0)inputs[i-1].focus()})})
function verifyCode(){let t=T[getLang()]||T.en;let c=inputs.map(i=>i.value).join("");if(c.length!==6){notice.textContent=t.bad;return}notice.textContent=t.ok;setTimeout(()=>location.href="market.html",500)}
function resendCode(){notice.textContent=(T[getLang()]||T.en).sent}
function getLang(){return localStorage.getItem("mira_lang")||"en"}
function setLang(lang){localStorage.setItem("mira_lang",lang);applyLang(lang)}
function applyLang(lang){let t=T[lang]||T.en;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";title.textContent=t.title;subtitle.textContent=via==="email"?t.email:t.phone;verifyBtn.textContent=t.verify;noCode.textContent=t.no;resendBtn.textContent=t.resend}
applyLang(getLang());inputs[0].focus();
</script></body></html>
