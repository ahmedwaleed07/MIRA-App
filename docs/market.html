<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FC618F"><title>MIRA — Choose Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{
  --pink:#FC618F;
  --pink2:#800020;
  --peach:#800020;
  --blue:#FFFFFF;
  --ink:#FFFFFF;
  --muted:#FC618F;
  --line:#800020;
  --mira:#FC618F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#800020;color:var(--ink)}
body{display:flex;justify-content:center}
.app{width:min(100vw,430px);min-height:100svh;background:radial-gradient(circle at 12% 4%,#800020,transparent 28%),radial-gradient(circle at 95% 1%,#800020,transparent 30%),linear-gradient(180deg,#800020 0%,#800020 48%,#800020 100%);padding:calc(18px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between}
.back{width:42px;height:42px;border:0;border-radius:50%;background:#800020;box-shadow:0 7px 22px #800020;font-size:27px;line-height:1;color:var(--pink);cursor:pointer}
.brandmark{width:124px;height:39px;background:var(--mira);-webkit-mask:url("assets/mira_wordmark.svg") center/contain no-repeat;mask:url("assets/mira_wordmark.svg") center/contain no-repeat}
.spacer{width:42px}
.lang{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}
.lang button{border:0;background:transparent;color:var(--ink);font-weight:600;padding:4px 7px;font-family:inherit}

.hero{text-align:center;margin-top:44px} h1{font-size:28px;margin:0 0 8px;font-weight:800;color:var(--ink)} .sub{margin:0 auto;color:var(--muted);font-size:14px;line-height:1.55;max-width:330px}
.search-wrap{margin-top:26px;background:#800020;border:1px solid var(--line);border-radius:17px;padding:0 14px;display:flex;align-items:center;box-shadow:0 10px 28px #800020} .search-icon{font-size:18px;color:var(--pink);margin-right:9px} .search{width:100%;border:0;outline:none;background:transparent;padding:15px 0;font-family:inherit;font-size:14px;color:var(--ink)} .search::placeholder{color:#800020}
.section-title{margin:24px 2px 10px;font-size:13px;font-weight:700;color:var(--ink)} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.country{border:1px solid var(--line);background:#800020;border-radius:20px;padding:16px 14px;display:flex;align-items:center;gap:11px;min-height:72px;cursor:pointer;text-align:left;font-family:inherit;box-shadow:0 8px 24px #800020} .country.selected{border-color:#800020;box-shadow:0 0 0 3px #FC618F} .flag{font-size:28px} .country-name{font-size:13px;font-weight:700;color:var(--ink)}
.primary{width:100%;margin-top:26px;border:0;border-radius:17px;padding:15px 16px;font-weight:700;font-size:16px;color:#800020;background:linear-gradient(90deg,var(--pink),var(--pink2) 35%,var(--peach) 60%,var(--blue));box-shadow:0 12px 26px #FC618F;font-family:inherit} .primary:disabled{opacity:.45;box-shadow:none}
.note{margin:12px 10px 0;text-align:center;color:var(--muted);font-size:11.5px;line-height:1.5}
</style><link rel="stylesheet" href="mira-pink-theme.css?v=20261008-luxe-contrast-2"><style id="mira-country-readability-v1">
/* Only the country selection page: the global theme previously concealed country names. */
body .app #countryGrid .country,
body .app #countryGrid .country .country-name{

}

}
body .app #countryGrid .country.selected{border-color:#FC618F!important}
body .app .search-wrap{
  display:flex!important;align-items:center!important;gap:12px!important;

  border:1px solid #800020!important;border-radius:19px!important;
  background:#FFFFFF!important;box-shadow:0 5px 20px #800020!important;
}

  border-color:#FC618F!important;
  box-shadow:0 0 0 2px #FC618F!important;
}
body .app .search-wrap .search-icon{
  flex:0 0 20px;display:block;width:20px;height:20px;
  color:#800020!important;stroke:#800020!important;
  margin:0!important;
}
body .app .search-wrap input.search{
  display:block!important;flex:1 1 auto;min-width:0!important;
  width:100%!important;height:55px!important;

}

}
</style><style id="mira-market-ai-visuals-v1">
body .app{position:relative;isolation:isolate}
body .app:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:url("assets/backgrounds/market-background.webp?v=20261022-market-visuals-1") center/100% 100% no-repeat;opacity:.24}
body .app>*{position:relative;z-index:1}
body .app .hero{position:relative;isolation:isolate;overflow:hidden;text-align:start;margin:34px 0 0;padding:24px 20px;border:1px solid #ffffffa8;border-radius:26px;background:linear-gradient(100deg,#800020ed 0%,#800020bf 48%,#80002045 100%),url("assets/backgrounds/market-banner.webp?v=20261022-market-visuals-1") center/cover;box-shadow:0 16px 34px #80002020}
body .app .hero h1,body .app .hero .sub{position:relative;color:#fff!important;text-shadow:0 2px 10px #28030d80}
body .app .hero .sub{margin-inline:0}
body .app .section-title{margin-top:23px}
body .app .country{background:#fff!important;color:#800020!important;border-color:#ecd9e0!important;box-shadow:0 9px 23px #80002012}
body .app .country.selected{border-color:#FC618F!important;box-shadow:0 0 0 2px #FC618F,0 10px 22px #80002018!important}
.flag3d-wrap{position:relative;display:block;flex:0 0 36px;width:36px;height:25px;perspective:150px;filter:drop-shadow(0 4px 4px #26101830)}
.flag3d{display:block;width:34px;height:23px;object-fit:cover;border-radius:3px;transform:rotateY(-13deg) rotateX(2deg);box-shadow:inset 0 1px 1px #fff8,0 1px 3px #1b071133}
.flag3d-wrap:after{content:"";position:absolute;inset:1px 2px 2px 1px;pointer-events:none;border-radius:3px;background:linear-gradient(110deg,#ffffff70 0%,#ffffff12 32%,transparent 55%,#16071128 100%);transform:rotateY(-13deg) rotateX(2deg)}
body .app .country-name{color:#800020!important}
@media(max-width:360px){body .app .hero{padding:20px 16px}body .app .hero h1{font-size:24px}}
</style></head><body><main class="app">
<div class="top"><button class="back" onclick="history.back()">‹</button><div class="brandmark"></div><div class="spacer"></div></div>
<section class="hero"><h1 id="title"></h1><p class="sub" id="subtitle"></p></section>
<div class="search-wrap"><svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.75" cy="10.75" r="6.75"/><path d="m16 16 4.5 4.5"/></svg><input id="search" class="search" type="search" oninput="render()"></div>
<div class="section-title" id="sectionTitle"></div><section class="grid" id="countryGrid"></section>
<button class="primary" id="continueBtn" disabled onclick="continueMarket()"></button><p class="note" id="note"></p>
<div class="lang"><button onclick="setLang('en')">English</button> · <button onclick="setLang('ar')">العربية</button> · <button onclick="setLang('es')">Español</button> · <button onclick="setLang('ru')">Русский</button> · <button onclick="setLang('tr')">Türkçe</button></div>
</main><script>
const COUNTRIES=[{"code":"IQ","en":"Iraq","ar":"العراق","es":"Irak","ru":"Ирак","tr":"Irak"},{"code":"KW","en":"Kuwait","ar":"الكويت","es":"Kuwait","ru":"Кувейт","tr":"Kuveyt"},{"code":"SA","en":"Saudi Arabia","ar":"السعودية","es":"Arabia Saudita","ru":"Саудовская Аравия","tr":"Suudi Arabistan"},{"code":"BH","en":"Bahrain","ar":"البحرين","es":"Baréin","ru":"Бахрейн","tr":"Bahreyn"},{"code":"QA","en":"Qatar","ar":"قطر","es":"Catar","ru":"Катар","tr":"Katar"},{"code":"AE","en":"United Arab Emirates","ar":"الإمارات العربية المتحدة","es":"Emiratos Árabes Unidos","ru":"ОАЭ","tr":"Birleşik Arap Emirlikleri"},{"code":"OM","en":"Oman","ar":"عُمان","es":"Omán","ru":"Оман","tr":"Umman"},{"code":"JO","en":"Jordan","ar":"الأردن","es":"Jordania","ru":"Иордания","tr":"Ürdün"},{"code":"LB","en":"Lebanon","ar":"لبنان","es":"Líbano","ru":"Ливан","tr":"Lübnan"},{"code":"PS","en":"Palestine","ar":"فلسطين","es":"Palestina","ru":"Палестина","tr":"Filistin"},{"code":"EG","en":"Egypt","ar":"مصر","es":"Egipto","ru":"Египет","tr":"Mısır"},{"code":"US","en":"United States","ar":"الولايات المتحدة","es":"Estados Unidos","ru":"США","tr":"Amerika Birleşik Devletleri"},{"code":"CA","en":"Canada","ar":"كندا","es":"Canadá","ru":"Канада","tr":"Kanada"},{"code":"AU","en":"Australia","ar":"أستراليا","es":"Australia","ru":"Австралия","tr":"Avustralya"},{"code":"GB","en":"United Kingdom","ar":"بريطانيا","es":"Reino Unido","ru":"Великобритания","tr":"Birleşik Krallık"},{"code":"IT","en":"Italy","ar":"إيطاليا","es":"Italia","ru":"Италия","tr":"İtalya"},{"code":"DE","en":"Germany","ar":"ألمانيا","es":"Alemania","ru":"Германия","tr":"Almanya"},{"code":"FR","en":"France","ar":"فرنسا","es":"Francia","ru":"Франция","tr":"Fransa"},{"code":"NL","en":"Netherlands","ar":"هولندا","es":"Países Bajos","ru":"Нидерланды","tr":"Hollanda"},{"code":"FI","en":"Finland","ar":"فنلندا","es":"Finlandia","ru":"Финляндия","tr":"Finlandiya"},{"code":"BE","en":"Belgium","ar":"بلجيكا","es":"Bélgica","ru":"Бельгия","tr":"Belçika"},{"code":"AT","en":"Austria","ar":"النمسا","es":"Austria","ru":"Австрия","tr":"Avusturya"},{"code":"SE","en":"Sweden","ar":"السويد","es":"Suecia","ru":"Швеция","tr":"İsveç"}];
const T={
en:{title:"Where do you want to shop?",subtitle:"Choose your MIRA shopping country. You can change it later anytime.",search:"Search country",section:"Available markets",cont:"Continue",note:"Your selected country controls the offers and stores shown in MIRA."},
ar:{title:"وين تريد تتسوّق؟",subtitle:"اختار دولة التسوق في MIRA، وتگدر تغيّرها بأي وقت.",search:"ابحث عن دولة",section:"الدول المتاحة",cont:"متابعة",note:"الدولة المختارة تحدد العروض والمتاجر اللي تظهر إلك داخل MIRA."},
es:{title:"¿Dónde quieres comprar?",subtitle:"Elige tu país de compras en MIRA. Puedes cambiarlo después.",search:"Buscar país",section:"Mercados disponibles",cont:"Continuar",note:"El país seleccionado controla las ofertas y tiendas que ves en MIRA."},
ru:{title:"Где вы хотите делать покупки?",subtitle:"Выберите страну покупок MIRA. Её можно изменить позже.",search:"Поиск страны",section:"Доступные рынки",cont:"Продолжить",note:"Выбранная страна определяет предложения и магазины в MIRA."},
tr:{title:"Nerede alışveriş yapmak istiyorsunuz?",subtitle:"MIRA alışveriş ülkenizi seçin. Daha sonra değiştirebilirsiniz.",search:"Ülke ara",section:"Mevcut pazarlar",cont:"Devam et",note:"Seçilen ülke MIRA'da gösterilen teklifleri ve mağazaları belirler."}
};
let selectedCountry="";
function getLang(){return localStorage.getItem("mira_lang")||"en"}
function render(){let lang=getLang(),q=search.value.trim().toLowerCase();countryGrid.innerHTML="";COUNTRIES.filter(c=>c[lang].toLowerCase().includes(q)).forEach(c=>{let b=document.createElement("button");b.className="country"+(selectedCountry===c.code?" selected":"");b.innerHTML=`<span class="flag3d-wrap"><img class="flag3d" src="assets/flags/${c.code.toLowerCase()}.webp?v=20261022-flags-1" alt="" aria-hidden="true" loading="lazy"></span><span class="country-name">${c[lang]}</span>`;b.onclick=()=>{selectedCountry=c.code;render();continueBtn.disabled=false};countryGrid.appendChild(b)})}
function continueMarket(){if(!selectedCountry)return;localStorage.setItem("mira_market",selectedCountry);location.href="city.html?market="+encodeURIComponent(selectedCountry)}
function setLang(lang){localStorage.setItem("mira_lang",lang);applyLang(lang)}
function applyLang(lang){let t=T[lang]||T.en;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";title.textContent=t.title;subtitle.textContent=t.subtitle;search.placeholder=t.search;sectionTitle.textContent=t.section;continueBtn.textContent=t.cont;note.textContent=t.note;render()}
applyLang(getLang());
</script></body></html>
