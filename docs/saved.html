<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8fb"><title>MIRA — Saved</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--pink:#FF4D8D;--pink2:#FF7EB6;--peach:#FFC8A1;--blue:#6EC6FF;--ink:#A62C63;--muted:#B86A8E;--line:#F0DCE6;--bg:#fff8fb;--mira:#D94F8A}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100svh;background:radial-gradient(circle at 8% 0%,rgba(255,126,182,.15),transparent 24%),radial-gradient(circle at 100% 3%,rgba(110,198,255,.14),transparent 28%),linear-gradient(180deg,#fffafd,#fff 48%,#fff9fc);padding:calc(16px + env(safe-area-inset-top)) 16px calc(94px + env(safe-area-inset-bottom))}.brandmark{width:118px;height:38px;background:var(--mira);-webkit-mask:url('assets/mira_wordmark.svg') center/contain no-repeat;mask:url('assets/mira_wordmark.svg') center/contain no-repeat}.title{margin-top:22px;font-size:25px;font-weight:800}.sub{font-size:11px;color:var(--muted);margin-top:4px}.empty{margin-top:55px;text-align:center;padding:22px}.heart{width:82px;height:82px;border-radius:26px;margin:0 auto;background:linear-gradient(135deg,#fff0f6,#eaf7ff);display:grid;place-items:center}.heart svg{width:39px;height:39px;color:var(--pink)}.empty h2{font-size:18px;margin:18px 0 7px}.empty p{font-size:11px;line-height:1.6;color:var(--muted);max-width:280px;margin:0 auto}.browse{margin-top:18px;border:0;border-radius:14px;padding:11px 16px;background:linear-gradient(90deg,var(--pink),var(--pink2));color:#fff;font:700 11px Poppins}.saved-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:20px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 28px rgba(92,50,76,.06)}.visual{height:112px;position:relative;background:linear-gradient(135deg,#fff1f6,#fff 46%,#eaf7ff)}.badge{position:absolute;top:12px;left:12px;background:#fff;color:var(--pink);border:1px solid #f4dbe6;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:800}.logo{position:absolute;right:14px;bottom:14px;width:54px;height:54px;border-radius:17px;background:linear-gradient(135deg,#ffdce8,#dff3ff);display:grid;place-items:center;font-size:19px;font-weight:800;color:var(--pink);box-shadow:0 8px 20px rgba(92,50,76,.08)}.body{padding:14px}.body h4{margin:0 0 5px;font-size:14px}.offer-title{font-size:11px;color:var(--muted);line-height:1.5}.discount{margin-top:9px;font-size:19px;font-weight:800;color:var(--pink)}.actions{display:flex;gap:9px;margin-top:13px}.open,.remove{flex:1;border:0;border-radius:12px;padding:10px 11px;font:700 10px Poppins}.open{background:linear-gradient(90deg,var(--pink),var(--pink2));color:#fff}.remove{background:#fff3f7;color:var(--pink);border:1px solid #f7dce8}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100vw,430px);padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border-top:1px solid #f4e3eb;display:grid;grid-template-columns:repeat(4,1fr)}.nav{color:#b18499;text-decoration:none;font:600 9.5px Poppins;display:flex;flex-direction:column;align-items:center;gap:4px}.nav svg{width:22px;height:22px}.nav.active{color:var(--pink)}[dir=rtl] .badge{left:auto;right:12px}[dir=rtl] .logo{right:auto;left:14px}</style></head><body><main class="app"><div class="brandmark" aria-label="MIRA"></div><div class="title" id="title"></div><div class="sub" id="sub"></div><div id="content"></div></main><nav class="bottom"><a class="nav" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg><span id="nHome"></span></a><a class="nav" href="categories.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span id="nCat"></span></a><a class="nav active" href="saved.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 21s-8-4.7-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6.3-8 11-8 11z"/></svg><span id="nSaved"></span></a><a class="nav" href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.4 3.7-7 8-7s7 2.6 8 7"/></svg><span id="nProfile"></span></a></nav><script>const T={en:{title:'Saved',sub:'Offers and stores you save will appear here.',empty:'Nothing saved yet',empty2:'Tap the heart on any offer or store to keep it here.',browse:'Browse offers',home:'Home',cat:'Categories',saved:'Saved',profile:'Profile',offer:'Saved offer',store:'Saved store',open:'Open offer',remove:'Remove'},ar:{title:'المحفوظات',sub:'العروض والمتاجر اللي تحفظها راح تظهر هنا.',empty:'ماكو شي محفوظ بعد',empty2:'اضغط علامة القلب على أي عرض أو متجر حتى يبقى هنا.',browse:'تصفح العروض',home:'الرئيسية',cat:'التصنيفات',saved:'المحفوظات',profile:'حسابي',offer:'عرض محفوظ',store:'متجر محفوظ',open:'فتح العرض',remove:'إزالة'},es:{title:'Guardado',sub:'Tus ofertas y tiendas guardadas aparecerán aquí.',empty:'Aún no hay nada guardado',empty2:'Toca el corazón en una oferta o tienda para guardarla aquí.',browse:'Ver ofertas',home:'Inicio',cat:'Categorías',saved:'Guardado',profile:'Perfil',offer:'Oferta guardada',store:'Tienda guardada',open:'Abrir oferta',remove:'Eliminar'},ru:{title:'Сохранено',sub:'Здесь появятся сохраненные предложения и магазины.',empty:'Пока ничего нет',empty2:'Нажмите на сердце у предложения или магазина.',browse:'Смотреть предложения',home:'Главная',cat:'Категории',saved:'Сохранено',profile:'Профиль',offer:'Сохраненное предложение',store:'Сохраненный магазин',open:'Открыть',remove:'Удалить'},tr:{title:'Kaydedilenler',sub:'Kaydettiğin fırsatlar ve mağazalar burada görünür.',empty:'Henüz kayıt yok',empty2:'Bir fırsatı veya mağazayı kaydetmek için kalbe dokun.',browse:'Fırsatlara göz at',home:'Ana Sayfa',cat:'Kategoriler',saved:'Kaydedilenler',profile:'Profil',offer:'Kaydedilen fırsat',store:'Kaydedilen mağaza',open:'Fırsatı aç',remove:'Kaldır'}};function getSaved(){try{return JSON.parse(localStorage.getItem('mira_saved')||'[]')}catch(e){return[]}}function openSaved(x){if((x.type||'offer')==='store'){location.href='store.html?id='+encodeURIComponent(x.storeId||x.id||'');return}const p=new URLSearchParams({id:x.id||'',name:x.name||'MIRA Partner',title:x.title||'',discount:x.discount||'25% OFF',letter:x.letter||'M',type:x.type||'offer',storeId:x.storeId||''});location.href='offer.html?'+p.toString()}function removeSaved(id){const s=getSaved().filter(x=>x.id!==id);localStorage.setItem('mira_saved',JSON.stringify(s));render()}function currentSaved(){let stores=[],offers=[];try{stores=JSON.parse(localStorage.getItem('mira_admin_stores')||'[]');offers=JSON.parse(localStorage.getItem('mira_admin_offers')||'[]')}catch(e){}return getSaved().map(x=>{const o=offers.find(a=>a.id===x.id),s=o?stores.find(a=>a.id===o.storeId):stores.find(a=>a.id===(x.storeId||x.id));if(!o&&!s)return x;const name=s?.name||x.name||'MIRA Partner';let discount=x.discount||'25% OFF';if(o?.discount)discount=String(o.discount).replace('%','')+'% OFF';else if(o&&+o.originalPrice>0&&+o.offerPrice>=0&&+o.offerPrice<+o.originalPrice)discount=Math.round((1-(+o.offerPrice/+o.originalPrice))*100)+'% OFF';return {...x,name,title:o?.title||x.title||'',discount,letter:(name[0]||'M').toUpperCase(),storeId:o?.storeId||x.storeId||s?.id||''}})}function render(){const l=localStorage.getItem('mira_lang')||'en',t=T[l]||T.en;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';title.textContent=t.title;sub.textContent=t.sub;nHome.textContent=t.home;nCat.textContent=t.cat;nSaved.textContent=t.saved;nProfile.textContent=t.profile;const saved=currentSaved();if(!saved.length){content.innerHTML=`<div class="empty"><div class="heart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-8-4.7-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6.3-8 11-8 11z"/></svg></div><h2>${t.empty}</h2><p>${t.empty2}</p><button class="browse" onclick="location.href='home.html'">${t.browse}</button></div>`;return}content.innerHTML='<div class="saved-grid">'+saved.map((x,i)=>`<article class="card"><div class="visual"><span class="badge">${x.type==='store'?t.store:t.offer}</span><div class="logo">${(x.letter||x.name?.[0]||'M').toUpperCase()}</div></div><div class="body"><h4>${x.name||'MIRA Partner'}</h4><div class="offer-title">${x.title||''}</div><div class="discount">${x.discount||'25% OFF'}</div><div class="actions"><button class="open" data-open="${i}">${t.open}</button><button class="remove" data-remove="${encodeURIComponent(x.id||'')}">${t.remove}</button></div></div></article>`).join('')+'</div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openSaved(saved[+b.dataset.open]));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeSaved(decodeURIComponent(b.dataset.remove)))}render();</script></body></html>
