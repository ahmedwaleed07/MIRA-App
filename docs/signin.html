<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8fb"><title>MIRA — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#FF4D8D;
  --pink2:#FF7EB6;
  --peach:#FFC8A1;
  --blue:#6EC6FF;
  --ink:#A62C63;
  --muted:#B86A8E;
  --line:#F0DCE6;
  --mira:#D96A99;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff8fb;color:var(--ink)}
body{display:flex;justify-content:center}
.app{width:min(100vw,430px);min-height:100svh;background:radial-gradient(circle at 12% 4%,rgba(255,126,182,.17),transparent 28%),radial-gradient(circle at 95% 1%,rgba(110,198,255,.15),transparent 30%),linear-gradient(180deg,#fffafd 0%,#fff 48%,#fff9fc 100%);padding:calc(18px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between}
.back{width:42px;height:42px;border:0;border-radius:50%;background:#fff;box-shadow:0 7px 22px rgba(43,35,56,.08);font-size:27px;line-height:1;color:var(--pink);cursor:pointer}
.brandmark{width:124px;height:39px;background:var(--mira);-webkit-mask:url("assets/mira_wordmark.svg") center/contain no-repeat;mask:url("assets/mira_wordmark.svg") center/contain no-repeat}
.spacer{width:42px}
.lang{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}
.lang button{border:0;background:transparent;color:var(--ink);font-weight:600;padding:4px 7px;font-family:inherit}

.hero{text-align:center;margin-top:72px} h1{font-size:30px;margin:0 0 8px;font-weight:800;color:var(--ink)} .sub{margin:0 auto;color:var(--muted);font-size:15px;line-height:1.55;max-width:320px}
.card{margin-top:30px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:0 18px 45px rgba(75,42,71,.08)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#fbf1f6;border-radius:16px;padding:4px}
.tab{border:0;background:transparent;border-radius:13px;padding:12px 8px;font-weight:600;color:var(--muted);font-size:14px;font-family:inherit} .tab.active{background:#fff;color:var(--pink);box-shadow:0 4px 12px rgba(66,49,70,.08)}
.panel{display:none;margin-top:18px} .panel.active{display:block}
.label{display:block;font-size:13px;font-weight:600;margin:0 0 8px 2px;color:var(--ink)} .row{display:flex;gap:10px}
.code{width:104px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:0 12px;font-size:15px;font-weight:600;color:var(--ink);font-family:inherit}
.input{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;padding:15px 14px;outline:none;font-size:16px;color:var(--ink);font-family:inherit}
.input::placeholder{color:#C991AA} .input:focus,.code:focus{border-color:#ff8ab8;box-shadow:0 0 0 3px rgba(255,77,141,.10)}
.primary{width:100%;margin-top:18px;border:0;border-radius:17px;padding:15px 16px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(90deg,var(--pink),var(--pink2) 35%,var(--peach) 60%,var(--blue));box-shadow:0 12px 26px rgba(255,77,141,.22);font-family:inherit}
.privacy{font-size:11.5px;line-height:1.45;color:var(--muted);text-align:center;margin:13px 8px 0} .bottom{text-align:center;margin-top:22px;font-size:14px;color:var(--muted)} .bottom a{color:var(--pink);font-weight:700;text-decoration:none}
[dir=rtl] .label{text-align:right}
</style></head><body><main class="app">
<div class="top"><button class="back" onclick="history.back()">‹</button><div class="brandmark"></div><div class="spacer"></div></div>
<section class="hero"><h1 id="title"></h1><p class="sub" id="subtitle"></p></section>
<section class="card">
<div class="tabs"><button class="tab active" id="phoneTab" onclick="showTab('phone')"></button><button class="tab" id="emailTab" onclick="showTab('email')"></button></div>
<div class="panel active" id="phonePanel"><label class="label" id="phoneLabel" for="phone"></label><div class="row"><select class="code" id="code">
<option>🇮🇶 +964</option><option>🇰🇼 +965</option><option>🇸🇦 +966</option><option>🇧🇭 +973</option><option>🇶🇦 +974</option><option>🇦🇪 +971</option><option>🇴🇲 +968</option><option>🇯🇴 +962</option><option>🇱🇧 +961</option><option>🇵🇸 +970</option><option>🇪🇬 +20</option><option>🇺🇸 +1</option><option>🇨🇦 +1</option><option>🇦🇺 +61</option><option>🇬🇧 +44</option><option>🇮🇹 +39</option><option>🇩🇪 +49</option><option>🇫🇷 +33</option><option>🇳🇱 +31</option><option>🇫🇮 +358</option><option>🇧🇪 +32</option><option>🇦🇹 +43</option><option>🇸🇪 +46</option>
</select><input class="input" id="phone" type="tel" inputmode="tel"></div><button class="primary" id="continuePhone" onclick="goOtp('phone')"></button></div>
<div class="panel" id="emailPanel"><label class="label" id="emailLabel" for="email"></label><input class="input" id="email" type="email" inputmode="email"><button class="primary" id="continueEmail" onclick="goOtp('email')"></button></div>
<p class="privacy" id="privacy"></p></section>
<div class="bottom" id="bottom"></div>
<div class="lang"><button onclick="setLang('en')">English</button> · <button onclick="setLang('ar')">العربية</button> · <button onclick="setLang('es')">Español</button> · <button onclick="setLang('ru')">Русский</button> · <button onclick="setLang('tr')">Türkçe</button></div>
</main><script>
const T={
en:{title:"Welcome back",subtitle:"Sign in with your phone number or email.",phone:"Phone",email:"Email",phoneLabel:"Phone number",emailLabel:"Email address",cont:"Continue",privacy:"By continuing, you agree to MIRA's Terms and Privacy Policy.",bottom:'New to MIRA? <a href="signup.html">Sign Up</a>',phPhone:"7XX XXX XXXX",phEmail:"name@example.com"},
ar:{title:"أهلاً برجعتك",subtitle:"سجّل دخولك برقم الهاتف أو البريد الإلكتروني.",phone:"الهاتف",email:"البريد الإلكتروني",phoneLabel:"رقم الهاتف",emailLabel:"البريد الإلكتروني",cont:"متابعة",privacy:"بالمتابعة أنت توافق على شروط الاستخدام وسياسة الخصوصية في MIRA.",bottom:'جديد على MIRA؟ <a href="signup.html">إنشاء حساب</a>',phPhone:"7XX XXX XXXX",phEmail:"name@example.com"},
es:{title:"Bienvenido de nuevo",subtitle:"Inicia sesión con tu número de teléfono o correo electrónico.",phone:"Teléfono",email:"Correo",phoneLabel:"Número de teléfono",emailLabel:"Correo electrónico",cont:"Continuar",privacy:"Al continuar, aceptas los Términos y la Política de Privacidad de MIRA.",bottom:'¿Nuevo en MIRA? <a href="signup.html">Crear cuenta</a>',phPhone:"Número de teléfono",phEmail:"nombre@ejemplo.com"},
ru:{title:"С возвращением",subtitle:"Войдите по номеру телефона или электронной почте.",phone:"Телефон",email:"Почта",phoneLabel:"Номер телефона",emailLabel:"Электронная почта",cont:"Продолжить",privacy:"Продолжая, вы соглашаетесь с Условиями и Политикой конфиденциальности MIRA.",bottom:'Впервые в MIRA? <a href="signup.html">Регистрация</a>',phPhone:"Номер телефона",phEmail:"name@example.com"},
tr:{title:"Tekrar hoş geldiniz",subtitle:"Telefon numaranız veya e-posta adresinizle giriş yapın.",phone:"Telefon",email:"E-posta",phoneLabel:"Telefon numarası",emailLabel:"E-posta adresi",cont:"Devam et",privacy:"Devam ederek MIRA'nın Koşullarını ve Gizlilik Politikasını kabul edersiniz.",bottom:'MIRA’da yeni misiniz? <a href="signup.html">Kayıt Ol</a>',phPhone:"Telefon numarası",phEmail:"ad@ornek.com"}
};
function showTab(w){let p=w==="phone";phonePanel.classList.toggle("active",p);emailPanel.classList.toggle("active",!p);phoneTab.classList.toggle("active",p);emailTab.classList.toggle("active",!p)}
function goOtp(type){let v=type==="phone"?phone.value.trim():email.value.trim(); if(!v)return; location.href="otp.html?via="+encodeURIComponent(type)}
function setLang(lang){localStorage.setItem("mira_lang",lang);applyLang(lang)}
function applyLang(lang){let t=T[lang]||T.en;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";title.textContent=t.title;subtitle.textContent=t.subtitle;phoneTab.textContent=t.phone;emailTab.textContent=t.email;phoneLabel.textContent=t.phoneLabel;emailLabel.textContent=t.emailLabel;continuePhone.textContent=t.cont;continueEmail.textContent=t.cont;privacy.textContent=t.privacy;bottom.innerHTML=t.bottom;phone.placeholder=t.phPhone;email.placeholder=t.phEmail}
applyLang(localStorage.getItem("mira_lang")||"en");
</script></body></html>
