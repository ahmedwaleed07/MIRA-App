<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8fb">
<title>MIRA — Sign In</title>
<style>
:root{--pink:#FF4D8D;--pink2:#FF7EB6;--peach:#FFC8A1;--blue:#6EC6FF;--ink:#B73C75;--muted:#9a7d90;--line:#f0dbe6;--mira:#D94F8A;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff8fb;color:var(--ink)}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100svh;background:radial-gradient(circle at 10% 5%,rgba(255,126,182,.18),transparent 28%),radial-gradient(circle at 95% 0%,rgba(110,198,255,.16),transparent 30%),linear-gradient(180deg,#fffafd 0%,#fff 46%,#fff9fc 100%);padding:calc(18px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));}.top{display:flex;align-items:center;justify-content:space-between}.back{width:42px;height:42px;border:0;border-radius:50%;background:#fff;box-shadow:0 7px 22px rgba(43,35,56,.08);font-size:27px;line-height:1;color:var(--pink)}.wordmark{width:132px;height:42px;background:var(--mira);-webkit-mask:url("assets/mira_wordmark.svg") center/contain no-repeat;mask:url("assets/mira_wordmark.svg") center/contain no-repeat}.spacer{width:42px}.hero{text-align:center;margin-top:52px}h1{font-size:30px;line-height:1.1;margin:0 0 8px;font-weight:800;letter-spacing:-.5px;color:var(--ink)}.sub{margin:0 auto;color:var(--muted);font-size:15px;line-height:1.55;max-width:320px}.card{margin-top:30px;background:rgba(255,255,255,.94);border:1px solid rgba(236,232,238,.95);border-radius:28px;padding:18px;box-shadow:0 18px 45px rgba(75,42,71,.08)}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f7f4f7;border-radius:16px;padding:4px}.tab{border:0;background:transparent;border-radius:13px;padding:12px 8px;font-weight:600;color:#9b93a0;font-size:14px;font-family:inherit}.tab.active{background:#fff;color:var(--pink);box-shadow:0 4px 12px rgba(66,49,70,.08)}.panel{display:none;margin-top:18px}.panel.active{display:block}.label{display:block;font-size:13px;font-weight:700;margin:0 0 8px 2px;color:var(--ink)}.row{display:flex;gap:10px}.code{width:104px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:0 12px;font-size:15px;font-weight:600;color:var(--ink);font-family:inherit}.input{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;padding:15px 14px;outline:none;font-size:16px;color:var(--ink);font-family:inherit}.input:focus,.code:focus{border-color:#ff8ab8;box-shadow:0 0 0 3px rgba(255,77,141,.10)}.primary{width:100%;margin-top:18px;border:0;border-radius:17px;padding:15px 16px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(90deg,var(--pink) 0%,var(--pink2) 35%,var(--peach) 60%,var(--blue) 100%);box-shadow:0 12px 26px rgba(255,77,141,.22);font-family:inherit}.privacy{font-size:11.5px;line-height:1.45;color:#b48ea5;text-align:center;margin:13px 8px 0}.bottom{text-align:center;margin-top:22px;font-size:14px;color:#9e7a91}.bottom a{color:var(--pink);font-weight:700;text-decoration:none}.lang{margin-top:18px;text-align:center;font-size:12px;color:#b48ea5}.lang button{border:0;background:transparent;color:#8e7486;font-weight:600;padding:4px 7px;font-family:inherit}.powered{display:flex;justify-content:center;align-items:center;margin-top:14px}.powered img{display:block;width:158px;max-width:52vw;height:auto}[dir=rtl] .label,[dir=rtl] .hero,[dir=rtl] .bottom{text-align:center}@media(max-height:760px){.hero{margin-top:42px}h1{font-size:26px}.card{margin-top:20px}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <button class="back" onclick="history.back()" aria-label="Back">‹</button>
    <div class="wordmark" aria-label="MIRA"></div>
    <div class="spacer"></div>
  </div>
  <section class="hero">
    <h1 id="title">Welcome back</h1>
    <p class="sub" id="subtitle">Sign in with your phone number or email.</p>
  </section>
  <section class="card">
    <div class="tabs">
      <button class="tab active" id="phoneTab" onclick="showTab('phone')">Phone</button>
      <button class="tab" id="emailTab" onclick="showTab('email')">Email</button>
    </div>
    <div class="panel active" id="phonePanel">
      <label class="label" id="phoneLabel" for="phone">Phone number</label>
      <div class="row">
        <select class="code" id="code" aria-label="Country code"><option>🇮🇶 +964</option><option>🇰🇼 +965</option><option>🇸🇦 +966</option><option>🇧🇭 +973</option><option>🇶🇦 +974</option><option>🇦🇪 +971</option><option>🇴🇲 +968</option><option>🇯🇴 +962</option><option>🇱🇧 +961</option><option>🇵🇸 +970</option><option>🇪🇬 +20</option><option>🇺🇸 +1</option><option>🇨🇦 +1</option><option>🇦🇺 +61</option><option>🇬🇧 +44</option><option>🇮🇹 +39</option><option>🇩🇪 +49</option><option>🇫🇷 +33</option><option>🇳🇱 +31</option><option>🇫🇮 +358</option><option>🇧🇪 +32</option><option>🇦🇹 +43</option><option>🇸🇪 +46</option></select>
        <input class="input" id="phone" type="tel" inputmode="tel" placeholder="7XX XXX XXXX">
      </div>
      <button class="primary" id="continuePhone" onclick="goOtp('phone')">Continue</button>
    </div>
    <div class="panel" id="emailPanel">
      <label class="label" id="emailLabel" for="email">Email address</label>
      <input class="input" id="email" type="email" inputmode="email" placeholder="name@example.com">
      <button class="primary" id="continueEmail" onclick="goOtp('email')">Continue</button>
    </div>
    <p class="privacy" id="privacy">By continuing, you agree to MIRA's Terms and Privacy Policy.</p>
  </section>
  <div class="bottom" id="bottom">New to MIRA? <a href="signup.html">Sign Up</a></div>
  <div class="lang"><button onclick="setLang('en')">English</button> · <button onclick="setLang('ar')">العربية</button> · <button onclick="setLang('es')">Español</button> · <button onclick="setLang('ru')">Русский</button> · <button onclick="setLang('tr')">Türkçe</button></div>
  <div class="powered"><img src="assets/asas_footer.svg" alt="Powered by ASAS 360°"></div>
</main>
<script src="mira-cloud.js?v=20261007-0915"></script><script>
const authReturn=new URLSearchParams(location.search).get("return")||sessionStorage.getItem("mira_auth_return")||"";if(authReturn)sessionStorage.setItem("mira_auth_return",authReturn);
function showTab(which){const phone=which==='phone';document.getElementById('phonePanel').classList.toggle('active',phone);document.getElementById('emailPanel').classList.toggle('active',!phone);document.getElementById('phoneTab').classList.toggle('active',phone);document.getElementById('emailTab').classList.toggle('active',!phone);} 
async function goOtp(type){
    const val=type==='phone'?document.getElementById('phone').value.trim():document.getElementById('email').value.trim();
    const t=T[document.documentElement.lang||'en'];
    if(!val){alert(type==='phone'?t.alertPhone:t.alertEmail);return}
    let target='';
    if(type==='email')target=val.toLowerCase();
    else{const cc=(document.getElementById('code').value.match(/\+\d+/)||['+964'])[0];let local=val.replace(/\D/g,'');if(local.startsWith('0'))local=local.slice(1);target=cc+local}
    const btn=type==='phone'?continuePhone:continueEmail;const oldText=btn.textContent;btn.disabled=true;btn.textContent='…';
    try{
      sessionStorage.setItem('mira_otp_via',type);sessionStorage.setItem('mira_otp_target',target);sessionStorage.setItem('mira_otp_mode','signin');
      await MiraCloud.startOtp(type==='email'?{email:target,createUser:false}:{phone:target,createUser:false});
      location.href='otp.html?via='+encodeURIComponent(type)+'&mode=signin';
    }catch(e){
      let m=e.message||String(e);try{const p=JSON.parse(m);m=p.msg||p.message||m}catch(_){}
      if(/Signups not allowed for otp/i.test(m)){
        sessionStorage.setItem('mira_prefill_method',type);
        sessionStorage.setItem('mira_prefill_value',val);
        if(type==='phone')sessionStorage.setItem('mira_prefill_code',(document.getElementById('code').value.match(/\+\d+/)||['+964'])[0]);
        const lang=localStorage.getItem('mira_lang')||'en';
        const msg=lang==='ar'?'هذا الرقم غير مسجل في MIRA. راح نحولك إلى إنشاء حساب جديد.':'This account is not registered in MIRA yet. We’ll take you to Sign Up.';
        alert(msg);
        const ret=sessionStorage.getItem('mira_auth_return')||'';
        location.href='signup.html'+(ret?'?return='+encodeURIComponent(ret):'');
        return;
      }
      alert(m);btn.disabled=false;btn.textContent=oldText
    }
  } 
const T={en:{title:'Welcome back',subtitle:'Sign in with your phone number or email.',phone:'Phone',email:'Email',phoneLabel:'Phone number',emailLabel:'Email address',continue:'Continue',privacy:"By continuing, you agree to MIRA's Terms and Privacy Policy.",bottom:'New to MIRA? <a href="signup.html">Sign Up</a>',alertPhone:'Enter your phone number',alertEmail:'Enter your email'},ar:{title:'أهلاً برجعتك',subtitle:'سجّل دخولك برقم الهاتف أو البريد الإلكتروني.',phone:'الهاتف',email:'الإيميل',phoneLabel:'رقم الهاتف',emailLabel:'البريد الإلكتروني',continue:'متابعة',privacy:'بالمتابعة أنت توافق على شروط الاستخدام وسياسة الخصوصية في MIRA.',bottom:'جديد على MIRA؟ <a href="signup.html">إنشاء حساب</a>',alertPhone:'اكتب رقم الهاتف',alertEmail:'اكتب البريد الإلكتروني'},es:{title:'Bienvenido de nuevo',subtitle:'Inicia sesión con tu número de teléfono o correo.',phone:'Teléfono',email:'Correo',phoneLabel:'Número de teléfono',emailLabel:'Correo electrónico',continue:'Continuar',privacy:'Al continuar, aceptas los Términos y la Política de privacidad de MIRA.',bottom:'¿Nuevo en MIRA? <a href="signup.html">Crear cuenta</a>',alertPhone:'Introduce tu número',alertEmail:'Introduce tu correo'},ru:{title:'С возвращением',subtitle:'Войдите с номером телефона или электронной почтой.',phone:'Телефон',email:'Почта',phoneLabel:'Номер телефона',emailLabel:'Эл. почта',continue:'Продолжить',privacy:'Продолжая, вы соглашаетесь с Условиями и Политикой конфиденциальности MIRA.',bottom:'Впервые в MIRA? <a href="signup.html">Регистрация</a>',alertPhone:'Введите номер телефона',alertEmail:'Введите электронную почту'},tr:{title:'Tekrar hoş geldin',subtitle:'Telefon numaran veya e-postan ile giriş yap.',phone:'Telefon',email:'E-posta',phoneLabel:'Telefon numarası',emailLabel:'E-posta adresi',continue:'Devam et',privacy:'Devam ederek MIRA Kullanım Şartları ve Gizlilik Politikasını kabul edersin.',bottom:'MIRA’da yeni misin? <a href="signup.html">Kayıt Ol</a>',alertPhone:'Telefon numaranı gir',alertEmail:'E-posta adresini gir'}};
function setLang(lang){localStorage.setItem('mira_lang',lang);const t=T[lang]||T.en;const rtl=lang==='ar';document.documentElement.lang=lang;document.documentElement.dir=rtl?'rtl':'ltr';document.getElementById('title').textContent=t.title;document.getElementById('subtitle').textContent=t.subtitle;document.getElementById('phoneTab').textContent=t.phone;document.getElementById('emailTab').textContent=t.email;document.getElementById('phoneLabel').textContent=t.phoneLabel;document.getElementById('emailLabel').textContent=t.emailLabel;document.getElementById('continuePhone').textContent=t.continue;document.getElementById('continueEmail').textContent=t.continue;document.getElementById('privacy').textContent=t.privacy;document.getElementById('bottom').innerHTML=t.bottom;}
setLang(localStorage.getItem('mira_lang')||'en');
</script>
</body>
</html>
