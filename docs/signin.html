<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FC618F">
<title>MIRA — Sign In</title>
<link rel="stylesheet" href="mira-auth-v3.css?v=20261009-interactive-1"></head><body class="mira-auth-v3 auth-view"><main class="app phone-mode" id="authApp"><div class="topbar"><a href="welcome.html" class="back" aria-label="Back">‹</a></div><div class="auth-stage"><div class="hero-brand" aria-label="MIRA"><img class="icon" src="assets/mira_icon.svg" alt=""><img class="wordmark" src="assets/mira_wordmark.svg" alt="MIRA"></div><section class="form-panel">
<h1 id="title">Welcome back</h1><p class="sub" id="subtitle">Sign in with phone or email.</p>
<div class="tabs" aria-label="Sign in method"><button type="button" class="tab active" id="phoneTab" onclick="showTab('phone')">Phone</button><button type="button" class="tab" id="emailTab" onclick="showTab('email')">Email</button></div>
<div class="panel active" id="phonePanel"><label class="sr-only" id="phoneLabel" for="phone">Phone number</label>
<div class="row"><select class="code" id="code" aria-label="Country code"><option>+964</option><option>+965</option><option>+966</option><option>+973</option><option>+974</option><option>+971</option><option>+968</option><option>+962</option><option>+961</option><option>+970</option><option>+20</option><option>+1</option><option>+61</option><option>+44</option><option>+39</option><option>+49</option><option>+33</option><option>+31</option><option>+358</option><option>+32</option><option>+43</option><option>+46</option></select>
<input class="input" id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="7XX XXX XXXX"></div></div>
<div class="panel" id="emailPanel"><label class="sr-only" id="emailLabel" for="email">Email address</label><input class="input" id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com"></div>
<div class="auth-actions"><button class="continue-hot" id="continuePhone" onclick="goOtp('phone')">Continue</button><button class="continue-hot" id="continueEmail" onclick="goOtp('email')">Continue</button></div>
<div class="bottom-link" id="bottom"></div><p class="privacy" id="privacy"></p>
</section><nav class="languages" aria-label="Languages">
<button data-lang="tr" onclick="setLang('tr')">Türkçe</button><button data-lang="ru" onclick="setLang('ru')">Русский</button><button data-lang="es" onclick="setLang('es')">Español</button><button data-lang="en" onclick="setLang('en')">English</button><button data-lang="ar" onclick="setLang('ar')">العربية</button></nav>
<footer class="brand-footer"><img src="assets/asas_footer.svg" alt="Powered by ASAS 360°"></footer></div></main><script src="mira-cloud.js?v=20261007-1620"></script><script>
const authReturn=new URLSearchParams(location.search).get("return")||sessionStorage.getItem("mira_auth_return")||"";if(authReturn){sessionStorage.setItem("mira_auth_return",authReturn);localStorage.setItem("mira_auth_return",authReturn)}
(()=>{const p=MiraCloud.payload();if(p&&p.role==='authenticated'&&p.sub){sessionStorage.setItem('mira_existing_session_checked','1');const ret=localStorage.getItem('mira_auth_return')||sessionStorage.getItem('mira_auth_return')||'home.html';localStorage.removeItem('mira_auth_return');sessionStorage.removeItem('mira_auth_return');location.replace(ret)}})();
function showTab(which){const phone=which==='phone';document.getElementById('authApp').classList.toggle('phone-mode',phone);document.getElementById('authApp').classList.toggle('email-mode',!phone);document.getElementById('phonePanel').classList.toggle('active',phone);document.getElementById('emailPanel').classList.toggle('active',!phone);document.getElementById('phoneTab').classList.toggle('active',phone);document.getElementById('emailTab').classList.toggle('active',!phone);} 
async function goOtp(type){
    const val=type==='phone'?document.getElementById('phone').value.trim():document.getElementById('email').value.trim();
    const t=T[document.documentElement.lang||'en'];
    if(!val){alert(type==='phone'?t.alertPhone:t.alertEmail);return}
    let target='';
    if(type==='email')target=val.toLowerCase();
    else{const cc=(document.getElementById('code').value.match(/\+\d+/)||['+964'])[0];let local=val.replace(/\D/g,'');if(local.startsWith('0'))local=local.slice(1);target=cc+local}
    const btn=type==='phone'?continuePhone:continueEmail;const oldText=btn.textContent;btn.disabled=true;btn.textContent='…';
    try{
      sessionStorage.setItem('mira_otp_via',type);sessionStorage.setItem('mira_otp_target',target);sessionStorage.setItem('mira_otp_mode','signin');
      const cb=new URL('auth-callback.html',location.href);const next=localStorage.getItem('mira_auth_return')||sessionStorage.getItem('mira_auth_return')||'home.html';cb.searchParams.set('next',next);const callback=cb.href;await MiraCloud.startOtp(type==='email'?{email:target,createUser:false,redirectTo:callback}:{phone:target,createUser:false});
      location.href='otp.html?via='+encodeURIComponent(type)+'&mode=signin';
    }catch(e){
      let m=e.message||String(e);try{const p=JSON.parse(m);m=p.msg||p.message||m}catch(_){}
      if(/Signups not allowed for otp/i.test(m)){
        sessionStorage.setItem('mira_prefill_method',type);
        sessionStorage.setItem('mira_prefill_value',val);
        if(type==='phone')sessionStorage.setItem('mira_prefill_code',(document.getElementById('code').value.match(/\+\d+/)||['+964'])[0]);
        const lang=localStorage.getItem('mira_lang')||'en';
        const msg=lang==='ar'?'هذا الرقم غير مسجل في MIRA. راح نحولك إلى إنشاء حساب جديد.':'This account is not registered in MIRA yet. We’ll take you to Sign Up.';
        alert(msg);
        const ret=sessionStorage.getItem('mira_auth_return')||'';
        location.href='signup.html'+(ret?'?return='+encodeURIComponent(ret):'');
        return;
      }
      if(/Unsupported phone provider/i.test(m)){const lang=localStorage.getItem('mira_lang')||'en';m=lang==='ar'?'تسجيل الدخول برقم الهاتف يحتاج تفعيل خدمة رسائل SMS في MIRA. استخدم الإيميل حالياً أو فعّل مزود SMS.':'Phone sign-in requires an SMS provider to be configured for MIRA. Use email for now or enable an SMS provider.'}if(/email rate limit exceeded|over_email_send_rate_limit|rate limit/i.test(m)){const lang=localStorage.getItem('mira_lang')||'en';m=lang==='ar'?'تم إرسال عدد كبير من رسائل التحقق حالياً. إذا كنت فتحت رابط التحقق السابق بنجاح، ارجع إلى MIRA وسوِّ تحديث. وإذا لا، انتظر إلى أن يسمح Supabase بإرسال رسالة جديدة.':'Too many verification emails were sent. If you already opened the previous verification link successfully, return to MIRA and refresh. Otherwise wait until Supabase allows another email.'}alert(m);btn.disabled=false;btn.textContent=oldText
    }
  } 
const T={en:{title:'Welcome back',subtitle:'Sign in with your phone number or email.',phone:'Phone',email:'Email',phoneLabel:'Phone number',emailLabel:'Email address',continue:'Continue',privacy:"By continuing, you agree to MIRA's Terms and Privacy Policy.",bottom:'New to MIRA? <a href="signup.html">Sign Up</a>',alertPhone:'Enter your phone number',alertEmail:'Enter your email'},ar:{title:'أهلاً برجعتك',subtitle:'سجّل دخولك برقم الهاتف أو البريد الإلكتروني.',phone:'الهاتف',email:'الإيميل',phoneLabel:'رقم الهاتف',emailLabel:'البريد الإلكتروني',continue:'متابعة',privacy:'بالمتابعة أنت توافق على شروط الاستخدام وسياسة الخصوصية في MIRA.',bottom:'جديد على MIRA؟ <a href="signup.html">إنشاء حساب</a>',alertPhone:'اكتب رقم الهاتف',alertEmail:'اكتب البريد الإلكتروني'},es:{title:'Bienvenido de nuevo',subtitle:'Inicia sesión con tu número de teléfono o correo.',phone:'Teléfono',email:'Correo',phoneLabel:'Número de teléfono',emailLabel:'Correo electrónico',continue:'Continuar',privacy:'Al continuar, aceptas los Términos y la Política de privacidad de MIRA.',bottom:'¿Nuevo en MIRA? <a href="signup.html">Crear cuenta</a>',alertPhone:'Introduce tu número',alertEmail:'Introduce tu correo'},ru:{title:'С возвращением',subtitle:'Войдите с номером телефона или электронной почтой.',phone:'Телефон',email:'Почта',phoneLabel:'Номер телефона',emailLabel:'Эл. почта',continue:'Продолжить',privacy:'Продолжая, вы соглашаетесь с Условиями и Политикой конфиденциальности MIRA.',bottom:'Впервые в MIRA? <a href="signup.html">Регистрация</a>',alertPhone:'Введите номер телефона',alertEmail:'Введите электронную почту'},tr:{title:'Tekrar hoş geldin',subtitle:'Telefon numaran veya e-postan ile giriş yap.',phone:'Telefon',email:'E-posta',phoneLabel:'Telefon numarası',emailLabel:'E-posta adresi',continue:'Devam et',privacy:'Devam ederek MIRA Kullanım Şartları ve Gizlilik Politikasını kabul edersin.',bottom:'MIRA’da yeni misin? <a href="signup.html">Kayıt Ol</a>',alertPhone:'Telefon numaranı gir',alertEmail:'E-posta adresini gir'}};
function setLang(lang){localStorage.setItem('mira_lang',lang);document.getElementById('authApp').dataset.lang=lang;document.querySelectorAll('.languages button').forEach(b=>{const on=b.dataset.lang===lang;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on?'true':'false')});const t=T[lang]||T.en;const rtl=lang==='ar';document.documentElement.lang=lang;document.documentElement.dir=rtl?'rtl':'ltr';document.getElementById('title').textContent=t.title;document.getElementById('subtitle').textContent=t.subtitle;document.getElementById('phoneTab').textContent=t.phone;document.getElementById('emailTab').textContent=t.email;document.getElementById('phoneLabel').textContent=t.phoneLabel;document.getElementById('emailLabel').textContent=t.emailLabel;document.getElementById('continuePhone').textContent=t.continue;document.getElementById('continueEmail').textContent=t.continue;document.getElementById('privacy').textContent=t.privacy;document.getElementById('bottom').setAttribute('aria-label',lang==='ar'?'إنشاء حساب':'Create account');document.getElementById('bottom').innerHTML=t.bottom;}
setLang(localStorage.getItem('mira_lang')||'en');
</script>
</body>
</html>
