<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f45a8f"><title>MIRA — Sign In</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--pink:#FF4D8D;--pink2:#FF7EB6;--peach:#FFC8A1;--blue:#6EC6FF;--ink:#A62C63;--muted:#B86A8E;--line:rgba(255,255,255,.62)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#f45a8f}body{display:flex;justify-content:center}.app{position:relative;width:min(100vw,430px);min-height:100svh;overflow:hidden;background:radial-gradient(circle at 90% 10%,rgba(110,198,255,.92),transparent 30%),radial-gradient(circle at 5% 15%,rgba(255,200,161,.72),transparent 32%),linear-gradient(160deg,#ff8190 0%,#ff4d8d 48%,#ff748b 100%);padding:calc(18px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom))}.langbar{display:flex;gap:6px;direction:ltr;padding:6px;border:1px solid rgba(255,255,255,.45);border-radius:999px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px)}.langbar button{flex:1;border:1px solid rgba(255,255,255,.78);background:transparent;color:#fff;border-radius:999px;padding:9px 4px;font:600 10.8px Poppins}.langbar button.active{background:#fff;color:#D93679;border-color:#fff}.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0 14px}.icon{width:68px;height:68px;background:url('assets/mira_icon.svg') center/contain no-repeat}.wordmark{width:125px;height:40px;background:#fff;-webkit-mask:url('assets/mira_wordmark.svg') center/contain no-repeat;mask:url('assets/mira_wordmark.svg') center/contain no-repeat}.card{margin-top:10px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.62);border-radius:28px;padding:22px 18px;backdrop-filter:blur(14px);box-shadow:0 18px 45px rgba(128,26,76,.16)}h1{margin:0;text-align:center;color:#fff;font-size:30px;line-height:1.15;font-weight:800}.sub{margin:8px auto 22px;text-align:center;color:#fff;font-size:14px;line-height:1.5;max-width:320px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.55);border-radius:17px;padding:4px}.tab{border:0;background:transparent;border-radius:13px;padding:12px 8px;font:600 14px Poppins;color:#fff}.tab.active{background:#fff;color:var(--pink)}.panel{display:none;margin-top:18px}.panel.active{display:block}.label{display:block;color:#fff;font-size:13px;font-weight:600;margin:0 0 8px}.row{display:flex;gap:9px}.code,.input{border:1px solid rgba(255,255,255,.65);background:rgba(255,255,255,.88);color:var(--ink);border-radius:16px;font-family:inherit}.code{width:108px;padding:0 10px;font-size:14px;font-weight:600}.input{width:100%;padding:15px 14px;outline:none;font-size:15px}.input::placeholder{color:#C27799}.primary{width:100%;margin-top:18px;border:0;border-radius:17px;padding:15px 16px;background:#fff;color:var(--pink);font:800 16px Poppins;box-shadow:0 10px 24px rgba(128,26,76,.12)}.privacy{text-align:center;color:#fff;font-size:11px;line-height:1.45;margin:14px 8px 0;opacity:.9}.bottom{text-align:center;color:#fff;font-size:14px;margin-top:18px}.bottom a{color:#fff;font-weight:800;text-decoration:underline}.footer{margin-top:18px;text-align:center}.footer img{width:160px;max-height:40px;filter:brightness(0) invert(1);opacity:.96}[dir=rtl] .label{text-align:right}</style></head><body><main class="app"><div class="langbar" id="langbar"></div><div class="brand"><div class="icon"></div><div class="wordmark"></div></div><section class="card"><h1 id="title"></h1><p class="sub" id="subtitle"></p><div class="tabs"><button class="tab active" id="phoneTab" onclick="showTab('phone')"></button><button class="tab" id="emailTab" onclick="showTab('email')"></button></div><div class="panel active" id="phonePanel"><label class="label" id="phoneLabel"></label><div class="row"><select class="code" id="code"><option>🇮🇶 +964</option><option>🇰🇼 +965</option><option>🇸🇦 +966</option><option>🇧🇭 +973</option><option>🇶🇦 +974</option><option>🇦🇪 +971</option><option>🇴🇲 +968</option><option>🇯🇴 +962</option><option>🇱🇧 +961</option><option>🇵🇸 +970</option><option>🇪🇬 +20</option><option>🇺🇸 +1</option><option>🇨🇦 +1</option><option>🇦🇺 +61</option><option>🇬🇧 +44</option><option>🇮🇹 +39</option><option>🇩🇪 +49</option><option>🇫🇷 +33</option><option>🇳🇱 +31</option><option>🇫🇮 +358</option><option>🇧🇪 +32</option><option>🇦🇹 +43</option><option>🇸🇪 +46</option></select><input class="input" id="phone" type="tel" inputmode="tel"></div><button class="primary" id="continuePhone" onclick="goOtp('phone')"></button></div><div class="panel" id="emailPanel"><label class="label" id="emailLabel"></label><input class="input" id="email" type="email" inputmode="email"><button class="primary" id="continueEmail" onclick="goOtp('email')"></button></div><p class="privacy" id="privacy"></p><div class="bottom" id="bottom"></div></section><div class="footer"><img src="assets/asas_footer.svg" alt="Powered by ASAS 360°"></div></main><script>
const labels=[["en","English"],["ar","العربية"],["es","Español"],["ru","Русский"],["tr","Türkçe"]];const T={en:{title:"Welcome back",subtitle:"Sign in to continue and explore your personalized offers.",phone:"Phone",email:"Email",phoneLabel:"Phone number",emailLabel:"Email address",cont:"Continue",privacy:"By continuing, you agree to MIRA's Terms and Privacy Policy.",bottom:'New to MIRA? <a href="signup.html">Sign Up</a>',phPhone:"7XX XXX XXXX",phEmail:"name@example.com"},ar:{title:"مرحباً بعودتك",subtitle:"سجّل الدخول للمتابعة واكتشاف العروض المخصصة لك.",phone:"الهاتف",email:"البريد الإلكتروني",phoneLabel:"رقم الهاتف",emailLabel:"البريد الإلكتروني",cont:"متابعة",privacy:"بالمتابعة أنت توافق على شروط الاستخدام وسياسة الخصوصية في MIRA.",bottom:'جديد في MIRA؟ <a href="signup.html">إنشاء حساب</a>',phPhone:"7XX XXX XXXX",phEmail:"name@example.com"},es:{title:"Bienvenido de nuevo",subtitle:"Inicia sesión para continuar y descubrir tus ofertas personalizadas.",phone:"Teléfono",email:"Correo electrónico",phoneLabel:"Número de teléfono",emailLabel:"Correo electrónico",cont:"Continuar",privacy:"Al continuar, aceptas los Términos y la Política de Privacidad de MIRA.",bottom:'¿Nuevo en MIRA? <a href="signup.html">Crear cuenta</a>',phPhone:"Número de teléfono",phEmail:"nombre@ejemplo.com"},ru:{title:"С возвращением",subtitle:"Войдите, чтобы продолжить и открыть персональные предложения.",phone:"Телефон",email:"Электронная почта",phoneLabel:"Номер телефона",emailLabel:"Электронная почта",cont:"Продолжить",privacy:"Продолжая, вы соглашаетесь с Условиями и Политикой конфиденциальности MIRA.",bottom:'Впервые в MIRA? <a href="signup.html">Регистрация</a>',phPhone:"Номер телефона",phEmail:"name@example.com"},tr:{title:"Tekrar hoş geldin",subtitle:"Devam etmek ve sana özel fırsatları keşfetmek için giriş yap.",phone:"Telefon",email:"E-posta",phoneLabel:"Telefon numarası",emailLabel:"E-posta adresi",cont:"Devam et",privacy:"Devam ederek MIRA'nın Koşullarını ve Gizlilik Politikasını kabul edersiniz.",bottom:'MIRA’da yeni misin? <a href="signup.html">Kayıt Ol</a>',phPhone:"Telefon numarası",phEmail:"ad@ornek.com"}};function renderLangs(lang){langbar.innerHTML=labels.map(([c,l])=>`<button class="${c===lang?'active':''}" onclick="setLang('${c}')">${l}</button>`).join('')}function showTab(w){let p=w==='phone';phonePanel.classList.toggle('active',p);emailPanel.classList.toggle('active',!p);phoneTab.classList.toggle('active',p);emailTab.classList.toggle('active',!p)}function goOtp(type){let v=type==='phone'?phone.value.trim():email.value.trim();if(!v)return;location.href='otp.html?via='+encodeURIComponent(type)}function setLang(lang){localStorage.setItem('mira_lang',lang);applyLang(lang)}function applyLang(lang){let t=T[lang]||T.en;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';title.textContent=t.title;subtitle.textContent=t.subtitle;phoneTab.textContent=t.phone;emailTab.textContent=t.email;phoneLabel.textContent=t.phoneLabel;emailLabel.textContent=t.emailLabel;continuePhone.textContent=t.cont;continueEmail.textContent=t.cont;privacy.textContent=t.privacy;bottom.innerHTML=t.bottom;phone.placeholder=t.phPhone;email.placeholder=t.phEmail;renderLangs(lang)}applyLang(localStorage.getItem('mira_lang')||'en');</script></body></html>
