<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MIRA — Checkout</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--p:#FC618F;--p2:#800020;--pe:#800020;--berry:#FFFFFF;--fog:#800020;--snow:#800020;--line:#800020;--mira:#FC618F;--ok:#800020;--danger:#FC618F}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--fog);color:var(--berry)}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100svh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));background:var(--snow)}.top{display:flex;align-items:center;justify-content:space-between}.back{border:0;background:var(--snow);width:42px;height:42px;border-radius:14px;color:var(--p);font-size:25px;box-shadow:0 8px 22px #800020}.brandmark{width:105px;height:34px;background:var(--mira);-webkit-mask:url('assets/mira_wordmark.svg') center/contain no-repeat;mask:url('assets/mira_wordmark.svg') center/contain no-repeat}.spacer{width:42px}.title{font-size:28px;font-weight:800;margin:24px 0 4px}.sub{color:var(--p);font-size:12px;margin-bottom:17px}.card{border:1px solid var(--line);background:var(--snow);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:0 8px 24px #800020}.field{margin-top:10px}.field label{font-size:10px;font-weight:700;display:block;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--snow);color:var(--berry);font:500 12px Poppins;outline:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.summary{font-size:11px;color:var(--p);line-height:1.7}.summary b{color:var(--berry)}.primary,.secondary{width:100%;border-radius:16px;padding:14px;margin-top:11px;font:700 13px Poppins}.primary{border:0;background:linear-gradient(90deg,var(--p),var(--p2),var(--pe));color:var(--snow)}.secondary{border:1px solid var(--line);background:var(--snow);color:var(--berry)}.msg{font-size:11px;color:var(--danger);min-height:18px;margin-top:8px}.notice{border-radius:14px;background:var(--pe);padding:11px 12px;color:var(--berry);font-size:10px;margin-bottom:12px}[dir=rtl] .card{text-align:right}</style><link rel="stylesheet" href="mira-pink-theme.css?v=20261008-white-pastel"></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()">‹</button><div class="brandmark" aria-label="MIRA"></div><div class="spacer"></div></div><div class="title" id="pageTitle"></div><div class="sub" id="pageSub"></div><div class="notice" id="authNotice"></div><section class="card"><div class="field"><label id="nameLabel"></label><input id="customerName" autocomplete="name"></div><div class="grid"><div class="field"><label id="phone1Label"></label><input id="phonePrimary" type="tel" autocomplete="tel"></div><div class="field"><label id="phone2Label"></label><input id="phoneSecondary" type="tel"></div></div><div class="grid"><div class="field"><label id="govLabel"></label><input id="governorate"></div><div class="field"><label id="areaLabel"></label><input id="area"></div></div><div class="field"><label id="addressLabel"></label><textarea id="fullAddress" rows="3"></textarea></div><div class="field"><label id="noteLabel"></label><input id="customerNote"></div></section><section class="card"><div class="summary" id="orderSummary"></div><button class="primary" id="confirmBtn"></button><button class="secondary" onclick="location.href='cart.html'" id="backCart"></button><div class="msg" id="msg"></div></section></main><script src="mira-cloud.js?v=20261007-checkout"></script><script>
const lang=localStorage.getItem('mira_lang')||'en',ar=lang==='ar';document.documentElement.lang=lang;document.documentElement.dir=ar?'rtl':'ltr';
const T=ar?{title:'إكمال الطلب',sub:'أكد بيانات التوصيل. راح ينرسل طلب منفصل لكل تاجر إذا السلة بيها أكثر من متجر.',auth:'أنت مسجل الدخول. ما نسمح بإرسال طلبات Guest.',name:'اسم الزبون',p1:'رقم التلفون الأساسي',p2:'رقم التلفون الاحتياطي',gov:'المحافظة / الولاية',area:'المنطقة',address:'العنوان الكامل',note:'ملاحظات للتاجر (اختياري)',confirm:'تأكيد الطلب',cart:'الرجوع للسلة',total:'المجموع',merchants:'عدد التجار'}:{title:'Checkout',sub:'Confirm your delivery details. If your cart contains more than one merchant, MIRA creates a separate order for each merchant.',auth:'You are signed in. Guest orders are not allowed.',name:'Customer name',p1:'Primary phone',p2:'Backup phone',gov:'Governorate / State',area:'Area / District',address:'Full address',note:'Merchant notes (optional)',confirm:'Confirm order',cart:'Back to cart',total:'Total',merchants:'Merchants'};
pageTitle.textContent=T.title;pageSub.textContent=T.sub;authNotice.textContent=T.auth;nameLabel.textContent=T.name;phone1Label.textContent=T.p1;phone2Label.textContent=T.p2;govLabel.textContent=T.gov;areaLabel.textContent=T.area;addressLabel.textContent=T.address;noteLabel.textContent=T.note;confirmBtn.textContent=T.confirm;backCart.textContent=T.cart;
function cart(){try{return JSON.parse(localStorage.getItem('mira_cart')||'[]')}catch(e){return[]}}
function money(v){return Number(v||0).toLocaleString(ar?'ar-IQ':undefined)+' IQD'}
function groups(){const out={};cart().forEach(x=>{const k=x.storeId||'unknown';(out[k]=out[k]||{storeId:k,storeName:x.storeName||'MIRA Merchant',items:[]}).items.push(x)});return Object.values(out)}
function renderSummary(){const rows=cart(),gs=groups(),total=rows.reduce((n,x)=>n+Number(x.unitPrice||0)*(x.quantity||1),0);orderSummary.innerHTML='<b>'+T.total+':</b> '+money(total)+'<br><b>'+T.merchants+':</b> '+gs.length+'<br>'+gs.map(g=>'<b>'+g.storeName+':</b> '+g.items.reduce((n,x)=>n+(x.quantity||1),0)+' item(s)').join('<br>')}
async function boot(){const p=MiraCloud.payload();if(!p||p.role!=='authenticated'||!p.sub){sessionStorage.setItem('mira_auth_return','checkout.html');location.href='signin.html?return='+encodeURIComponent('checkout.html');return}try{await MiraCloud.ensureFreshSession()}catch(e){}const u=MiraCloud.session?.user||{},meta=u.user_metadata||{},saved=JSON.parse(localStorage.getItem('mira_checkout')||'{}');customerName.value=saved.name||meta.full_name||localStorage.getItem('mira_profile_name')||'';phonePrimary.value=saved.phone1||u.phone||'';phoneSecondary.value=saved.phone2||'';governorate.value=saved.governorate||'';area.value=saved.area||'';fullAddress.value=saved.address||'';customerNote.value=saved.note||'';if(!cart().length)location.href='cart.html';renderSummary()}
confirmBtn.onclick=async()=>{msg.style.color='var(--danger)';msg.textContent=ar?'جاري إرسال الطلب…':'Sending order…';confirmBtn.disabled=true;try{const p=MiraCloud.requireAuth();await MiraCloud.ensureFreshSession();const d={name:customerName.value.trim(),phone1:phonePrimary.value.trim(),phone2:phoneSecondary.value.trim(),governorate:governorate.value.trim(),area:area.value.trim(),address:fullAddress.value.trim(),note:customerNote.value.trim()};if(!d.name||!d.phone1||!d.governorate||!d.area||!d.address)throw new Error(ar?'كمّل الاسم والرقم الأساسي والمحافظة والمنطقة والعنوان.':'Complete name, primary phone, governorate/state, area and full address.');localStorage.setItem('mira_checkout',JSON.stringify(d));for(const g of groups()){const items=g.items.map(x=>({offer_id:x.offerId,title:x.title||'Item',quantity:x.quantity||1,unit_price:Number(x.unitPrice||0),total:Number(x.unitPrice||0)*(x.quantity||1),attributes:x.attributes||{}})),subtotal=items.reduce((n,x)=>n+x.total,0),payload={customer_user_id:p.sub,store_id:g.storeId,offer_id:items[0]?.offer_id||null,customer_name:d.name,phone_primary:d.phone1,phone_secondary:d.phone2||null,governorate_city:d.governorate,full_address:d.address,landmark:d.area,customer_note:d.note||null,items,subtotal,total:subtotal,currency:'IQD',status:'new'};await MiraCloud.request('mira_orders',{method:'POST',requireAuth:true,body:JSON.stringify(payload)})}localStorage.setItem('mira_cart','[]');msg.style.color='var(--ok)';msg.textContent=ar?'تم تأكيد الطلب بنجاح.':'Order confirmed successfully.';setTimeout(()=>location.href='orders.html',650)}catch(e){msg.textContent=e.message||String(e);confirmBtn.disabled=false}};
boot();
</script></body></html>
