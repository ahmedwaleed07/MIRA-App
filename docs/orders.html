<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FC618F"><title>MIRA — My Orders</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--pink:#FC618F;--pink2:#800020;--peach:#800020;--blue:#FFFFFF;--ink:#FFFFFF;--muted:#FC618F;--line:#800020;--bg:#800020;--ok:#800020;--danger:#FC618F}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100svh;background:radial-gradient(circle at 8% 0%,#800020,transparent 25%),radial-gradient(circle at 100% 5%,#800020,transparent 28%),linear-gradient(180deg,#800020,#800020 48%,#800020);padding:calc(14px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.back,.refresh{border:0;background:#800020;width:42px;height:42px;border-radius:14px;color:var(--pink);box-shadow:0 8px 22px #800020;font:700 18px Poppins}.refresh{font-size:17px}.brandmark{width:110px;height:35px;background:#FC618F;-webkit-mask:url('assets/mira_wordmark.svg') center/contain no-repeat;mask:url('assets/mira_wordmark.svg') center/contain no-repeat}.title{margin-top:22px;font-size:25px;font-weight:800}.subtitle{margin-top:3px;color:var(--muted);font-size:11px;line-height:1.5}.orders{display:grid;gap:14px;margin-top:18px}.card{background:#800020;border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:0 12px 30px #800020}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.order-id{font-size:11px;font-weight:800}.time{font-size:9px;color:var(--muted);margin-top:2px}.updated{margin-top:10px;font-size:9px;color:var(--muted);text-align:end}.current-state{margin-top:12px;padding:11px 12px;border-radius:14px;background:linear-gradient(135deg,#800020,#800020);border:1px solid var(--line);font-size:10px;color:var(--muted)}.current-state b{display:block;color:var(--pink);font-size:12px;margin-top:2px}.status{font-size:10px;font-weight:800;padding:6px 9px;border-radius:999px;background:#800020;color:var(--pink);white-space:nowrap}.status.cancelled{background:#800020;color:var(--danger)}.store{margin-top:13px;font-size:15px;font-weight:800}.items{margin-top:6px;font-size:10.5px;color:var(--muted);line-height:1.55}.total{margin-top:10px;padding:9px 11px;border-radius:13px;background:#800020;font-size:11px}.total b{color:var(--ink)}.delivery{margin-top:10px;font-size:10px;color:var(--muted);line-height:1.55}.progress{display:grid;gap:7px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.step{display:flex;gap:9px;align-items:center;font-size:10px;color:#800020}.dot{width:10px;height:10px;border-radius:50%;background:#800020;flex:0 0 auto}.step.done{color:var(--ink);font-weight:700}.step.done .dot{background:var(--pink)}.step.current{color:var(--pink);font-weight:800}.step.current .dot{box-shadow:0 0 0 4px #FC618F}.empty,.error{margin-top:18px;background:#800020;border:1px dashed var(--line);border-radius:18px;padding:24px 15px;text-align:center;color:var(--muted);font-size:11px}.error{color:var(--danger)}[dir=rtl] .head{text-align:right}
</style><link rel="stylesheet" href="mira-pink-theme.css?v=20261008-luxe-contrast-2"></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()" aria-label="Back">‹</button><div class="brandmark" aria-label="MIRA"></div><button class="refresh" id="refreshBtn" aria-label="Refresh">↻</button></div><div class="title" id="pageTitle"></div><div class="subtitle" id="pageSub"></div><div class="orders" id="orders"></div></main><script src="mira-cloud.js?v=20261009-cross-tab-remember-1"></script><script src="mira-auth-flow.js?v=20261009-notification-return-3"></script><script>
const T={
 en:{title:'My Orders',sub:'Follow your MIRA orders and current status.',empty:'You do not have any orders yet.',received:'Order received',accepted:'Confirmed',preparing:'Preparing',ready:'Shipped',delivery:'Out for delivery',completed:'Delivered',cancelled:'Cancelled',total:'Total',landmark:'Area / District',current:'Current status',updated:'Last updated'},
 ar:{title:'طلباتي',sub:'تابع طلباتك في MIRA واعرف حالة الطلب الحالية.',empty:'ما عندك طلبات لحد الآن.',received:'تم استلام الطلب',accepted:'تم تأكيد الطلب',preparing:'قيد التحضير',ready:'تم الشحن',delivery:'بالطريق إليك',completed:'تم التسليم',cancelled:'ملغي',total:'المجموع',landmark:'المنطقة',current:'حالة الطلب الحالية',updated:'آخر تحديث'},
 es:{title:'Mis pedidos',sub:'Sigue tus pedidos y su estado actual.',empty:'Aún no tienes pedidos.',received:'Pedido recibido',accepted:'Confirmado',preparing:'Preparando',ready:'Enviado',delivery:'En reparto',completed:'Entregado',cancelled:'Cancelado',total:'Total',landmark:'Zona / distrito',current:'Estado actual',updated:'Última actualización'},
 ru:{title:'Мои заказы',sub:'Следите за заказами MIRA и их статусом.',empty:'У вас пока нет заказов.',received:'Заказ получен',accepted:'Подтверждён',preparing:'Готовится',ready:'Отправлен',delivery:'В доставке',completed:'Доставлен',cancelled:'Отменён',total:'Итого',landmark:'Район',current:'Текущий статус',updated:'Последнее обновление'},
 tr:{title:'Siparişlerim',sub:'MIRA siparişlerini ve güncel durumlarını takip et.',empty:'Henüz siparişin yok.',received:'Sipariş alındı',accepted:'Onaylandı',preparing:'Hazırlanıyor',ready:'Gönderildi',delivery:'Teslimatta',completed:'Teslim edildi',cancelled:'İptal edildi',total:'Toplam',landmark:'Bölge / semt',current:'Güncel durum',updated:'Son güncelleme'}
};
const lang=localStorage.getItem('mira_lang')||'en',t=T[lang]||T.en;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';pageTitle.textContent=t.title;pageSub.textContent=t.sub;
const statusLabel={new:t.received,accepted:t.accepted,preparing:t.preparing,ready:t.ready,out_for_delivery:t.delivery,completed:t.completed,cancelled:t.cancelled};
const flow=['new','accepted','preparing','ready','out_for_delivery','completed'];
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#800020;'}[m]))}
function fmtDate(v){if(!v)return'';return new Intl.DateTimeFormat(lang==='ar'?'ar-IQ':lang,{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(v))}
function itemsText(o){const a=Array.isArray(o.items)?o.items:[];return a.map(i=>esc((i.title||'Item')+' × '+(i.quantity||1))).join('<br>')||'—'}
function progress(o){if(o.status==='cancelled')return '<div class="step current"><span class="dot"></span>'+esc(t.cancelled)+'</div>';const idx=Math.max(0,flow.indexOf(o.status));return flow.map((s,i)=>'<div class="step '+(i<idx?'done':i===idx?'done current':'')+'"><span class="dot"></span>'+esc(statusLabel[s])+'</div>').join('')}
async function loadOrders(){
 orders.innerHTML='<div class="empty">…</div>';
 let user=null;
 try{user=await MiraAuthFlow.getVerifiedCustomer()}catch(e){console.warn('Orders session check:',e.message)}
 if(!user){
  MiraAuthFlow.setReturn('orders.html');
  location.href='signin.html?return='+encodeURIComponent('orders.html');
  return;
 }
 try{
  const p=MiraCloud.requireAuth();
  const [rows,stores]=await Promise.all([
   MiraCloud.request('mira_orders?customer_user_id=eq.'+encodeURIComponent(p.sub)+'&select=id,store_id,offer_id,items,total,currency,status,governorate_city,full_address,landmark,created_at,updated_at&order=created_at.desc',{requireAuth:true}),
   MiraCloud.list('store')
  ]);
  if(!rows.length){orders.innerHTML='<div class="empty">'+esc(t.empty)+'</div>';return}
  orders.innerHTML=rows.map(o=>{const s=stores.find(x=>x.id===o.store_id),st=statusLabel[o.status]||o.status,total=Number(o.total||0).toLocaleString(lang==='ar'?'ar-IQ':undefined);return '<section class="card"><div class="head"><div><div class="order-id">#'+esc(String(o.id).slice(0,8).toUpperCase())+'</div><div class="time">'+esc(fmtDate(o.created_at))+'</div></div><span class="status '+(o.status==='cancelled'?'cancelled':'')+'">'+esc(st)+'</span></div><div class="store">'+esc(s?s.name:o.store_id)+'</div><div class="items">'+itemsText(o)+'</div><div class="total"><b>'+esc(t.total)+':</b> '+esc(total)+' '+esc(o.currency||'IQD')+'</div><div class="delivery">'+esc([o.governorate_city,o.full_address].filter(Boolean).join(' · '))+(o.landmark?'<br>'+esc(t.landmark)+': '+esc(o.landmark):'')+'</div><div class="current-state">'+esc(t.current)+'<b>'+esc(st)+'</b></div><div class="progress">'+progress(o)+'</div><div class="updated">'+esc(t.updated)+': '+esc(fmtDate(o.updated_at||o.created_at))+'</div></section>'}).join('');
 }catch(e){orders.innerHTML='<div class="error">'+esc(e.message||String(e))+'</div>'}
}
refreshBtn.onclick=loadOrders;loadOrders();setInterval(()=>{if(document.visibilityState==='visible')loadOrders()},15000);
</script></body></html>
