onst item=e.target.closest('.item');if(!item)return;if(item.dataset.type==='category'){location.href='category.html?cat='+encodeURIComponent(item.dataset.slug);return}const name=decodeURIComponent(item.dataset.name),discount=decodeURIComponent(item.dataset.discount),letter=decodeURIComponent(item.dataset.letter),type=item.dataset.type,id=item.dataset.id||[type,name,discount].join('-').toLowerCase().replace(/[^a-z0-9]+/g,'-'),storeId=item.dataset.storeId||'';if(type==='store'){location.href='store.html?id='+encodeURIComponent(id);return}location.href='offer.html?'+new URLSearchParams({id,type,name,discount,letter,storeId}).toString()};q.value=new URLSearchParams(location.search).get('q')||'';render();</script><script src="mira-favorites.js?v=20261008-cards"></script></body></html>
