<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MIRA — Edit Profile</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--pink:#FF4D8D;--pink2:#FF7EB6;--ink:#A62C63;--muted:#B86A8E;--line:#F0DCE6;--bg:#fff8fb;--mira:#D94F8A}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100svh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));background:radial-gradient(circle at 0 0,rgba(255,126,182,.15),transparent 27%),radial-gradient(circle at 100% 7%,rgba(110,198,255,.14),transparent 28%),#fff}.top{display:flex;align-items:center;justify-content:space-between}.back{border:0;background:#fff;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--pink);box-shadow:0 8px 22px rgba(92,50,76,.08)}.back svg{width:22px}.brandmark{width:108px;height:35px;background:var(--mira);-webkit-mask:url('assets/mira_wordmark.svg') center/contain no-repeat;mask:url('assets/mira_wordmark.svg') center/contain no-repeat}.spacer{width:42px}.title{font-size:25px;font-weight:800;margin-top:24px}.sub{font-size:11px;color:var(--muted);margin-top:5px}.card{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:17px;box-shadow:0 12px 30px rgba(92,50,76,.06)}.field{margin-top:13px}.field:first-child{margin-top:0}.field label{display:block;font-size:10px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;font:500 12px Poppins;color:var(--ink);outline:0}.save{margin-top:18px;width:100%;border:0;border-radius:15px;padding:13px;background:linear-gradient(90deg,var(--pink),var(--pink2));color:#fff;font:700 12px Poppins}.note{margin-top:12px;font-size:9.5px;line-height:1.55;color:var(--muted)}</style></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><div class="brandmark" aria-label="MIRA"></div><div class="spacer"></div></div><div class="title" id="title"></div><div class="sub" id="sub"></div><div class="card"><div class="field"><label id="nameLabel"></label><input id="nameInput" autocomplete="name"></div><div class="field"><label id="genderLabel"></label><select id="genderInput"></select></div><div class="field"><label id="dobLabel"></label><input id="dobInput" type="date"></div><button class="save" id="saveBtn"></button><div class="note" id="note"></div></div></main><script>const l=localStorage.getItem('mira_lang')||'en';document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';const T={en:{title:'Edit Profile',sub:'Update the personal details used in your MIRA profile.',name:'Full name',gender:'Gender',dob:'Date of birth',save:'Save changes',note:'These prototype details are stored only on this device.',male:'Male',female:'Female',prefer:'Prefer not to say'},ar:{title:'تعديل الحساب',sub:'حدّث بياناتك الشخصية المستخدمة داخل حساب MIRA.',name:'الاسم الكامل',gender:'الجنس',dob:'تاريخ الميلاد',save:'حفظ التغييرات',note:'هذه البيانات التجريبية تُحفظ على هذا الجهاز فقط.',male:'ذكر',female:'أنثى',prefer:'أفضل عدم الإجابة'},es:{title:'Editar perfil',sub:'Actualiza los datos personales de tu perfil MIRA.',name:'Nombre completo',gender:'Género',dob:'Fecha de nacimiento',save:'Guardar cambios',note:'Estos datos del prototipo se guardan solo en este dispositivo.',male:'Hombre',female:'Mujer',prefer:'Prefiero no decirlo'},ru:{title:'Изменить профиль',sub:'Обновите данные профиля MIRA.',name:'Полное имя',gender:'Пол',dob:'Дата рождения',save:'Сохранить',note:'Эти данные прототипа хранятся только на этом устройстве.',male:'Мужской',female:'Женский',prefer:'Не указывать'},tr:{title:'Profili Düzenle',sub:'MIRA profilindeki kişisel bilgileri güncelle.',name:'Ad soyad',gender:'Cinsiyet',dob:'Doğum tarihi',save:'Değişiklikleri kaydet',note:'Bu prototip bilgileri yalnızca bu cihazda saklanır.',male:'Erkek',female:'Kadın',prefer:'Belirtmek istemiyorum'}};const t=T[l]||T.en;title.textContent=t.title;sub.textContent=t.sub;nameLabel.textContent=t.name;genderLabel.textContent=t.gender;dobLabel.textContent=t.dob;saveBtn.textContent=t.save;note.textContent=t.note;genderInput.innerHTML=`<option value="male">${t.male}</option><option value="female">${t.female}</option><option value="prefer">${t.prefer}</option>`;nameInput.value=localStorage.getItem('mira_profile_name')||'';genderInput.value=localStorage.getItem('mira_profile_gender')||'prefer';dobInput.value=localStorage.getItem('mira_profile_dob')||'';saveBtn.onclick=()=>{const n=nameInput.value.trim();if(n)localStorage.setItem('mira_profile_name',n);else localStorage.removeItem('mira_profile_name');localStorage.setItem('mira_profile_gender',genderInput.value);if(dobInput.value)localStorage.setItem('mira_profile_dob',dobInput.value);else localStorage.removeItem('mira_profile_dob');location.href='profile.html'};</script></body></html>
