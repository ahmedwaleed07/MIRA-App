<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FF4D8D"><title>MIRA</title><style>:root{--p:#FF4D8D;--p2:#FF7EB6;--pe:#FFC8A1;--sky:#6EC6FF;--soft:#fff7fb;--bg:#f6f7fb;--ink:#202230;--muted:#7b7f8d;--line:#e8e9ef}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.app{width:min(100%,430px);min-height:100svh;margin:auto;background:var(--bg);overflow:hidden}.screen{display:none;min-height:100svh;padding-bottom:86px}.screen.active{display:block}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#fffffff2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.logo{width:36px;height:36px;border-radius:10px;object-fit:cover}.grow{flex:1}.top h3{margin:0}.back,.icon{width:40px;height:40px;border:0;border-radius:50%;background:#f0f1f5}.content{padding:17px}.title{font-size:28px;line-height:1.08;margin:8px 0}.sub{color:var(--muted);margin:0 0 16px}.card,.item,.offer,.kpi{background:#fff;border:1px solid #ededf3;border-radius:20px;box-shadow:0 8px 24px #211c3b0a}.card{padding:18px}.field{width:100%;height:52px;border:1px solid #dedfe8;border-radius:15px;padding:0 13px;background:#fbfbfd;margin:7px 0}.textarea{height:110px;padding-top:12px}.primary,.secondary{width:100%;height:54px;border-radius:16px;font-weight:850;margin-top:10px}.primary{border:0;color:#fff;background:linear-gradient(90deg,var(--p),var(--p2),var(--pe))}.secondary{border:1px solid #ddd;background:#fff}.tabs{display:flex;gap:6px;background:#eff0f5;padding:4px;border-radius:14px}.tabs button{flex:1;height:40px;border:0;border-radius:11px;background:transparent;font-weight:800}.tabs button.on{background:#fff;color:var(--p)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:11px 13px;border:1px solid #e1e2e9;background:#fff;border-radius:999px;font-weight:800}.chip.on{color:#fff;border-color:transparent;background:linear-gradient(90deg,var(--p),var(--p2))}.banner{padding:20px;border-radius:23px;color:#fff;background:linear-gradient(125deg,var(--p),var(--p2) 48%,var(--sky));margin-bottom:18px}.banner h2{margin:4px 0}.section{display:flex;align-items:center;justify-content:space-between;margin:21px 0 10px}.section h3{margin:0}.offers,.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.offer{overflow:hidden;text-align:left;padding:0}.pic{height:118px;background:linear-gradient(135deg,#ffd2df,#d8efff);display:grid;place-items:center;font-size:48px;position:relative}.badge{position:absolute;top:8px;left:8px;padding:5px 8px;border-radius:999px;background:var(--p);color:#fff;font-size:10px;font-weight:900}.fav{position:absolute;right:8px;top:8px;width:30px;height:30px;border:0;border-radius:50%;background:#fff}.ob{padding:10px}.small{font-size:12px;color:var(--muted)}.price{font-weight:900;color:var(--p)}.old{text-decoration:line-through;color:#999;font-size:11px}.item{display:flex;align-items:center;gap:11px;padding:13px;margin-bottom:9px}.ico{width:44px;height:44px;border-radius:13px;background:#fff0f6;display:grid;place-items:center;font-size:22px}.kpi{padding:15px}.kpi strong{display:block;font-size:22px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);display:grid;grid-template-columns:repeat(5,1fr);z-index:30;background:#fffffff2;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#8b8e98;font-size:10px;font-weight:800}.nav button.on{color:var(--p)}.nav span{display:block;font-size:20px}.map{height:210px;border-radius:21px;background:linear-gradient(145deg,#dcecff,#fce0eb);position:relative;overflow:hidden}.map:before{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(38deg,transparent 0 28px,#fff9 28px 33px)}.pin{position:absolute;font-size:30px}.profile{text-align:center;padding:16px 0}.avatar{width:76px;height:76px;border-radius:24px;margin:auto;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--sky));color:#fff;font-size:28px;font-weight:900}.switch{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.toggle{width:48px;height:28px;border:0;border-radius:99px;background:#ddd;position:relative}.toggle:after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff}.toggle.on{background:var(--p)}.toggle.on:after{left:23px}.notice{padding:12px;border-radius:14px;background:#fff2f7;color:#913a5c;margin-top:12px}.rtl{direction:rtl}.hidden{display:none!important}</style></head><body><main id="app" class="app"></main><script>const $=s=>document.querySelector(s),app=$('#app');const S={lang:'en',auth:'signin',authType:'phone',market:'Iraq',city:'Baghdad',interests:['Men','Electronics','Restaurants'],fav:new Set([2]),follow:new Set([1]),notif:{near:true,flash:true,stores:true,special:true},tab:'home',merchantOffers:3,recent:[1,2,3]};const O=[{id:1,shop:'Samsung House',title:'Neo QLED TV Weekend Deal',emoji:'📺',price:'750,000 IQD',old:'1,000,000',off:'25%',city:'Baghdad',cat:'Electronics'},{id:2,shop:'Urban Men',title:'Premium Sneakers',emoji:'👟',price:'90,000 IQD',old:'150,000',off:'40%',city:'Baghdad',cat:'Men'},{id:3,shop:'Mira Café',title:'Coffee & Dessert Bundle',emoji:'☕',price:'12,000 IQD',old:'18,000',off:'33%',city:'Baghdad',cat:'Restaurants'},{id:4,shop:'Glow Beauty',title:'Weekend Beauty Box',emoji:'💄',price:'45,000 IQD',old:'70,000',off:'36%',city:'Erbil',cat:'Beauty'},{id:5,shop:'Home Line',title:'Kitchen Essentials',emoji:'🏠',price:'65,000 IQD',old:'95,000',off:'32%',city:'Baghdad',cat:'Home'},{id:6,shop:'Kids Planet',title:'Back to School Set',emoji:'🎒',price:'35,000 IQD',old:'55,000',off:'36%',city:'Basra',cat:'Kids'}];function set(x){app.innerHTML=x;scrollTo(0,0)}function brand(){return `<img class="logo" src="assets/mira_icon.svg" alt="MIRA"><b>MIRA</b>`}function top(t,b='home'){return `<header class="top"><button class="back" onclick="${b}()">‹</button>${brand()}<div class="grow"></div><h3>${t}</h3><button class="icon" onclick="notifications()">🔔</button></header>`}function nav(a){return `<nav class="nav">${[['home','⌂','Home'],['explore','⌖','Explore'],['search','⌕','Search'],['favorites','♡','Favorites'],['profile','◉','Profile']].map(x=>`<button class="${a===x[0]?'on':''}" onclick="${x[0]}()"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}function auth(m){S.auth=m;set(`<section class="screen active">${top(m==='signin'?'Sign In':'Sign Up','welcome')}<div class="content"><h1 class="title">${m==='signin'?'Welcome back':'Create your account'}</h1><p class="sub">Use phone number or email.</p><div class="card"><div class="tabs"><button class="${S.authType==='phone'?'on':''}" onclick="S.authType='phone';auth('${m}')">Phone</button><button class="${S.authType==='email'?'on':''}" onclick="S.authType='email';auth('${m}')">Email</button></div>${m==='signup'?'<input class="field" placeholder="Full name">':''}${S.authType==='phone'?'<select class="field"><option>🇮🇶 Iraq +964</option><option>🇦🇪 UAE +971</option><option>🇸🇦 Saudi Arabia +966</option><option>🇹🇷 Türkiye +90</option><option>🇩🇪 Germany +49</option><option>🇨🇦 Canada +1</option><option>🇺🇸 USA +1</option><option>🇬🇧 UK +44</option></select><input class="field" placeholder="7XX XXX XXXX">':'<input class="field" type="email" placeholder="name@example.com">'}<button class="primary" onclick="otp()">Continue</button></div></div></section>`)}function otp(){set(`<section class="screen active">${top('Verification',"()=>auth(S.auth)")}<div class="content"><h1 class="title">Verify your account</h1><p class="sub">Enter the 6-digit verification code.</p><div class="card"><input class="field" inputmode="numeric" maxlength="6" placeholder="123456"><button class="primary" onclick="market()">Verify</button><div class="notice">Didn't get the code? <b>Resend</b></div></div></div></section>`)}function market(){let a=['🇮🇶 Iraq','🇦🇪 UAE','🇸🇦 Saudi Arabia','🇹🇷 Türkiye','🇨🇦 Canada','🇺🇸 United States','🇩🇪 Germany','🇬🇧 United Kingdom'];set(`<section class="screen active">${top('Shopping Market','welcome')}<div class="content"><h1 class="title">Where do you want to shop?</h1><p class="sub">Choose your MIRA market. You can change it anytime.</p><div class="grid2">${a.map(x=>`<button class="secondary" onclick="S.market='${x.replace(/^.. /,'')}';city()">${x}</button>`).join('')}</div></div></section>`)}function city(){let a=S.market==='Iraq'?['Entire Country','Baghdad','Basra','Erbil','Sulaymaniyah','Najaf','Karbala','Mosul']:['Entire Country','Capital City','North Region','South Region'];set(`<section class="screen active">${top('City','market')}<div class="content"><h1 class="title">Where inside ${S.market}?</h1><div class="chips">${a.map(x=>`<button class="chip ${S.city===x?'on':''}" onclick="S.city='${x}';interests()">${x}</button>`).join('')}</div></div></section>`)}function interests(){let a=['Men','Women','Kids','Newborn','Accessories','Jewelry','Home','Electronics','Restaurants','Beauty','Automotive','Entertainment'];set(`<section class="screen active">${top('Interests','city')}<div class="content"><h1 class="title">What are you interested in?</h1><p class="sub">Choose as many as you like.</p><div class="chips">${a.map(x=>`<button class="chip ${S.interests.includes(x)?'on':''}" onclick="toggleInterest('${x}')">${x}</button>`).join('')}</div><button class="primary" onclick="home()">Start exploring</button><button class="secondary" onclick="home()">Skip for now</button></div></section>`)}function toggleInterest(x){S.interests=S.interests.includes(x)?S.interests.filter(i=>i!==x):[...S.interests,x];interests()}function card(o,rer='home'){return `<button class="offer" onclick="detail(${o.id})"><div class="pic"><span class="badge">${o.off} OFF</span><button class="fav" onclick="event.stopPropagation();toggleFav(${o.id});${rer}()">${S.fav.has(o.id)?'♥':'♡'}</button>${o.emoji}</div><div class="ob"><div class="small">${o.shop}</div><b>${o.title}</b><div><span class="price">${o.price}</span> <span class="old">${o.old}</span></div></div></button>`}function toggleFav(id){S.fav.has(id)?S.fav.delete(id):S.fav.add(id)}function home(){S.tab='home';set(`<section class="screen active">${top('Baghdad','home')}<div class="content"><div class="banner"><small>${S.city}, ${S.market}</small><h2>Deals made for you</h2><div>Fresh offers from stores you love.</div></div><div class="section"><h3>Flash Sales</h3><button class="icon" onclick="allOffers()">›</button></div><div class="offers">${O.slice(0,2).map(o=>card(o)).join('')}</div><div class="section"><h3>Shop by Category</h3></div><div class="chips">${['Men','Women','Electronics','Restaurants','Beauty','Home','Kids','Automotive'].map(x=>`<button class="chip" onclick="category('${x}')">${x}</button>`).join('')}</div><div class="section"><h3>Recommended for You</h3></div><div class="offers">${O.slice(2).map(o=>card(o)).join('')}</div></div>${nav('home')}</section>`)}function allOffers(){set(`<section class="screen active">${top('All Offers','home')}<div class="content"><div class="offers">${O.map(o=>card(o,'allOffers')).join('')}</div></div>${nav('home')}</section>`)}function category(c){let r=O.filter(o=>o.cat===c);if(!r.length)r=O;set(`<section class="screen active">${top(c,'home')}<div class="content"><button class="secondary" onclick="filters()">Filters</button><div class="section"><h3>${c} Offers</h3><span class="small">${r.length} results</span></div><div class="offers">${r.map(o=>card(o,`()=>category('${c}')`)).join('')}</div></div>${nav('home')}</section>`)}function detail(id){let o=O.find(x=>x.id===id);S.recent=[id,...S.recent.filter(x=>x!==id)].slice(0,8);set(`<section class="screen active">${top('Offer Details','home')}<div class="content"><div class="pic" style="height:250px;border-radius:22px">${o.emoji}</div><h1 class="title">${o.title}</h1><p class="sub">${o.shop} • ${o.city}</p><div class="kpis"><div class="kpi"><span class="small">Discount</span><strong>${o.off}</strong></div><div class="kpi"><span class="small">Distance</span><strong>2.4 km</strong></div></div><div class="notice">Ends in <b>02:14:36</b></div><div class="map" style="margin-top:14px"><span class="pin" style="left:48%;top:42%">📍</span></div><div class="grid2"><button class="secondary" onclick="alert('Directions')">Directions</button><button class="primary" onclick="alert('WhatsApp')">WhatsApp</button></div><button class="secondary" onclick="storePage(1)">View Store</button><button class="secondary" onclick="reportOffer(${id})">Report Offer</button></div></section>`)}function explore(){S.tab='explore';set(`<section class="screen active">${top('Explore','home')}<div class="content"><div class="map"><span class="pin" style="left:22%;top:28%">📍</span><span class="pin" style="left:60%;top:48%">📍</span><span class="pin" style="left:43%;top:67%">📍</span></div><div class="section"><h3>Offers Near Me</h3><button class="icon" onclick="filters()">☰</button></div>${O.slice(0,4).map(o=>`<div class="item" onclick="detail(${o.id})"><div class="ico">${o.emoji}</div><div class="grow"><b>${o.title}</b><div class="small">${o.shop} • ${o.city}</div></div><b style="color:var(--p)">${o.off}</b></div>`).join('')}</div>${nav('explore')}</section>`)}function filters(){set(`<section class="screen active">${top('Filters','explore')}<div class="content"><div class="card"><select class="field"><option>Nearby</option><option>1 km</option><option>5 km</option><option>10 km</option><option>25 km</option></select><select class="field"><option>Any discount</option><option>20%+</option><option>30%+</option><option>50%+</option></select><select class="field"><option>Recommended</option><option>Nearest</option><option>Biggest Discount</option><option>Newest</option><option>Ending Soon</option></select><button class="primary" onclick="explore()">Apply Filters</button></div></div></section>`)}function search(){S.tab='search';set(`<section class="screen active">${top('Search','home')}<div class="content"><input id="q" class="field" placeholder="Search offers, stores, brands..." oninput="runSearch(this.value)"><div class="chips">${['Samsung','Shoes','Pizza','Perfume','TV','Coffee'].map(x=>`<button class="chip" onclick="q.value='${x}';runSearch('${x}')">${x}</button>`).join('')}</div><div id="results"><div class="section"><h3>Popular Offers</h3></div><div class="offers">${O.slice(0,4).map(o=>card(o,'search')).join('')}</div></div></div>${nav('search')}</section>`)}function runSearch(q){let r=O.filter(o=>(o.title+' '+o.shop+' '+o.cat).toLowerCase().includes(q.toLowerCase()));$('#results').innerHTML=`<div class="section"><h3>Results</h3><span class="small">${r.length}</span></div><div class="offers">${r.map(o=>card(o,'search')).join('')||'<p>No results.</p>'}</div>`}function favorites(){S.tab='favorites';let r=O.filter(o=>S.fav.has(o.id));set(`<section class="screen active">${top('Favorites','home')}<div class="content"><div class="tabs"><button class="on">Saved Offers</button><button onclick="followedStores()">Saved Stores</button></div><div style="height:12px"></div>${r.length?`<div class="offers">${r.map(o=>card(o,'favorites')).join('')}</div>`:'<div class="card"><h3>No saved offers yet.</h3></div>'}</div>${nav('favorites')}</section>`)}function followedStores(){set(`<section class="screen active">${top('Followed Stores','favorites')}<div class="content"><div class="item" onclick="storePage(1)"><div class="ico">S</div><div class="grow"><b>Samsung House</b><div class="small">3 active offers</div></div>›</div></div>${nav('favorites')}</section>`)}function storePage(id){let f=S.follow.has(id);set(`<section class="screen active">${top('Store','home')}<div class="content"><div class="profile"><div class="avatar">S</div><h2>Samsung House ✓</h2><div class="small">Electronics • Baghdad • Open now</div></div><button class="${f?'secondary':'primary'}" onclick="${f?'S.follow.delete(1)':'S.follow.add(1)'};storePage(1)">${f?'Following':'Follow Store'}</button><div class="section"><h3>Current Offers</h3></div><div class="offers">${O.filter(x=>x.cat==='Electronics').map(o=>card(o,'()=>storePage(1)')).join('')}</div><div class="section"><h3>Branches</h3></div><div class="item"><div class="ico">📍</div><div class="grow"><b>Mansour Branch</b><div class="small">10:00 AM – 10:00 PM • 2.4 km</div></div></div></div>${nav('home')}</section>`)}function notifications(){set(`<section class="screen active">${top('Notifications','home')}<div class="content"><div class="item"><div class="ico">⚡</div><div><b>Flash Sale started</b><div class="small">Samsung has a new 25% offer near you.</div></div></div><div class="item"><div class="ico">♥</div><div><b>Favorite store update</b><div class="small">Urban Men published a new offer.</div></div></div><div class="item"><div class="ico">⏳</div><div><b>Ending soon</b><div class="small">Your saved offer ends tonight.</div></div></div></div>${nav(S.tab)}</section>`)}function profile(){S.tab='profile';set(`<section class="screen active">${top('Profile','home')}<div class="content"><div class="profile"><div class="avatar">A</div><h2>MIRA User</h2><div class="small">${S.city}, ${S.market}</div></div>${[['🌍','Shopping Market','market()'],['✨','Shopping Interests','interests()'],['🔔','Notification Settings','notificationSettings()'],['🕘','Recently Viewed','recent()'],['❓','Help & Support','support()'],['🏪','Merchant Portal','merchantPortal()'],['🛡️','Admin Dashboard','admin()']].map(x=>`<div class="item" onclick="${x[2]}"><div class="ico">${x[0]}</div><div class="grow"><b>${x[1]}</b></div>›</div>`).join('')}<div class="item" onclick="welcome()"><div class="ico">↪</div><div class="grow"><b>Logout</b></div></div></div>${nav('profile')}</section>`)}function notificationSettings(){set(`<section class="screen active">${top('Notification Settings','profile')}<div class="content"><div class="card">${[['near','Nearby offers'],['flash','Flash Sales'],['stores','Favorite stores'],['special','MIRA Specials']].map(x=>`<div class="switch"><b>${x[1]}</b><button class="toggle ${S.notif[x[0]]?'on':''}" onclick="S.notif.${x[0]}=!S.notif.${x[0]};notificationSettings()"></button></div>`).join('')}</div></div></section>`)}function recent(){let r=S.recent.map(id=>O.find(o=>o.id===id)).filter(Boolean);set(`<section class="screen active">${top('Recently Viewed','profile')}<div class="content"><div class="offers">${r.map(o=>card(o,'recent')).join('')}</div></div>${nav('profile')}</section>`)}function support(){set(`<section class="screen active">${top('Help & Support','profile')}<div class="content"><div class="card"><select class="field"><option>Account</option><option>Offers</option><option>Merchants</option><option>Payments</option><option>Technical issue</option></select><input class="field" placeholder="Subject"><textarea class="field textarea" placeholder="Describe the issue"></textarea><button class="primary" onclick="alert('Support ticket submitted');profile()">Submit Ticket</button></div></div></section>`)}function reportOffer(id){set(`<section class="screen active">${top('Report Offer',`()=>detail(${id})`)}<div class="content"><div class="card"><select class="field"><option>Incorrect price</option><option>Expired offer</option><option>Misleading offer</option><option>Wrong location</option><option>Scam / fraud suspicion</option><option>Other</option></select><textarea class="field textarea" placeholder="Details"></textarea><button class="primary" onclick="alert('Report submitted');home()">Submit Report</button></div></div></section>`)}function merchantPortal(){set(`<section class="screen active">${top('Merchant','profile')}<div class="content"><div class="banner"><small>Business Dashboard</small><h2>ABC Electronics</h2><div>Verified • Baghdad</div></div><div class="kpis"><div class="kpi"><span class="small">Active Offers</span><strong>${S.merchantOffers}</strong></div><div class="kpi"><span class="small">Views</span><strong>18.4K</strong></div><div class="kpi"><span class="small">Favorites</span><strong>220</strong></div><div class="kpi"><span class="small">Leads</span><strong>143</strong></div></div><div class="section"><h3>Tools</h3></div>${[['🏷️','Manage Offers','manageOffers()'],['📊','Analytics','merchantAnalytics()'],['📍','Branches','branches()'],['💳','Subscription & Billing','billing()']].map(x=>`<div class="item" onclick="${x[2]}"><div class="ico">${x[0]}</div><div class="grow"><b>${x[1]}</b></div>›</div>`).join('')}<button class="primary" onclick="createOffer()">Create Offer</button></div>${nav('profile')}</section>`)}function createOffer(){set(`<section class="screen active">${top('Create Offer','merchantPortal')}<div class="content"><div class="card"><input class="field" placeholder="Offer title" value="Samsung TV Weekend Offer"><div class="grid2"><input class="field" placeholder="Original price" value="1000000"><input class="field" placeholder="Offer price" value="750000"></div><select class="field"><option>Standard Offer</option><option>Flash Sale</option><option>Featured Offer</option></select><select class="field"><option>All Baghdad branches</option><option>Mansour</option><option>Karrada</option></select><input class="field" type="datetime-local"><input class="field" type="datetime-local"><button class="secondary" onclick="alert('Preview ready')">Preview Offer</button><button class="primary" onclick="S.merchantOffers++;alert('Offer published');merchantPortal()">Publish Offer</button></div></div></section>`)}function manageOffers(){set(`<section class="screen active">${top('Manage Offers','merchantPortal')}<div class
