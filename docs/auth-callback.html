<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIRA — Signing in</title><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#800020;color:#FFFFFF;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:28px}.logo{font-size:38px;font-weight:800}.msg{margin-top:12px;color:#FC618F}</style></head><body><div class="box"><div class="logo">MIRA</div><div class="msg" id="msg">Signing you in…</div></div><script src="mira-cloud.js?v=20261009-cross-tab-remember-1"></script><script src="mira-auth-flow.js?v=20261009-notification-return-3"></script><script>
(async()=>{
 try{
  const query=new URLSearchParams(location.search);
  const fragment=new URLSearchParams(location.hash.replace(/^#/,''));
  const error=fragment.get('error_description')||query.get('error_description');
  if(error)throw new Error('The verification link failed or expired. Please request a new one.');
  const destination=MiraAuthFlow.safeReturn(query.get('next')||MiraAuthFlow.getReturn('home.html'),'home.html');
  const access_token=fragment.get('access_token');
  const refresh_token=fragment.get('refresh_token');
  if(access_token&&refresh_token){
   const expires_in=Number(fragment.get('expires_in')||3600);
   MiraCloud.acceptSession({
    access_token,refresh_token,expires_in,
    expires_at:Math.floor(Date.now()/1000)+expires_in,
    token_type:fragment.get('token_type')||'bearer'
   });
  }else{
   const token_hash=query.get('token_hash');
   const type=query.get('type');
   if(!token_hash||!['magiclink','signup','email','invite'].includes(type))
    throw new Error('The verification link is invalid or expired. Please request a new email.');
   const cfg=window.MIRA_SUPABASE;
   const response=await fetch(cfg.url+'/auth/v1/verify',{
    method:'POST',
    headers:{apikey:cfg.key,'Content-Type':'application/json'},
    body:JSON.stringify({token_hash,type})
   });
   if(!response.ok)throw new Error('Could not confirm this email link. Please request a new one.');
   MiraCloud.acceptSession(await response.json());
  }
  // Tokens remain outside the address bar and account identity is checked remotely.
  history.replaceState(null,'',location.pathname);
  const user=await MiraAuthFlow.getVerifiedCustomer();
  if(!user)throw new Error('Could not verify your MIRA account. Please sign in again.');
  const pending=MiraAuthFlow.getPending();
  if(pending?.mode==='signup'&&pending.profile?.full_name){
   localStorage.setItem('mira_profile_name',pending.profile.full_name);
   if(pending.profile.gender)localStorage.setItem('mira_profile_gender',pending.profile.gender);
   if(pending.profile.date_of_birth)localStorage.setItem('mira_profile_dob',pending.profile.date_of_birth);
  }
  localStorage.setItem('mira_auth_complete',JSON.stringify({at:Date.now(),returnTo:destination}));
  MiraAuthFlow.finish(destination);
  location.replace(destination);
 }catch(e){
  history.replaceState(null,'',location.pathname);
  msg.textContent=e.message||'Could not verify the MIRA sign-in link.';
 }
})();
</script></body></html>
