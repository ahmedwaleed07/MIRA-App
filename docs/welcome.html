<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ef7892">
<title>MIRA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#ef7892}
body{display:flex;justify-content:center}
.screen{position:relative;width:min(100vw,430px);aspect-ratio:9/16;overflow:hidden;background:#ef7892}
.art{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.hot{position:absolute;z-index:5;display:block;border:0;background:transparent;padding:0}
/* language pills */
.lang{top:2.8%;height:5.6%}
.en{left:5.5%;width:18%}.ar{left:24%;width:18%}.es{left:43%;width:17%}.ru{left:61%;width:18%}.tr{left:80%;width:15%}
/* CTA hit areas */
.signin{left:8%;width:84%;top:67.7%;height:7.2%}
.signup{left:8%;width:84%;top:76.0%;height:7.2%}
.guest{left:16%;width:68%;top:85.0%;height:5.7%}
</style>
</head>
<body>
<main class="screen">
  <img id="art" class="art" alt="MIRA welcome">

  <a class="hot lang en" href="welcome.html?lang=en" onclick="choose('en')" aria-label="English"></a>
  <a class="hot lang ar" href="welcome.html?lang=ar" onclick="choose('ar')" aria-label="العربية"></a>
  <a class="hot lang es" href="welcome.html?lang=es" onclick="choose('es')" aria-label="Español"></a>
  <a class="hot lang ru" href="welcome.html?lang=ru" onclick="choose('ru')" aria-label="Русский"></a>
  <a class="hot lang tr" href="welcome.html?lang=tr" onclick="choose('tr')" aria-label="Türkçe"></a>

  <a class="hot signin" href="signin.html" aria-label="Sign In"></a>
  <a class="hot signup" href="signup.html" aria-label="Sign Up"></a>
  <a class="hot guest" href="market.html" aria-label="Continue as Guest"></a>
</main>
<script>
const images={
  en:'assets/welcome-en.PNG',
  ar:'assets/welcome-ar.PNG',
  es:'assets/welcome-es.PNG',
  ru:'assets/welcome-ru.PNG',
  tr:'assets/welcome-tr.PNG'
};
const q=new URLSearchParams(location.search);
const lang=images[q.get('lang')]?q.get('lang'):(localStorage.getItem('mira_lang')||'en');
localStorage.setItem('mira_lang',lang);
document.documentElement.lang=lang;
document.documentElement.dir=lang==='ar'?'rtl':'ltr';
document.getElementById('art').src=images[lang];
function choose(code){localStorage.setItem('mira_lang',code)}
</script>
</body>
</html>
