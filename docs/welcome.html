<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#800020"><title>MIRA — Welcome</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="mira-auth-v3.css?v=20261009-logo-fix-1"></head>
<body class="mira-auth-v3 welcome-view">
<main class="auth-screen"><nav class="languages" aria-label="Languages"><button type="button" data-lang="en">English</button><button type="button" data-lang="ar">العربية</button><button type="button" data-lang="es">Español</button><button type="button" data-lang="ru">Русский</button><button type="button" data-lang="tr">Türkçe</button></nav><div class="hero-brand" aria-label="MIRA"><img class="icon" src="assets/mira_icon_frameless.svg" alt=""><img class="wordmark" src="assets/mira_wordmark.svg" alt="MIRA"></div>
<section class="welcome-panel"><h1 id="welcomeTitle">عروض طوال السنة</h1><p id="welcomeSubtitle">اكتشف عروضاً صُممت لك، أينما كنت.</p>
<nav class="welcome-actions"><a class="btn btn-white" href="signin.html" id="welcomeSignin">تسجيل الدخول ←</a><a class="btn btn-wine" href="signup.html" id="welcomeSignup">إنشاء حساب ←</a><div class="or-row" id="welcomeOr">أو</div><a class="btn btn-outline" href="market.html" id="welcomeGuest">المتابعة كضيف ←</a></nav></section>
<footer class="brand-footer"><span class="partner-powered">Powered by</span><img class="partner-logo" src="assets/asas360_master_vector.svg?v=20261009-pdf-eagle-3" alt="ASAS 360°"></footer></main>
<script>
const i18n={
 ar:{title:'عروض طوال السنة',sub:'اكتشف عروضاً صُممت لك، أينما كنت.',signin:'تسجيل الدخول',signup:'إنشاء حساب',guest:'المتابعة كضيف',or:'أو'},
 en:{title:'Offers all year round',sub:'Discover offers made for you, wherever you are.',signin:'Sign In',signup:'Sign Up',guest:'Continue as Guest',or:'or'},
 es:{title:'Ofertas todo el año',sub:'Descubre ofertas hechas para ti, estés donde estés.',signin:'Iniciar sesión',signup:'Crear cuenta',guest:'Continuar como invitado',or:'o'},
 ru:{title:'Акции круглый год',sub:'Находите предложения для себя где бы вы ни были.',signin:'Войти',signup:'Создать аккаунт',guest:'Продолжить как гость',or:'или'},
 tr:{title:'Yıl boyunca fırsatlar',sub:'Nerede olursan ol sana özel fırsatları keşfet.',signin:'Giriş Yap',signup:'Hesap Aç',guest:'Misafir olarak devam et',or:'veya'}
};
function applyLang(code){
 const lang=i18n[code]?code:'ar',t=i18n[lang];
 localStorage.setItem('mira_lang',lang);
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.getElementById('welcomeTitle').textContent=t.title;
 document.getElementById('welcomeSubtitle').textContent=t.sub;
 document.getElementById('welcomeSignin').textContent=t.signin+' ›';
 document.getElementById('welcomeSignup').textContent=t.signup+' ›';
 document.getElementById('welcomeGuest').textContent=t.guest+' ›';
 document.getElementById('welcomeOr').textContent=t.or;
 document.querySelectorAll('[data-lang]').forEach(b=>{const on=b.dataset.lang===lang;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on?'true':'false')});
}
const requested=new URLSearchParams(location.search).get('lang');
applyLang(i18n[requested]?requested:(localStorage.getItem('mira_lang')||'ar'));
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{applyLang(b.dataset.lang);history.replaceState(null,'','welcome.html?lang='+encodeURIComponent(b.dataset.lang));}));
</script><script src="mira-cloud.js?v=20261009-cross-tab-remember-1"></script><script>
const remembered=window.MiraCloud.session,claim=window.MiraCloud.payload();
if(remembered?.refresh_token&&claim?.role==='authenticated'&&claim?.sub)location.replace('home.html');
</script></body></html>
