<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ef7892">
<title>MIRA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#ef7892}
body{display:flex;justify-content:center;min-height:100svh;overflow:hidden}
.screen{position:relative;width:min(100vw,430px);height:100svh;min-height:100svh;overflow:hidden;background:#ef7892;touch-action:manipulation}
.art{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;pointer-events:none;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;display:block;border:0;background:transparent;padding:0;margin:0;touch-action:manipulation;cursor:pointer}
.lang{top:2.6%;height:6%;z-index:50}
.en{left:5%;width:19%}.ar{left:23.5%;width:19%}.es{left:42.5%;width:18.5%}.ru{left:60.5%;width:19%}.tr{left:79%;width:16%}
/* Measured directly from the 9:16 welcome artwork. CTA zones never overlap. */
.signin{left:9.5%;width:81%;top:63.7%;height:6.9%;z-index:30}
.signup{left:9.5%;width:81%;top:71.7%;height:6.9%;z-index:40}
.guest{left:18%;width:64%;top:80.5%;height:5.8%;z-index:35}
</style>
</head>
<body>
<main class="screen">
  <img id="art" class="art" alt="MIRA welcome" draggable="false">

  <button class="hot lang en" type="button" data-lang="en" aria-label="English"></button>
  <button class="hot lang ar" type="button" data-lang="ar" aria-label="العربية"></button>
  <button class="hot lang es" type="button" data-lang="es" aria-label="Español"></button>
  <button class="hot lang ru" type="button" data-lang="ru" aria-label="Русский"></button>
  <button class="hot lang tr" type="button" data-lang="tr" aria-label="Türkçe"></button>

  <a class="hot signin" href="signin.html" aria-label="Sign In"></a>
  <a class="hot signup" href="signup.html" aria-label="Sign Up"></a>
  <a class="hot guest" href="market.html" aria-label="Continue as Guest"></a>
</main>
<script>
const images={en:'assets/welcome-en.PNG',ar:'assets/welcome-ar.PNG',es:'assets/welcome-es.PNG',ru:'assets/welcome-ru.PNG',tr:'assets/welcome-tr.PNG'};
const q=new URLSearchParams(location.search);
let lang=images[q.get('lang')]?q.get('lang'):(localStorage.getItem('mira_lang')||'en');
function applyLang(code){
  lang=images[code]?code:'en';
  localStorage.setItem('mira_lang',lang);
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.getElementById('art').src=images[lang];
}
applyLang(lang);
document.querySelectorAll('[data-lang]').forEach(btn=>btn.addEventListener('click',()=>{
  const code=btn.dataset.lang;
  applyLang(code);
  history.replaceState(null,'','welcome.html?lang='+code);
}));
</script>
</body>
</html>
