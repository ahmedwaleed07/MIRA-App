const CATKEY=C.en,CATEGORY=CATKEY[cat];function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}const adminStores=load('mira_admin_stores'),adminOffers=load('mira_admin_offers');
function active(o){const now=Date.now(),a=o.start?new Date(o.start).getTime():0,b=o.end?new Date(o.end).getTime():0;return o.status==='active'&&(!a||a<=now)&&(!b||b>=now)}
function discount(o){if(o.discount)return String(o.discount).replace('%','')+'% OFF';const a=+o.originalPrice,b=+o.offerPrice;return a>0&&b>=0&&b<a?Math.round((1-b/a)*100)+'% OFF':'OFFER'}
function storeFor(id){return adminStores.find(s=>s.id===id)||null}
let data=[];adminOffers.filter(o=>o.category===CATEGORY&&active(o)).sort((x,y)=>(+x.priority||99)-(+y.priority||99)).forEach(o=>{const s=storeFor(o.storeId),name=s?.name||'MIRA Partner';data.push({id:o.id,type:'offers',name,title:o.title||'',discount:discount(o),letter:(name[0]||'M').toUpperCase(),storeId:o.storeId||'',image:o.image||s?.cover||'',logo:s?.logo||''})});adminStores.filter(s=>s.category===CATEGORY&&s.status==='active').forEach(s=>data.push({id:s.id,type:'stores',name:s.name,title:s.address||'',discount:'STORE',letter:(s.name[0]||'M').toUpperCase(),storeId:s.id,image:s.cover||'',logo:s.logo||''}));
if(!adminStores.length&&!adminOffers.length){const base=(C.en[cat].split(' ')[0]||'MIRA');data=[{id:`cat-${cat}-1`,type:'offers',name:`${base} Partner`,title:'',discount:'30% OFF',letter:'A'},{id:`cat-${cat}-2`,type:'stores',name:`${base} Store`,title:'',discount:'STORE',letter:'B'},{id:`cat-${cat}-3`,type:'offers',name:'MIRA Partner',title:'',discount:'15% OFF',letter:'M'}]}
let filter='all';function draw(){const term=q.value.trim().toLowerCase();const rows=data.filter(x=>(filter==='all'||x.type===filter)&&(!term||(x.name+' '+x.title+' '+x.discount).toLowerCase().includes(term)));list.innerHTML=rows.length?rows.map(x=>`<article class="card" data-id="${x.id}" data-type="${x.type}" data-store-id="${x.storeId||''}" data-name="${x.name.replace(/"/g,'&quot;')}" data-title="${(x.title||'').replace(/"/g,'&quot;')}" data-discount="${x.discount}" data-letter="${x.letter}"><div class="visual${x.image?' photo':''}"${x.image?` style="background-image:url('${x.image.replace(/'/g,'%27')}')"`:''}><span class="badge">${t.sponsored}</span><div class="logo">${x.logo?`<img src="${x.logo}" alt="">`:x.letter}</div></div><div class="body"><h3>${x.name}</h3><p>${x.title||t.sub}</p><div class="meta"><span class="discount">${x.discount}</span><button class="cta">${t.view}</button></div></div></article>`).join(''):`<div class="empty">${t.empty}</div>`}
q.oninput=draw;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;draw()});list.onclick=e=>{const c=e.target.closest('.card');if(!c)return;if(c.dataset.type==='stores'){location.href='store.html?id='+encodeURIComponent(c.dataset.id);return}location.href='offer.html?'+new URLSearchParams({id:c.dataset.id,type:'offer',storeId:c.dataset.storeId||'',name:c.dataset.name,title:c.dataset.title||'',discount:c.dataset.discount,letter:c.dataset.letter,category:String(cat)}).toString()};draw();</script></body></html>
