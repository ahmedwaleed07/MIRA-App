  }
setLang(localStorage.getItem('mira_lang')||'en');
(()=>{
 const method=sessionStorage.getItem('mira_prefill_method'),value=sessionStorage.getItem('mira_prefill_value'),cc=sessionStorage.getItem('mira_prefill_code');
 if(!method||!value)return;
 showTab(method);
 if(method==='email')elEmail.value=value;
 else{
   elPhone.value=value;
   if(cc){const opt=[...elCode.options].find(o=>o.textContent.includes(cc));if(opt)elCode.value=opt.value}
 }
 ['mira_prefill_method','mira_prefill_value','mira_prefill_code'].forEach(k=>sessionStorage.removeItem(k));
})();
</script>
