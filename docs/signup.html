<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8E8E8">
<title>MIRA — Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#040616;color:#fff}body{display:flex;justify-content:center}.app{position:relative;width:min(100vw,430px);min-height:100svh;overflow:hidden;background:#040616}.auth-art{position:absolute;inset:0 0 auto 0;width:100%;height:auto;display:block;user-select:none;pointer-events:none}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,6,24,.02) 0%,rgba(3,6,24,.08) 26%,rgba(3,6,24,.72) 34%,rgba(3,6,24,.78) 82%,rgba(3,6,24,.10) 100%)}.sheet{position:relative;z-index:2;margin:32% 7% 0;padding:16px;border:1px solid rgba(255,255,255,.32);border-radius:24px;background:rgba(7,17,48,.68);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 18px 46px rgba(0,0,0,.36)}.sheet h1{margin:0 0 4px;text-align:center;font-size:24px;color:#fff;text-shadow:0 0 18px #ff2aa7}.sub{margin:0 0 12px;text-align:center;font-size:11px;color:rgba(255,255,255,.78)}.field{margin-top:9px}.label{display:block;font-size:10px;font-weight:700;margin:0 0 5px 2px}.input,.select,.code{width:100%;height:43px;border:1px solid rgba(255,255,255,.36);border-radius:13px;background:rgba(8,20,54,.68);color:#fff;padding:0 11px;outline:none;font:500 12px inherit}.row{display:flex;gap:8px}.row-3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px}.code{width:92px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;padding:3px;border:1px solid rgba(255,255,255,.28);border-radius:14px;background:rgba(9,19,52,.5)}.tab{border:0;border-radius:11px;padding:9px;background:transparent;color:#fff;font:700 12px inherit}.tab.active{background:linear-gradient(90deg,#ff2ca8,#ca39ff,#54d9ff);box-shadow:0 0 18px rgba(255,44,168,.45)}.panel{display:none;margin-top:9px}.panel.active{display:block}.primary{width:100%;height:47px;margin-top:12px;border:1px solid rgba(255,255,255,.6);border-radius:15px;background:linear-gradient(90deg,#ff2ca8 0%,#ff467e 30%,#ba35ff 66%,#4bdcff 100%);color:#fff;font:800 14px inherit;box-shadow:0 0 24px rgba(255,44,168,.35)}.privacy{font-size:9px;color:rgba(255,255,255,.72);text-align:center;margin:8px 0 0}.bottom{text-align:center;margin-top:9px;font-size:11px;color:#fff}.bottom a{color:#ff55d2;font-weight:800}.languages{position:absolute;z-index:3;left:5.5%;right:5.5%;top:78.6%;height:7%;display:grid;grid-template-columns:repeat(5,1fr);gap:2.5%}.languages button{border:0;background:transparent;color:transparent}.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
</style>
</head>
<body>
<main class="app">
  <img class="auth-art" src="assets/mira_auth_reference.webp" alt="MIRA account registration">
  <div class="shade"></div>
  <section class="sheet">
    <h1 id="title">Create your MIRA account</h1><p class="sub" id="subtitle">Join MIRA and keep your shopping preferences wherever you go.</p>
    <div class="field"><label class="label" id="nameLabel" for="name">Full name</label><input class="input" id="name" type="text" autocomplete="name" placeholder="Your name"></div>
    <div class="row">
      <div class="field" style="flex:1"><label class="label" id="genderLabel" for="gender">Gender</label><select class="select" id="gender"><option value="">Select gender</option><option value="male">Male</option><option value="female">Female</option><option value="prefer_not">Prefer not to say</option></select></div>
      <div class="field" style="flex:1.3"><label class="label" id="dobLabel">Date of birth</label><div class="row-3"><select class="select" id="dobDay"><option value="">Day</option></select><select class="select" id="dobMonth"><option value="">Month</option></select><select class="select" id="dobYear"><option value="">Year</option></select></div></div>
    </div>
    <div class="tabs"><button class="tab active" id="phoneTab" onclick="showTab('phone')">Phone</button><button class="tab" id="emailTab" onclick="showTab('email')">Email</button></div>
    <div class="panel active" id="phonePanel"><label class="sr-only" id="phoneLabel" for="phone">Phone number</label><div class="row"><select class="code" id="code" aria-label="Country code"><option>+964</option><option>+965</option><option>+966</option><option>+973</option><option>+974</option><option>+971</option><option>+968</option><option>+962</option><option>+961</option><option>+970</option><option>+20</option><option>+1</option><option>+61</option><option>+44</option><option>+39</option><option>+49</option><option>+33</option><option>+31</option><option>+358</option><option>+32</option><option>+43</option><option>+46</option></select><input class="input" id="phone" type="tel" inputmode="tel" placeholder="7XX XXX XXXX"></div></div>
    <div class="panel" id="emailPanel"><label class="sr-only" id="emailLabel" for="email">Email address</label><input class="input" id="email" type="email" inputmode="email" placeholder="name@example.com"></div>
    <button class="primary" id="continueBtn" onclick="continueSignup()">Continue</button><p class="privacy" id="privacy">By continuing, you agree to MIRA's Terms and Privacy Policy.</p>
    <div class="bottom" id="bottom">Already have an account? <a href="signin.html">Sign In</a></div>
  </section>
  <div class="languages" aria-label="Languages"><button onclick="setLang('tr')" aria-label="Türkçe"></button><button onclick="setLang('ru')" aria-label="Русский"></button><button onclick="setLang('es')" aria-label="Español"></button><button onclick="setLang('en')" aria-label="English"></button><button onclick="setLang('ar')" aria-label="العربية"></button></div>
</main>
<script src="mira-cloud.js?v=20261007-1620"></script><script>
const authReturn=new URLSearchParams(location.search).get("return")||sessionStorage.getItem("mira_auth_return")||"";if(authReturn){sessionStorage.setItem("mira_auth_return",authReturn);localStorage.setItem("mira_auth_return",authReturn)}
(()=>{const p=MiraCloud.payload();if(p&&p.role==='authenticated'&&p.sub){sessionStorage.setItem('mira_existing_session_checked','1');const ret=localStorage.getItem('mira_auth_return')||sessionStorage.getItem('mira_auth_return')||'home.html';localStorage.removeItem('mira_auth_return');sessionStorage.removeItem('mira_auth_return');location.replace(ret)}})();
const elName=document.getElementById('name'),elGender=document.getElementById('gender'),elDobDay=document.getElementById('dobDay'),elDobMonth=document.getElementById('dobMonth'),elDobYear=document.getElementById('dobYear'),elPhone=document.getElementById('phone'),elEmail=document.getElementById('email'),elCode=document.getElementById('code'),elContinue=document.getElementById('continueBtn');
for(let i=1;i<=31;i++){dobDay.innerHTML+=`<option value="${i}">${i}</option>`;}const monthsEn=['Month','January','February','March','April','May','June','July','August','September','October','November','December'];for(let i=1;i<monthsEn.length;i++){dobMonth.innerHTML+=`<option value="${i}">${monthsEn[i]}</option>`;}const currentYear=new Date().getFullYear();for(let y=currentYear;y>=1940;y--){dobYear.innerHTML+=`<option value="${y}">${y}</option>`;}
let currentMethod='phone';function showTab(which){currentMethod=which;const phone=which==='phone';document.getElementById('phonePanel').classList.toggle('active',phone);document.getElementById('emailPanel').classList.toggle('active',!phone);document.getElementById('phoneTab').classList.toggle('active',phone);document.getElementById('emailTab').classList.toggle('active',!phone);} 
const T={en:{title:'Create your MIRA account',subtitle:'Join MIRA and keep your shopping preferences wherever you go.',name:'Full name',namePh:'Your name',gender:'Gender',genderPh:'Select gender',male:'Male',female:'Female',prefer:'Prefer not to say',dob:'Date of birth',day:'Day',month:'Month',year:'Year',months:['January','February','March','April','May','June','July','August','September','October','November','December'],phone:'Phone',email:'Email',phoneLabel:'Phone number',emailLabel:'Email address',continue:'Continue',privacy:"By continuing, you agree to MIRA's Terms and Privacy Policy.",bottom:'Already have an account? <a href="signin.html">Sign In</a>',alertName:'Enter your full name',alertGender:'Select gender',alertDob:'Select your date of birth',alertPhone:'Enter your phone number',alertEmail:'Enter your email'},ar:{title:'أنشئ حساب MIRA',subtitle:'سجّل حتى تبقى اختياراتك محفوظة وين ما تروح.',name:'الاسم الكامل',namePh:'اسمك',gender:'الجنس',genderPh:'اختر الجنس',male:'ذكر',female:'أنثى',prefer:'أفضل عدم الإفصاح',dob:'تاريخ الميلاد',day:'اليوم',month:'الشهر',year:'السنة',months:['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],phone:'الهاتف',email:'الإيميل',phoneLabel:'رقم الهاتف',emailLabel:'البريد الإلكتروني',continue:'متابعة',privacy:'بالمتابعة أنت توافق على شروط الاستخدام وسياسة الخصوصية في MIRA.',bottom:'عندك حساب؟ <a href="signin.html">تسجيل الدخول</a>',alertName:'اكتب الاسم الكامل',alertGender:'اختر الجنس',alertDob:'اختر تاريخ الميلاد',alertPhone:'اكتب رقم الهاتف',alertEmail:'اكتب البريد الإلكتروني'},es:{title:'Crea tu cuenta MIRA',subtitle:'Únete a MIRA y mantén tus preferencias dondequiera que vayas.',name:'Nombre completo',namePh:'Tu nombre',gender:'Género',genderPh:'Selecciona género',male:'Hombre',female:'Mujer',prefer:'Prefiero no decirlo',dob:'Fecha de nacimiento',day:'Día',month:'Mes',year:'Año',months:['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],phone:'Teléfono',email:'Correo',phoneLabel:'Número de teléfono',emailLabel:'Correo electrónico',continue:'Continuar',privacy:'Al continuar, aceptas los Términos y la Política de privacidad de MIRA.',bottom:'¿Ya tienes cuenta? <a href="signin.html">Iniciar sesión</a>',alertName:'Introduce tu nombre completo',alertGender:'Selecciona género',alertDob:'Selecciona tu fecha de nacimiento',alertPhone:'Introduce tu número',alertEmail:'Introduce tu correo'},ru:{title:'Создайте аккаунт MIRA',subtitle:'Присоединяйтесь к MIRA и сохраняйте свои предпочтения.',name:'Полное имя',namePh:'Ваше имя',gender:'Пол',genderPh:'Выберите пол',male:'Мужской',female:'Женский',prefer:'Предпочитаю не указывать',dob:'Дата рождения',day:'День',month:'Месяц',year:'Год',months:['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],phone:'Телефон',email:'Почта',phoneLabel:'Номер телефона',emailLabel:'Эл. почта',continue:'Продолжить',privacy:'Продолжая, вы соглашаетесь с Условиями и Политикой конфиденциальности MIRA.',bottom:'Уже есть аккаунт? <a href="signin.html">Войти</a>',alertName:'Введите полное имя',alertGender:'Выберите пол',alertDob:'Выберите дату рождения',alertPhone:'Введите номер телефона',alertEmail:'Введите эл. почту'},tr:{title:'MIRA hesabını oluştur',subtitle:'MIRA’ya katıl, tercihlerini her yerde yanında taşı.',name:'Ad Soyad',namePh:'Adın',gender:'Cinsiyet',genderPh:'Cinsiyet seç',male:'Erkek',female:'Kadın',prefer:'Belirtmek istemiyorum',dob:'Doğum tarihi',day:'Gün',month:'Ay',year:'Yıl',months:['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'],phone:'Telefon',email:'E-posta',phoneLabel:'Telefon numarası',emailLabel:'E-posta adresi',continue:'Devam et',privacy:'Devam ederek MIRA Kullanım Şartları ve Gizlilik Politikasını kabul edersin.',bottom:'Zaten hesabın var mı? <a href="signin.html">Giriş Yap</a>',alertName:'Ad soyad gir',alertGender:'Cinsiyet seç',alertDob:'Doğum tarihini seç',alertPhone:'Telefon numaranı gir',alertEmail:'E-posta adresini gir'}};
function refillMonths(lang){const t=T[lang]||T.en;const current=dobMonth.value;dobMonth.innerHTML=`<option value="">${t.month}</option>`;t.months.forEach((m,i)=>dobMonth.innerHTML+=`<option value="${i+1}">${m}</option>`);if(current) dobMonth.value=current;}
function refillGender(lang){const t=T[lang]||T.en;const current=gender.value;gender.innerHTML=`<option value="">${t.genderPh}</option><option value="male">${t.male}</option><option value="female">${t.female}</option><option value="prefer_not">${t.prefer}</option>`;if(current) gender.value=current;}
function setLang(lang){localStorage.setItem('mira_lang',lang);const t=T[lang]||T.en;const rtl=lang==='ar';document.documentElement.lang=lang;document.documentElement.dir=rtl?'rtl':'ltr';title.textContent=t.title;subtitle.textContent=t.subtitle;nameLabel.textContent=t.name;name.placeholder=t.namePh;genderLabel.textContent=t.gender;dobLabel.textContent=t.dob;phoneTab.textContent=t.phone;emailTab.textContent=t.email;phoneLabel.textContent=t.phoneLabel;emailLabel.textContent=t.emailLabel;continueBtn.textContent=t.continue;privacy.textContent=t.privacy;bottom.innerHTML=t.bottom;document.querySelector('#dobDay option').textContent=t.day;document.querySelector('#dobYear option').textContent=t.year;refillMonths(lang);refillGender(lang);} 
async function continueSignup(){
    const t=T[document.documentElement.lang||'en'];
    try{
      const nameVal=elName.value.trim();
      if(!nameVal){alert(t.alertName);return}
      if(!elGender.value){alert(t.alertGender);return}
      if(!elDobDay.value||!elDobMonth.value||!elDobYear.value){alert(t.alertDob);return}
      const value=currentMethod==='phone'?elPhone.value.trim():elEmail.value.trim();
      if(!value){alert(currentMethod==='phone'?t.alertPhone:t.alertEmail);return}
      let target='';
      if(currentMethod==='email')target=value.toLowerCase();
      else{
        const cc=(elCode.value.match(/\+\d+/)||['+964'])[0];
        let local=value.replace(/\D/g,'');
        if(local.startsWith('0'))local=local.slice(1);
        target=cc+local;
      }
      const profile={full_name:nameVal,gender:elGender.value,date_of_birth:elDobYear.value+'-'+String(elDobMonth.value).padStart(2,'0')+'-'+String(elDobDay.value).padStart(2,'0')};
      elContinue.disabled=true;const oldText=elContinue.textContent;elContinue.textContent='…';
      sessionStorage.setItem('mira_otp_via',currentMethod);
      sessionStorage.setItem('mira_otp_target',target);
      sessionStorage.setItem('mira_otp_mode','signup');
      sessionStorage.setItem('mira_signup_profile',JSON.stringify(profile));
      const cb=new URL('auth-callback.html',location.href);const next=localStorage.getItem('mira_auth_return')||sessionStorage.getItem('mira_auth_return')||'market.html';cb.searchParams.set('next',next);const callback=cb.href;await MiraCloud.startOtp(currentMethod==='email'?{email:target,createUser:true,data:profile,redirectTo:callback}:{phone:target,createUser:true,data:profile});
      location.href='otp.html?mode=signup&via='+encodeURIComponent(currentMethod);
    }catch(e){
      let m=e&&e.message?e.message:String(e||'Sign up failed.');
      try{const p=JSON.parse(m);m=p.msg||p.message||m}catch(_){}
      if(/Unsupported phone provider/i.test(m)){const lang=localStorage.getItem('mira_lang')||'en';m=lang==='ar'?'إنشاء حساب برقم الهاتف يحتاج تفعيل خدمة رسائل SMS في MIRA. استخدم الإيميل حالياً أو فعّل مزود SMS.':'Phone sign-up requires an SMS provider to be configured for MIRA. Use email for now or enable an SMS provider.'}if(/email rate limit exceeded|over_email_send_rate_limit|rate limit/i.test(m)){const lang=localStorage.getItem('mira_lang')||'en';m=lang==='ar'?'تم إرسال عدد كبير من رسائل التحقق حالياً. إذا كنت فتحت رابط التحقق السابق بنجاح، ارجع إلى MIRA وسوِّ تحديث. وإذا لا، انتظر إلى أن يسمح Supabase بإرسال رسالة جديدة.':'Too many verification emails were sent. If you already opened the previous verification link successfully, return to MIRA and refresh. Otherwise wait until Supabase allows another email.'}alert(m);
      elContinue.disabled=false;
      elContinue.textContent=(T[document.documentElement.lang||'en']||T.en).continue;
    }
  }
setLang(localStorage.getItem('mira_lang')||'en');
(()=>{
 const method=sessionStorage.getItem('mira_prefill_method'),value=sessionStorage.getItem('mira_prefill_value'),cc=sessionStorage.getItem('mira_prefill_code');
 if(!method||!value)return;
 showTab(method);
 if(method==='email')elEmail.value=value;
 else{
   elPhone.value=value;
   if(cc){const opt=[...elCode.options].find(o=>o.textContent.includes(cc));if(opt)elCode.value=opt.value}
 }
 ['mira_prefill_method','mira_prefill_value','mira_prefill_code'].forEach(k=>sessionStorage.removeItem(k));
})();
</script>
</body>
</html>
