<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MIRA — Cart</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--p:#FC618F;--p2:#800020;--pe:#800020;--berry:#FFFFFF;--fog:#800020;--snow:#800020;--line:#800020;--mira:#FC618F}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--fog);color:var(--berry)}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100svh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));background:var(--snow)}.top{display:flex;align-items:center;justify-content:space-between}.back{border:0;background:var(--snow);width:42px;height:42px;border-radius:14px;color:var(--p);font-size:25px;box-shadow:0 8px 22px #800020}.brandmark{width:105px;height:34px;background:var(--mira);-webkit-mask:url('assets/mira_wordmark.svg') center/contain no-repeat;mask:url('assets/mira_wordmark.svg') center/contain no-repeat}.spacer{width:42px}.title{font-size:28px;font-weight:800;margin:24px 0 4px}.sub{color:var(--p);font-size:12px;margin-bottom:18px}.item{display:flex;gap:11px;align-items:center;background:var(--snow);border:1px solid var(--line);border-radius:19px;padding:12px;margin-bottom:10px;box-shadow:0 8px 24px #800020}.pic{width:58px;height:58px;border-radius:15px;background:linear-gradient(135deg,var(--pe),var(--fog));background-size:cover;background-position:center;display:grid;place-items:center;font-size:24px;flex:0 0 auto}.grow{flex:1;min-width:0}.grow b{font-size:12px;display:block}.small{font-size:10px;color:var(--p);margin-top:3px}.qty{display:flex;align-items:center;gap:5px;margin-top:7px}.qty button,.remove{border:1px solid var(--line);background:var(--snow);color:var(--berry);border-radius:10px;min-width:29px;height:29px;font-weight:800}.remove{color:var(--berry)}.summary{margin-top:16px;border:1px solid var(--line);background:var(--snow);border-radius:20px;padding:15px}.sumrow{display:flex;justify-content:space-between;align-items:center;font-size:13px}.sumrow strong{font-size:20px}.primary,.secondary{width:100%;border-radius:16px;padding:14px;margin-top:11px;font:700 13px Poppins}.primary{border:0;background:linear-gradient(90deg,var(--p),var(--p2),var(--pe));color:var(--snow)}.secondary{border:1px solid var(--line);background:var(--snow);color:var(--berry)}.empty{text-align:center;color:var(--p);padding:55px 15px}.count{font-size:11px;color:var(--p)}[dir=rtl] .item{text-align:right}</style><link rel="stylesheet" href="mira-pink-theme.css?v=20261008-luxe-contrast-2"></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()">‹</button><div class="brandmark" aria-label="MIRA"></div><div class="spacer"></div></div><div class="title" id="pageTitle"></div><div class="sub" id="pageSub"></div><div id="list"></div><div id="summary"></div></main><script src="mira-cloud.js?v=20261009-cross-tab-remember-1"></script><script>
const lang=localStorage.getItem('mira_lang')||'en',ar=lang==='ar';document.documentElement.lang=lang;document.documentElement.dir=ar?'rtl':'ltr';
pageTitle.textContent=ar?'سلة التسوق':'Shopping Cart';pageSub.textContent=ar?'تگدر تتصفح وتضيف للسلة بدون تسجيل. تسجيل الدخول مطلوب فقط عند إكمال الطلب.':'Browse and add items as a guest. Sign in is required only when you checkout.';
function load(){try{return JSON.parse(localStorage.getItem('mira_cart')||'[]')}catch(e){return[]}}function save(a){localStorage.setItem('mira_cart',JSON.stringify(a))}
function money(v,c='IQD'){return Number(v||0).toLocaleString(ar?'ar-IQ':undefined)+' '+c}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#800020;'}[m]))}
function change(id,d){const a=load(),x=a.find(r=>String(r.offerId)===String(id));if(!x)return;x.quantity=Math.max(1,(x.quantity||1)+d);save(a);render()}
function removeItem(id){save(load().filter(r=>String(r.offerId)!==String(id)));render()}
function checkout(){
 // The protected checkout verifies Supabase remotely, then returns guests here after login.
 location.href='checkout.html';
}
function render(){const a=load();if(!a.length){list.innerHTML='<div class="empty">'+(ar?'السلة فارغة حالياً.':'Your cart is empty.')+'</div>';summary.innerHTML='<button class="secondary" onclick="location.href=\'home.html\'">'+(ar?'ابدأ التسوق':'Start shopping')+'</button>';return}let total=0;list.innerHTML=a.map(x=>{const qty=x.quantity||1,totalRow=Number(x.unitPrice||0)*qty;total+=totalRow;return '<div class="item"><div class="pic"'+(x.image?' style="background-image:url(&quot;'+esc(x.image)+'&quot;)"':'')+'>'+(x.image?'':'🛍️')+'</div><div class="grow"><b>'+esc(x.title)+'</b><div class="small">'+esc(x.storeName||'MIRA Merchant')+' · '+money(x.unitPrice,x.currency)+'</div><div class="qty"><button onclick="change(\''+esc(x.offerId)+'\',-1)">−</button><span>'+qty+'</span><button onclick="change(\''+esc(x.offerId)+'\',1)">+</button><button class="remove" onclick="removeItem(\''+esc(x.offerId)+'\')">×</button></div></div></div>'}).join('');summary.innerHTML='<div class="summary"><div class="sumrow"><span>'+(ar?'المجموع':'Total')+'</span><strong>'+money(total,'IQD')+'</strong></div><div class="count">'+a.reduce((n,x)=>n+(x.quantity||1),0)+' '+(ar?'قطعة':'item(s)')+'</div><button class="primary" onclick="checkout()">'+(ar?'إكمال الطلب':'Checkout')+'</button><button class="secondary" onclick="location.href=\'home.html\'">'+(ar?'متابعة التسوق':'Continue shopping')+'</button></div>'}render();
</script></body></html>
