<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8fb"><title>MIRA — Home</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>

</style></head><body><main class="app"><div class="top"><div class="brandmark" aria-label="MIRA"></div><button class="location" id="locationBtn"></button></div><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="searchInput" type="search"></div>

const C={en:['Fashion','Shoes','Accessories','Beauty','Perfumes','Electronics','Food','Grocery'],ar:['الأزياء','الأحذية','الإكسسوارات','الجمال','العطور','الإلكترونيات','مطاعم','سوبرماركت'],es:['Moda','Calzado','Accesorios','Belleza','Perfumes','Electrónica','Comida','Supermercado'],ru:['Одежда','Обувь','Аксессуары','Красота','Парфюм','Электроника','Еда','Продукты'],tr:['Moda','Ayakkabı','Aksesuar','Güzellik','Parfüm','Elektronik','Yeme İçme','Market']};

function lang(){return localStorage.getItem('mira_lang')||'en'}function loc(){const m=localStorage.getItem('mira_market')||'IQ',c=localStorage.getItem('mira_city')||'all';const n={IQ:{en:'Iraq',ar:'العراق',es:'Irak',ru:'Ирак',tr:'Irak'},US:{en:'United States',ar:'الولايات المتحدة',es:'Estados Unidos',ru:'США',tr:'ABD'},CA:{en:'Canada',ar:'كندا',es:'Canadá',ru:'Канада',tr:'Kanada'}};return (n[m]?.[lang()]||m)+(c!=='all'?' · '+c.replace(/(^|-)\w/g,x=>x.toUpperCase()):'')}
function flashCard(name,discount,seconds,initial){const t=T[lang()]||T.en;return `<article class="flash-card"><div class="flash-visual"><span class="flash-badge">FLASH SALE</span><div class="flash-logo">${initial}</div></div><div class="flash-body"><div class="flash-store">${name}</div><div class="flash-row"><div><div class="flash-discount">${discount}% OFF</div><div class="flash-label">${t.flashLabel}</div></div></div><div class="countdown" data-seconds="${seconds}"><div class="time-box"><b data-h>00</b><span>${t.hours}</span></div><span class="colon">:</span><div class="time-box"><b data-m>00</b><span>${t.mins}</span></div><span class="colon">:</span><div class="time-box"><b data-s>00</b><span>${t.secs}</span></div></div><button class="flash-cta">${t.shop}</button></div></article>`}
function render(){const l=lang(),t=T[l]||T.en;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';searchInput.placeholder=t.search;locationBtn.textContent=loc();featuredTitle.textContent=t.featured;flashTitle.textContent=t.flash;recentTitle.textContent=t.recent;interestTitle.textContent=t.interest;nearTitle.textContent=t.near;categoriesTitle.textContent=t.categories;[seeFeatured,seeFlash,seeRecent,seeInterest,seeNear].forEach(x=>x.textContent=t.see);navHome.textContent=t.home;navCategories.textContent=t.cats;navSaved.textContent=t.saved;navProfile.textContent=t.profile;featuredRail.innerHTML=`<article class="featured-card"><div class="featured-visual"><span class="featured-badge">${t.featuredBadge}</span><div class="featured-logo">M</div></div><div class="featured-copy"><h3>MIRA Partner Spotlight</h3><p>${t.featuredCopy}</p><div class="featured-meta"><span class="featured-offer">${t.featuredOffer}</span><button class="cta">${t.shop}</button></div></div></article><article class="featured-card"><div class="featured-visual"><span class="featured-badge">${t.featuredBadge}</span><div class="featured-logo">P</div></div><div class="featured-copy"><h3>Premium Partner</h3><p>${t.featuredCopy}</p><div class="featured-meta"><span class="featured-offer">${t.featuredOffer}</span><button class="cta">${t.shop}</button></div></div></article>`;flashRail.innerHTML=flashCard('MIRA Partner',40,8639,'M')+flashCard('Partner Store',25,14720,'P');recentRail.innerHTML=`<article class="store-card"><div class="store-logo">N</div><h4>New Partner</h4><p>${t.recentCopy}</p></article><article class="store-card"><div class="store-logo">M</div><h4>MIRA Partner</h4><p>${t.recentCopy}</p></article>`;interestRail.innerHTML=`<article class="interest-card"><span class="pill">Sponsored</span><h4>Offer matched to you</h4><p>${t.interestCopy}</p></article><article class="interest-card"><span class="pill">Sponsored</span><h4>Recommended partner</h4><p>${t.interestCopy}</p></article>`;nearRail.innerHTML=`<article class="near-card"><span class="distance">Nearby</span><h4>MIRA Partner</h4><p>${t.nearCopy}</p></article><article class="near-card"><span class="distance">Nearby</span><h4>Partner Offer</h4><p>${t.nearCopy}</p></article>`;cats.innerHTML='';(C[l]||C.en).forEach((name,i)=>{const b=document.createElement('button');b.className='cat';b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${icons[i]}</svg><span>${name}</span>`;cats.appendChild(b)});updateTimers()}
function updateTimers(){document.querySelectorAll('.countdown').forEach(el=>{let s=Math.max(0,Number(el.dataset.seconds));let h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor((s%3600)/60)).padStart(2,'0'),sec=String(s%60).padStart(2,'0');el.querySelector('[data-h]').textContent=h;el.querySelector('[data-m]').textContent=m;el.querySelector('[data-s]').textContent=sec})}
