function renderCats(){const t=T[L()]||T.en,names=CAT[L()]||CAT.en;cats.innerHTML='';names.forEach((n,i)=>{const b=document.createElement('button');b.className='cat'+(i<3?' sponsored':'');b.innerHTML=`<span class="cat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${I[i]}</svg></span><span>${n}</span>`;b.onclick=()=>location.href='category.html?cat='+i;cats.appendChild(b)});categoryNote.innerHTML=t.catNote}
let th;function startTimers(){clearInterval(th);function tick(){document.querySelectorAll('[data-seconds]').forEach(el=>{let s=Math.max(0,+el.dataset.seconds),h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor((s%3600)/60)).padStart(2,'0'),x=String(s%60).padStart(2,'0');el.querySelector('.hh').textContent=h;el.querySelector('.mm').textContent=m;el.querySelector('.ss').textContent=x;el.dataset.seconds=Math.max(0,s-1)})}tick();th=setInterval(tick,1000)}
function setLang(l){localStorage.setItem('mira_lang',l);applyLang()}function applyLang(){const t=T[L()]||T.en;document.documentElement.lang=L();document.documentElement.dir=L()==='ar'?'rtl':'ltr';searchInput.placeholder=t.search;locationBtn.textContent=area();featuredTitle.textContent=t.featured;flashTitle.textContent=t.flash;recentTitle.textContent=t.recent;interestTitle.textContent=t.interest;nearTitle.textContent=t.near;categoriesTitle.textContent=t.categories;[seeFeatured,seeFlash,seeRecent,seeInterest,seeNear].forEach(x=>x.textContent=t.see);navHome.textContent=t.home;navCategories.textContent=t.cats;navSaved.textContent=t.saved;navProfile.textContent=t.profile;render()}applyLang();
document.addEventListener('click',e=>{const c=e.target.closest('.featured-card,.flash-card,.recent-card,.interest-card,.near-card');if(!c)return;const name=(c.querySelector('h4')||c.querySelector('.flash-body b'))?.textContent||'MIRA Partner';const discount=c.querySelector('.discount')?.textContent||'25% OFF';const letter=(c.querySelector('.logo')?.textContent||name[0]||'M').trim().charAt(0);const type=c.classList.contains('recent-card')?'store':'offer';const id=[type,name,discount].join('-').toLowerCase().replace(/[^a-z0-9]+/g,'-');location.href='offer.html?'+new URLSearchParams({id,type,name,discount,letter}).toString()});
function openGlobalSearch(){const v=searchInput.value.trim();location.href='search.html'+(v?'?q='+encodeURIComponent(v):'')}searchInput.addEventListener('focus',()=>{if(!searchInput.value)searchInput.select()});searchInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();openGlobalSearch()}});homeSearch.addEventListener('click',e=>{if(e.target!==searchInput)searchInput.focus()});
locationBtn.onclick=()=>location.href='market.html';[seeFeatured,seeFlash,seeRecent,seeInterest,seeNear].forEach(b=>b.onclick=()=>location.href='search.html');
</script></body></html>
