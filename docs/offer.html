function saveCart(rows){localStorage.setItem('mira_cart',JSON.stringify(rows));updateCartBadge()}
function updateCartBadge(){const n=cartItems().reduce((s,x)=>s+(x.quantity||1),0);viewCartBtn.textContent=(l==='ar'?'عرض السلة':'View cart')+' ('+n+')';viewCartBtn.style.display=n?'block':'none'}
cartBtn.onclick=()=>{if(!adminOffer||!adminStore)return;let rows=cartItems(),row=rows.find(x=>String(x.offerId)===String(adminOffer.id));if(row)row.quantity=(row.quantity||1)+1;else rows.push({offerId:adminOffer.id,storeId:adminStore.id,storeName:adminStore.name||name,title:adminOffer.title||title.textContent,quantity:1,unitPrice:orderUnitPrice(),currency:'IQD',image:adminOffer.image||'',attributes:adminOffer.attributes||{}});saveCart(rows);cartBtn.textContent=l==='ar'?'تمت الإضافة ✓':'Added to cart ✓';setTimeout(()=>cartBtn.textContent=l==='ar'?'أضف إلى السلة':'Add to cart',1200)}
updateCartBadge();
trackOrderBtn.onclick=()=>location.href='orders.html';
function savedList(){try{return JSON.parse(localStorage.getItem('mira_saved')||'[]')}catch(e){return[]}}
function sync(){const s=savedList(),on=s.some(x=>x.id===id);saveBtn.classList.toggle('saved',on);saveBtn.setAttribute('aria-label',on?t.saved:'Save')}
saveBtn.onclick=()=>{let s=savedList();const i=s.findIndex(x=>x.id===id);if(i>=0)s.splice(i,1);else s.push({id,name,title:title.textContent,discount,letter,type,storeId:adminStore?.id||q.get('storeId')||''});localStorage.setItem('mira_saved',JSON.stringify(s));sync()};sync()</script></body></html>
