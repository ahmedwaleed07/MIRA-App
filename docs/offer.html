<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MIRA — Offer</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--pink:#FF4D8D;--pink2:#FF7EB6;--peach:#FFC8A1;--blue:#6EC6FF;--ink:#A62C63;--muted:#B86A8E;--line:#F0DCE6;--bg:#fff8fb;--mira:#D94F8A}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100svh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));background:radial-gradient(circle at 0 0,rgba(255,126,182,.17),transparent 27%),radial-gradient(circle at 100% 8%,rgba(110,198,255,.16),transparent 28%),#fff}.top{display:flex;align-items:center;justify-content:space-between}.back,.save{border:0;background:#fff;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--pink);box-shadow:0 8px 22px rgba(92,50,76,.08)}.back svg,.save svg{width:22px;height:22px}.brandmark{width:105px;height:34px;background:var(--mira);-webkit-mask:url('assets/mira_wordmark.svg') center/contain no-repeat;mask:url('assets/mira_wordmark.svg') center/contain no-repeat}.hero{margin-top:18px;height:220px;border-radius:28px;background:linear-gradient(135deg,#ff5a95,#ff8fbb 40%,#ffc8a1 68%,#7ccfff);position:relative;overflow:hidden;box-shadow:0 18px 42px rgba(92,50,76,.13)}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.17)}.hero:before{width:180px;height:180px;right:-55px;top:-45px}.hero:after{width:120px;height:120px;left:-30px;bottom:-35px}.badge{position:absolute;top:16px;left:16px;background:#fff;color:var(--pink);padding:7px 10px;border-radius:999px;font-size:9px;font-weight:800}.logo{position:absolute;right:18px;bottom:18px;width:64px;height:64px;border-radius:20px;background:#fff;display:grid;place-items:center;color:var(--pink);font-size:23px;font-weight:800;box-shadow:0 10px 25px rgba(92,50,76,.18)}.content{padding:20px 2px 0}.store{font-size:12px;font-weight:700;color:var(--muted)}h1{font-size:25px;line-height:1.18;margin:5px 0 8px;letter-spacing:-.5px}.desc{font-size:12px;line-height:1.7;color:var(--muted);margin:0}.offer{margin-top:17px;background:linear-gradient(135deg,#fff2f7,#f4fbff);border:1px solid var(--line);border-radius:20px;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.offer strong{font-size:25px;color:var(--pink)}.offer span{font-size:10px;color:var(--muted)}.section{margin-top:19px}.section h3{font-size:14px;margin:0 0 9px}.info{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 14px;font-size:11px;line-height:1.6;color:var(--muted)}.row{display:flex;gap:9px;align-items:flex-start}.row+ .row{margin-top:10px}.row svg{width:18px;height:18px;color:var(--pink);flex:0 0 auto}.primary{margin-top:20px;width:100%;border:0;border-radius:16px;padding:14px;background:linear-gradient(90deg,var(--pink),var(--pink2),var(--peach));color:#fff;font:700 13px Poppins}.saved{background:var(--pink)!important;color:#fff!important}[dir=rtl] .badge{left:auto;right:16px}[dir=rtl] .logo{right:auto;left:18px}</style></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><div class="brandmark" aria-label="MIRA"></div><button class="save" id="saveBtn" aria-label="Save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 21s-8-4.7-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6.3-8 11-8 11z"/></svg></button></div><section class="hero"><span class="badge" id="badge"></span><div class="logo" id="logo">M</div></section><div class="content"><div class="store" id="store"></div><h1 id="title"></h1><p class="desc" id="desc"></p><div class="offer"><div><strong id="discount"></strong><br><span id="offerLabel"></span></div><span id="validity"></span></div><section class="section"><h3 id="detailsTitle"></h3><div class="info"><div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11z"/><circle cx="12" cy="10" r="2"/></svg><span id="areaText"></span></div><div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="timeText"></span></div></div></section><section class="section"><h3 id="termsTitle"></h3><div class="info" id="terms"></div></section><button class="primary" id="actionBtn"></button></div></main><script>const q=new URLSearchParams(location.search),l=localStorage.getItem('mira_lang')||'en';document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';const T={en:{badge:'MIRA OFFER',store:'MIRA Partner',title:'Special offer just for you',desc:'A promoted offer selected and managed by MIRA. Final merchant details and redemption rules can be connected to the admin system later.',offer:'Offer value',valid:'Valid for a limited time',details:'Offer details',terms:'Terms & conditions',area:'Available in your selected area',time:'Availability is controlled by the offer start and end dates.',termsText:'Offer availability, branches and redemption conditions are managed by MIRA and the participating merchant.',action:'View store',saved:'Saved'},ar:{badge:'عرض MIRA',store:'شريك MIRA',title:'عرض خاص إلك',desc:'عرض ترويجي مختار ومدار من MIRA. تفاصيل المتجر وشروط الاستفادة يمكن ربطها لاحقاً بنظام الإدارة.',offer:'قيمة العرض',valid:'متاح لفترة محدودة',details:'تفاصيل العرض',terms:'الشروط والأحكام',area:'متاح ضمن المنطقة المختارة',time:'توفر العرض يعتمد على تاريخ البداية والنهاية.',termsText:'توفر العرض والفروع وشروط الاستفادة تتم إدارتها من MIRA والمتجر المشارك.',action:'عرض المتجر',saved:'تم الحفظ'},es:{badge:'OFERTA MIRA',store:'Socio MIRA',title:'Oferta especial para ti',desc:'Oferta promocionada seleccionada y gestionada por MIRA.',offer:'Valor de oferta',valid:'Disponible por tiempo limitado',details:'Detalles',terms:'Términos',area:'Disponible en tu zona seleccionada',time:'La disponibilidad depende de las fechas de inicio y fin.',termsText:'La disponibilidad y condiciones son gestionadas por MIRA y el comercio participante.',action:'Ver tienda',saved:'Guardado'},ru:{badge:'ПРЕДЛОЖЕНИЕ MIRA',store:'Партнер MIRA',title:'Специальное предложение',desc:'Продвигаемое предложение, выбранное и управляемое MIRA.',offer:'Размер скидки',valid:'Ограниченное время',details:'Детали',terms:'Условия',area:'Доступно в выбранном районе',time:'Доступность определяется датами начала и окончания.',termsText:'Условия и доступность управляются MIRA и партнером.',action:'Открыть магазин',saved:'Сохранено'},tr:{badge:'MIRA FIRSATI',store:'MIRA Ortağı',title:'Sana özel fırsat',desc:'MIRA tarafından seçilen ve yönetilen tanıtımlı fırsat.',offer:'Fırsat değeri',valid:'Sınırlı süre geçerli',details:'Fırsat detayları',terms:'Koşullar',area:'Seçili bölgede mevcut',time:'Fırsat başlangıç ve bitiş tarihleriyle yönetilir.',termsText:'Koşullar ve kullanım MIRA ile katılımcı mağaza tarafından yönetilir.',action:'Mağazayı gör',saved:'Kaydedildi'}};const t=T[l]||T.en;function area(){const m=localStorage.getItem('mira_market')||'IQ',c=localStorage.getItem('mira_city')||'all';return (c==='all'?m:m+' · '+c.replace(/(^|-)\w/g,x=>x.toUpperCase()))}const name=q.get('name')||t.store,discount=q.get('discount')||'25% OFF',letter=(q.get('letter')||name[0]||'M').toUpperCase(),type=q.get('type')||'offer';badge.textContent=type==='store'?t.store:t.badge;logo.textContent=letter;store.textContent=name;title.textContent=q.get('title')||t.title;desc.textContent=t.desc;document.getElementById('discount').textContent=discount;offerLabel.textContent=t.offer;validity.textContent=t.valid;detailsTitle.textContent=t.details;termsTitle.textContent=t.terms;areaText.textContent=t.area+' · '+area();timeText.textContent=t.time;terms.textContent=t.termsText;actionBtn.textContent=t.action;actionBtn.onclick=()=>alert(t.action);const id=q.get('id')||[name,discount].join('-').toLowerCase().replace(/[^a-z0-9]+/g,'-');function savedList(){try{return JSON.parse(localStorage.getItem('mira_saved')||'[]')}catch(e){return[]}}function sync(){const s=savedList(),on=s.some(x=>x.id===id);saveBtn.classList.toggle('saved',on);saveBtn.setAttribute('aria-label',on?t.saved:'Save')}saveBtn.onclick=()=>{let s=savedList();const i=s.findIndex(x=>x.id===id);if(i>=0)s.splice(i,1);else s.push({id,name,title:title.textContent,discount,letter,type});localStorage.setItem('mira_saved',JSON.stringify(s));sync()};sync()</script></body></html>
